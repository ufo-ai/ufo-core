# The slot's one origin, split the way the hosted ingress splits the app host: the gateway's
# browser-facing doors go to ufo-control, every product route goes to serve. Same host, so the
# host-only session cookie the gateway binds is the one the portal reads, and the portal's own
# /login and /logout doors land where they do in production. Upstreams are resolved through
# Docker's DNS on each request, so a recreated serve or gateway is reached on its new address
# without restarting this container.
server {
    listen 8080;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8080;
    set $serve http://serve:8710;

    location = /healthz { proxy_pass $gateway; }
    location /login { proxy_pass $gateway; }
    location /logout { proxy_pass $gateway; }
    location /join { proxy_pass $gateway; }
    location /v1/onboard { proxy_pass $gateway; }
    location /ufo { proxy_pass $gateway; }
    location / { proxy_pass $serve; }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
