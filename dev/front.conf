# The slot's one origin, split the way the hosted ingress splits the app host: the gateway's
# browser-facing doors go to ufo-control, the portal page and its modules go to the frontend's dev
# server, every other product route goes to serve. Same host, so the host-only session cookie the
# gateway binds is the one the portal reads, and the portal's own /login and /logout doors land
# where they do in production. Upstreams are resolved through Docker's DNS on each request, so a
# recreated serve, gateway or web is reached on its new address without restarting this container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}
# A read of the page is the dev server's; the sign-in form posts to the same path and lands on serve.
map $request_method $portal_page {
    GET     http://web:5173;
    default http://serve:8710;
}
server {
    listen 8080;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8080;
    set $serve http://serve:8710;
    set $web http://web:5173;

    location = /healthz { proxy_pass $gateway; }
    location /login { proxy_pass $gateway; }
    location /logout { proxy_pass $gateway; }
    location /join { proxy_pass $gateway; }
    location /v1/onboard { proxy_pass $gateway; }
    location /ufo { proxy_pass $gateway; }
    location ~ ^/surface/web/?$ { proxy_pass $portal_page; }
    location /surface/web/static/ { proxy_pass $web; }
    location / { proxy_pass $serve; }

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
