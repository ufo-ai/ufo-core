[pack]
name = "__PACK__"

[research]
search_provider = "perplexity"

[browser]
cdp_provider = "sandbox_chrome"

[serve]
host = "0.0.0.0"
port = 8710

[database]
url = "__SERVE_DSN__"

[blob]
backend = "filesystem"
root = "/data/blobs"

[hub]
backend = "in_process"

[sandbox]
backend = "local"
workspace_root = "/data/workspaces"
ingress_public_url = "__INGRESS_PUBLIC_URL__"
apps_dev_server = "http://web:5174"

[connect]
public_base_url = "__PUBLIC_BASE_URL__"

[flags]
backend = "open"
