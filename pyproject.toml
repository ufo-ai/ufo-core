[tool.uv.workspace]
members = ["core", "extensions/*", "packs/*", "testsupport"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["extensions/**/skills/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PTH", "RUF", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["selfhost"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "sync HTTP client blocks the loop; use httpx.AsyncClient" }
"psycopg2" = { msg = "sync driver; use psycopg via selfhost.db" }

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "core/src"
files = ["core/src/selfhost", "extensions", "gates.py"]
exclude = ["extensions/.*/skills/", "extensions/.*/tests/", "extensions/.*/evals/"]

[[tool.mypy.overrides]]
module = ["asyncpg", "aiobotocore.*", "botocore.*", "lz4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "extensions/*/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: end-to-end against a real dependency (a live model, a real container) — never a fake; gated + serial",
    "docker: needs a working Docker daemon (builds and runs a real container)",
    "serial: shares the process-singleton DBOS executor, a live container, or one database — must not run in parallel",
]
