[project]
name = "ufo"
version = "0.1.0"
description = "An agent runtime with its first-party extensions, packs, and operator evals"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.7.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "anthropic>=0.116",
    "asyncpg>=0.31.0",
    "click>=8.1",
    "croniter>=2.0",
    "cryptography>=49.0.0",
    "dbos>=2.28",
    "dnspython>=2.8",
    "e2b>=2.29",
    "fastapi>=0.115",
    "fastmcp>=3.4.2",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "lz4>=4.3",
    "openai>=1.50",
    "opentelemetry-api>=1.43",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
    "opentelemetry-sdk>=1.43",
    "pillow>=10.4",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "redis>=5",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "referencing>=0.35",
    "sqlalchemy[asyncio]>=2.0",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
    "grpcio>=1.74",
    "protobuf>=6.31.1",
]

[project.scripts]
ufoctl = "ufo.cli:main"

[project.entry-points."ufo.extension"]
bedrock = "ufo_ext_bedrock:manifest"
brief_pipeline = "ufo_ext_brief_pipeline.manifest:manifest"
browser = "ufo_ext_browser.manifest:manifest"
browser_use = "ufo_ext_browser_use:manifest"
browserbase = "ufo_ext_browserbase:manifest"
coding = "ufo_ext_coding.manifest:manifest"
composio = "ufo_ext_composio.manifest:manifest"
connectors = "ufo_ext_connectors.manifest:manifest"
debugger = "ufo_ext_debugger.manifest:manifest"
docker = "ufo_ext_docker:manifest"
documents = "ufo_ext_documents.manifest:manifest"
e2b = "ufo_ext_e2b:manifest"
embed_openai = "ufo_ext_embed_openai:manifest"
eval_env = "ufo_ext_eval_env.manifest:manifest"
index_default = "ufo_ext_index_default:manifest"
imessage = "ufo_ext_imessage.manifest:manifest"
keyed_connectors = "ufo_ext_keyed_connectors:manifest"
mcp = "ufo_ext_mcp:manifest"
memory = "ufo_ext_memory.manifest:manifest"
metronome = "ufo_ext_metronome:manifest"
monitors = "ufo_ext_monitors.manifest:manifest"
objectives = "ufo_ext_objectives.manifest:manifest"
openrouter = "ufo_ext_openrouter:manifest"
perplexity = "ufo_ext_perplexity:manifest"
pipedream = "ufo_ext_pipedream.manifest:manifest"
redis_hub = "ufo_ext_redis_hub.manifest:manifest"
repl = "ufo_ext_repl.manifest:manifest"
research = "ufo_ext_research.manifest:manifest"
sample = "ufo_ext_sample:manifest"
sandbox_chrome = "ufo_ext_sandbox_chrome:manifest"
scheduled_tasks = "ufo_ext_scheduled_tasks.manifest:manifest"
sweep = "ufo_ext_sweep.manifest:manifest"
self_improvement = "ufo_ext_self_improvement.manifest:manifest"
sites = "ufo_ext_sites.manifest:manifest"
skill_create = "ufo_ext_skill_create.manifest:manifest"
slack = "ufo_ext_slack.manifest:manifest"
sources = "ufo_ext_sources.manifest:manifest"
todos = "ufo_ext_todos:manifest"
turbopuffer = "ufo_ext_turbopuffer:manifest"
ufo = "ufo_ext_ufo.manifest:manifest"
web = "ufo_ext_web.manifest:manifest"

[project.entry-points."ufo.pack"]
assistant = "ufo_pack_assistant:pack"
assistant_billing = "ufo_pack_assistant_billing:pack"
assistant_eval = "ufo_pack_assistant_eval:pack"
assistant_hosted = "ufo_pack_assistant_hosted:pack"
chief_of_staff = "ufo_pack_chief_of_staff:pack"
dsqa_browser = "ufo_pack_dsqa_eval:browser_pack"
dsqa_core = "ufo_pack_dsqa_eval:core_pack"
dsqa_search = "ufo_pack_dsqa_eval:search_pack"
gdpval_core = "ufo_pack_gdpval_eval:core_pack"
gdpval_documents = "ufo_pack_gdpval_eval:documents_pack"
gdpval_full = "ufo_pack_gdpval_eval:full_pack"
gdpval_research = "ufo_pack_gdpval_eval:research_pack"
sample_pack = "ufo_pack_sample:pack"

[project.entry-points.pytest11]
ufo_testsupport = "ufo_testsupport.plugin"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    # Ships the official actionlint release binary, so the workflow gate needs no separate install.
    "actionlint-py>=1.7.12.24",
    "mammoth>=1.8",
    "mypy>=1.13",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "types-croniter>=6.2",
    "types-jsonschema>=4.23",
    "types-openpyxl>=3.1",
    "types-protobuf>=6.30",
    "types-pyyaml>=6.0",
    "types-grpcio>=1.83.0.20260730",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One wheel bundles core, every first-party extension, every pack, and the eval runner. Package
# extensions and packs
# (a source directory whose basename is the import name) map 1:1 through `packages`; the source tree
# stays in core/, extensions/*, packs/*, testsupport/ exactly as it lives.
# `artifacts` ships the npm-built pages — the debugger's and the portal's: hatchling drops
# VCS-ignored files even under explicit `packages`, and this is its escape hatch for build products
# that must ride the wheel. The portal emits hashed asset names, so its entry names a glob.
[tool.hatch.build]
artifacts = [
    "/extensions/debugger/ufo_ext_debugger/static/index.html",
    "/extensions/web/ufo_ext_web/static/index.html",
    "/extensions/web/ufo_ext_web/static/assets/*",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core/src/ufo",
    "extensions/brief_pipeline/ufo_ext_brief_pipeline",
    "extensions/browser/ufo_ext_browser",
    "extensions/coding/ufo_ext_coding",
    "extensions/composio/ufo_ext_composio",
    "extensions/connectors/ufo_ext_connectors",
    "extensions/debugger/ufo_ext_debugger",
    "extensions/documents/ufo_ext_documents",
    "evals",
    "extensions/eval_env/ufo_ext_eval_env",
    "extensions/imessage/ufo_ext_imessage",
    "extensions/memory/ufo_ext_memory",
    "extensions/monitors/ufo_ext_monitors",
    "extensions/pipedream/ufo_ext_pipedream",
    "extensions/redis_hub/ufo_ext_redis_hub",
    "extensions/repl/ufo_ext_repl",
    "extensions/research/ufo_ext_research",
    "extensions/scheduled_tasks/ufo_ext_scheduled_tasks",
    "extensions/sweep/ufo_ext_sweep",
    "extensions/self_improvement/ufo_ext_self_improvement",
    "extensions/sites/ufo_ext_sites",
    "extensions/skill_create/ufo_ext_skill_create",
    "extensions/slack/ufo_ext_slack",
    "extensions/sources/ufo_ext_sources",
    "extensions/ufo/ufo_ext_ufo",
    "extensions/web/ufo_ext_web",
    "testsupport/ufo_testsupport",
]
exclude = ["**/__pycache__", "**/*.pyc"]

# Single-file extensions and packs. The ones that ship sibling data (a `migrations/`, `skills/`, or
# a data file) map into a package directory so the runtime's `_package_dir` / `Path(__file__).parent`
# resolve that data uniquely per extension; the dataless ones map to a flat top-level module.
[tool.hatch.build.targets.wheel.force-include]
"extensions/bedrock/ufo_ext_bedrock.py" = "ufo_ext_bedrock.py"
"extensions/browserbase/ufo_ext_browserbase.py" = "ufo_ext_browserbase.py"
"extensions/docker/ufo_ext_docker.py" = "ufo_ext_docker.py"
"extensions/e2b/ufo_ext_e2b.py" = "ufo_ext_e2b.py"
"extensions/embed_openai/ufo_ext_embed_openai.py" = "ufo_ext_embed_openai.py"
"extensions/keyed_connectors/ufo_ext_keyed_connectors.py" = "ufo_ext_keyed_connectors.py"
"extensions/mcp/ufo_ext_mcp.py" = "ufo_ext_mcp.py"
"extensions/metronome/ufo_ext_metronome.py" = "ufo_ext_metronome.py"
"extensions/openrouter/ufo_ext_openrouter.py" = "ufo_ext_openrouter.py"
"extensions/perplexity/ufo_ext_perplexity.py" = "ufo_ext_perplexity.py"
"extensions/sandbox_chrome/ufo_ext_sandbox_chrome.py" = "ufo_ext_sandbox_chrome.py"
"extensions/turbopuffer/ufo_ext_turbopuffer.py" = "ufo_ext_turbopuffer.py"
"extensions/index_default/ufo_ext_index_default.py" = "ufo_ext_index_default/__init__.py"
"extensions/index_default/migrations" = "ufo_ext_index_default/migrations"
"extensions/sample/ufo_ext_sample.py" = "ufo_ext_sample/__init__.py"
"extensions/sample/skills" = "ufo_ext_sample/skills"
"extensions/sample/migrations" = "ufo_ext_sample/migrations"
"extensions/browser_use/ufo_ext_browser_use.py" = "ufo_ext_browser_use/__init__.py"
"extensions/browser_use/browser_use_section.md" = "ufo_ext_browser_use/browser_use_section.md"
"extensions/objectives/ufo_ext_objectives" = "ufo_ext_objectives"
"extensions/objectives/migrations" = "ufo_ext_objectives/migrations"
"extensions/todos/ufo_ext_todos.py" = "ufo_ext_todos/__init__.py"
"extensions/todos/todo_list_section.md" = "ufo_ext_todos/todo_list_section.md"
"packs/assistant_dev/ufo_pack_assistant.py" = "ufo_pack_assistant/__init__.py"
"packs/assistant_dev/skills" = "ufo_pack_assistant/skills"
"packs/assistant_billing/ufo_pack_assistant_billing.py" = "ufo_pack_assistant_billing.py"
"packs/assistant_eval/ufo_pack_assistant_eval.py" = "ufo_pack_assistant_eval.py"
"packs/assistant_hosted/ufo_pack_assistant_hosted.py" = "ufo_pack_assistant_hosted/__init__.py"
"packs/assistant_hosted/skills" = "ufo_pack_assistant_hosted/skills"
"packs/chief_of_staff/ufo_pack_chief_of_staff.py" = "ufo_pack_chief_of_staff/__init__.py"
"packs/chief_of_staff/skills" = "ufo_pack_chief_of_staff/skills"
"packs/dsqa_eval/ufo_pack_dsqa_eval.py" = "ufo_pack_dsqa_eval.py"
"packs/gdpval_eval/ufo_pack_gdpval_eval.py" = "ufo_pack_gdpval_eval.py"
"packs/sample_pack/ufo_pack_sample.py" = "ufo_pack_sample/__init__.py"
"packs/sample_pack/skills" = "ufo_pack_sample/skills"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["extensions/**/skills/**", "extensions/imessage/**/proto/**", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PTH", "RUF", "TID", "ERA"]

[tool.ruff.lint.isort]
known-first-party = ["evals", "ufo"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "sync HTTP client blocks the loop; use httpx.AsyncClient" }
"psycopg2" = { msg = "sync driver; use psycopg via ufo.db" }

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "core/src"
files = ["core/src/ufo", "extensions", "evals", "gates.py"]
exclude = ["extensions/.*/skills/", "extensions/.*/tests/", "extensions/imessage/.*/proto/"]

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "aiobotocore.*",
    "botocore.*",
    "lz4.*",
    "mammoth",
    "pdfplumber",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "extensions/*/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: end-to-end against a real dependency (a live model, a real container) — never a fake; gated + serial",
    "docker: needs a working Docker daemon (builds and runs a real container)",
    "serial: shares the process-singleton DBOS executor, a live container, or one database — must not run in parallel",
]

[tool.uv.sources]
