[tool.uv.workspace]
members = ["core", "extensions/*", "packs/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PTH", "RUF", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["selfhost"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "sync HTTP client blocks the loop; use httpx.AsyncClient" }
"psycopg2" = { msg = "sync driver; use psycopg via selfhost.db" }

[tool.pytest.ini_options]
testpaths = ["core/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: end-to-end against a real dependency (a live model, a real container) — never a fake; gated + serial",
    "docker: needs a working Docker daemon (builds and runs a real container)",
    "serial: shares the process-singleton DBOS executor, a live container, or one database — must not run in parallel",
]
