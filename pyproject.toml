[project]
name = "ufo"
version = "0.1.0"
description = "An agent runtime with its first-party extensions and packs"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.7.0",
    "botocore[crt]>=1.43.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "anthropic>=0.116",
    "asyncpg>=0.31.0",
    "brotli>=1.1",
    "click>=8.1",
    "croniter>=2.0",
    "cryptography>=49.0.0",
    "dbos>=3.0,<3.1",
    "e2b>=2.29",
    "fastapi>=0.115",
    "fastmcp>=3.4.2",
    "fonttools>=4.59",
    "httpx>=0.27",
    "jmespath>=1.1",
    "jsonschema>=4.23",
    "lz4>=4.3",
    "openai>=1.50",
    "openfeature-sdk>=0.10",
    "opentelemetry-api>=1.43",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
    "opentelemetry-sdk>=1.43",
    "pillow>=10.4",
    "pydantic>=2.9",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
    "redis>=5",
    "reportlab>=4.4",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "referencing>=0.35",
    "sqlalchemy[asyncio]>=2.0",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
    "emoji>=2.15",
]

[project.scripts]
ufoctl = "ufo.cli:main"

[project.entry-points."ufo.extension"]
browser_use = "ufo_ext_browser_use:manifest"
browserbase = "ufo_ext_browserbase:manifest"
coding = "ufo_ext_coding.manifest:manifest"
composio = "ufo_ext_composio.manifest:manifest"
connectors = "ufo_ext_connectors.manifest:manifest"
context_compact = "ufo_ext_context_compact.manifest:manifest"
context_rollover = "ufo_ext_context_rollover.manifest:manifest"
debugger = "ufo_ext_debugger.manifest:manifest"
docker = "ufo_ext_docker:manifest"
documents = "ufo_ext_documents.manifest:manifest"
embed_openai = "ufo_ext_embed_openai:manifest"
flags_open = "ufo_ext_flags_open:manifest"
gbrain = "ufo_ext_gbrain.manifest:manifest"
index_default = "ufo_ext_index_default:manifest"
keyed_connectors = "ufo_ext_keyed_connectors:manifest"
mcp = "ufo_ext_mcp:manifest"
memory = "ufo_ext_memory.manifest:manifest"
monitors = "ufo_ext_monitors.manifest:manifest"
openrouter = "ufo_ext_openrouter:manifest"
perplexity = "ufo_ext_perplexity:manifest"
pipedream = "ufo_ext_pipedream.manifest:manifest"
rag = "ufo_ext_rag.manifest:manifest"
redis_hub = "ufo_ext_redis_hub.manifest:manifest"
research = "ufo_ext_research.manifest:manifest"
report_digest = "ufo_ext_report_digest.manifest:manifest"
repl = "ufo_ext_repl.manifest:manifest"
sample = "ufo_ext_sample.manifest:manifest"
sandbox_chrome = "ufo_ext_sandbox_chrome:manifest"
scheduled_tasks = "ufo_ext_scheduled_tasks.manifest:manifest"
sites = "ufo_ext_sites.manifest:manifest"
skill_create = "ufo_ext_skill_create.manifest:manifest"
sources = "ufo_ext_sources.manifest:manifest"
todos = "ufo_ext_todos:manifest"
ufo = "ufo_ext_ufo.manifest:manifest"
workspace_credentials = "ufo_ext_workspace_credentials:manifest"

[project.entry-points."ufo.pack"]
assistant = "ufo_pack_assistant:pack"
sample_pack = "ufo_pack_sample:pack"

[project.entry-points.pytest11]
ufo_testsupport = "ufo_testsupport.plugin"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "actionlint-py>=1.7.12.24",
    "mypy>=1.13",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
    "types-croniter>=6.2",
    "types-jmespath>=1.0",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "/extensions/debugger/ufo_ext_debugger/static/*",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core/src/ufo",
    "extensions/coding/ufo_ext_coding",
    "extensions/composio/ufo_ext_composio",
    "extensions/connectors/ufo_ext_connectors",
    "extensions/context_compact/ufo_ext_context_compact",
    "extensions/context_rollover/ufo_ext_context_rollover",
    "extensions/debugger/ufo_ext_debugger",
    "extensions/documents/ufo_ext_documents",
    "extensions/gbrain/ufo_ext_gbrain",
    "extensions/memory/ufo_ext_memory",
    "extensions/monitors/ufo_ext_monitors",
    "extensions/pipedream/ufo_ext_pipedream",
    "extensions/rag/ufo_ext_rag",
    "extensions/redis_hub/ufo_ext_redis_hub",
    "extensions/research/ufo_ext_research",
    "extensions/report_digest/ufo_ext_report_digest",
    "extensions/repl/ufo_ext_repl",
    "extensions/sample/ufo_ext_sample",
    "extensions/scheduled_tasks/ufo_ext_scheduled_tasks",
    "extensions/sites/ufo_ext_sites",
    "extensions/skill_create/ufo_ext_skill_create",
    "extensions/sources/ufo_ext_sources",
    "extensions/ufo/ufo_ext_ufo",
    "sandbox",
    "testsupport/ufo_testsupport",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"extensions/browserbase/ufo_ext_browserbase.py" = "ufo_ext_browserbase.py"
"extensions/docker/ufo_ext_docker.py" = "ufo_ext_docker.py"
"extensions/embed_openai/ufo_ext_embed_openai.py" = "ufo_ext_embed_openai.py"
"extensions/flags_open/ufo_ext_flags_open.py" = "ufo_ext_flags_open.py"
"extensions/keyed_connectors/ufo_ext_keyed_connectors.py" = "ufo_ext_keyed_connectors/__init__.py"
"extensions/keyed_connectors/py.typed" = "ufo_ext_keyed_connectors/py.typed"
"extensions/keyed_connectors/prompts/keyed_connectors_section.md" = "ufo_ext_keyed_connectors/prompts/keyed_connectors_section.md"
"extensions/mcp/ufo_ext_mcp.py" = "ufo_ext_mcp/__init__.py"
"extensions/mcp/py.typed" = "ufo_ext_mcp/py.typed"
"extensions/openrouter/ufo_ext_openrouter.py" = "ufo_ext_openrouter.py"
"extensions/perplexity/ufo_ext_perplexity.py" = "ufo_ext_perplexity.py"
"extensions/sandbox_chrome/ufo_ext_sandbox_chrome.py" = "ufo_ext_sandbox_chrome.py"
"extensions/index_default/ufo_ext_index_default.py" = "ufo_ext_index_default/__init__.py"
"extensions/index_default/py.typed" = "ufo_ext_index_default/py.typed"
"extensions/index_default/migrations" = "ufo_ext_index_default/migrations"
"extensions/browser_use/ufo_ext_browser_use.py" = "ufo_ext_browser_use/__init__.py"
"extensions/browser_use/py.typed" = "ufo_ext_browser_use/py.typed"
"extensions/browser_use/prompts/browser_use_section.md" = "ufo_ext_browser_use/prompts/browser_use_section.md"
"extensions/workspace_credentials/ufo_ext_workspace_credentials.py" = "ufo_ext_workspace_credentials/__init__.py"
"extensions/workspace_credentials/py.typed" = "ufo_ext_workspace_credentials/py.typed"
"extensions/workspace_credentials/migrations" = "ufo_ext_workspace_credentials/migrations"
"extensions/todos/ufo_ext_todos.py" = "ufo_ext_todos/__init__.py"
"extensions/todos/py.typed" = "ufo_ext_todos/py.typed"
"extensions/todos/prompts/todo_list_section.md" = "ufo_ext_todos/prompts/todo_list_section.md"
"packs/assistant_dev/ufo_pack_assistant.py" = "ufo_pack_assistant.py"
"packs/sample_pack/ufo_pack_sample.py" = "ufo_pack_sample/__init__.py"
"packs/sample_pack/py.typed" = "ufo_pack_sample/py.typed"
"packs/sample_pack/skills" = "ufo_pack_sample/skills"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["extensions/**/skills/**", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PTH", "RUF", "TID", "ERA", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"testsupport/**/*.py" = ["C901"]
"**/tests/**/*.py" = ["C901"]

[tool.ruff.lint.isort]
known-first-party = ["ufo"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "sync HTTP client blocks the loop; use httpx.AsyncClient" }
"psycopg2" = { msg = "sync driver; use asyncpg via ufo.db" }

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
mypy_path = "core/src"
files = ["core/src/ufo", "extensions", "gates.py"]
exclude = [
    "extensions/.*/skills/",
    "extensions/.*/tests/",
]

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "aiobotocore.*",
    "botocore.*",
    "lz4.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "extensions/*/tests"]
pythonpath = [".", "core/src"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: end-to-end against a real dependency (a live model, a real container) — never a fake; gated + serial",
    "docker: needs a working Docker daemon (builds and runs a real container)",
    "serial: shares the process-singleton DBOS executor, a live container, or one database — must not run in parallel",
]
