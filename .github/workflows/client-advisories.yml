name: client advisories

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependency-scoped advisory checks
        run: cargo install cargo-deny --git https://github.com/EmbarkStudios/cargo-deny --rev f3e95079d681f3b2ddc16de3679e2b4016510927 --locked
      - name: Check client dependencies
        working-directory: client
        run: cargo deny --locked --format json check --warn unmaintained advisories 2> >(tee advisory-report.jsonl >&2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-advisories
          path: client/advisory-report.jsonl
          if-no-files-found: error
          retention-days: 30
