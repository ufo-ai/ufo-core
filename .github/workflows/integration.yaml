name: integration

on:
  workflow_call:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      # The sandbox image (e2b base + libreoffice + chromium + playwright + pip/npm) is ~6-7 GB and
      # its build peaks near the runner's ~14 GB free disk. Reclaim the large preinstalled toolchains
      # this build never touches so the docker-gated tests can build instead of stalling on space.
      - name: Reclaim runner disk for the sandbox image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The docker-gated tests need the ~6-7 GB sandbox image, and building it is ~3.3 minutes of
      # this job. `sandbox-image.yml` publishes it from main under a tag keyed by the pinned
      # Dockerfile, so a tag that exists was built from this commit's definition on this base: pull
      # it and name it for the fixture. Every miss — this PR changes the definition, the base tag
      # moved, the package was evicted, the key does not derive at all — leaves the env unset and
      # the fixture builds exactly as before. Every call here that leaves the runner is walled — the
      # derivation resolves the floating base tag against an unauthenticated registry, the login
      # talks to ghcr.io, and the pull moves gigabytes — because an unwalled one that never returns
      # burns `timeout-minutes: 45` and takes every test below down with it. Walled, each ends as a
      # miss. Must come after the reclaim step above, whose `docker image prune -af` would delete a
      # freshly pulled image.
      - name: Reuse the published sandbox image when it matches this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/ufo-sandbox
          REGISTRY_USER: ${{ github.actor }}
        run: |
          DOCKERFILE="$RUNNER_TEMP/sandbox.Dockerfile"
          KEY="$(timeout 300 bash .github/scripts/sandbox_image_key.sh "$DOCKERFILE")" || KEY=""
          if [ -n "$KEY" ] \
            && echo "$GH_TOKEN" | timeout 60 docker login ghcr.io -u "$REGISTRY_USER" --password-stdin \
            && timeout 300 docker pull -q "$IMAGE_REPOSITORY:$KEY"; then
            echo "UFO_SANDBOX_TEST_IMAGE=$IMAGE_REPOSITORY:$KEY" >>"$GITHUB_ENV"
          else
            echo "no published image for ${KEY:-an underivable key} — the fixture builds it"
          fi
      # Serial pass: the container/image-build/live turns run one process, no xdist — the ~6-7 GB
      # sandbox image build, the fixed-name MinIO container, and the live integration turns each need
      # a single owner of their shared resource. `integration` tests needing an absent key (a live
      # model) skip with a clear reason; Docker, Postgres, Chrome, and the DevTools ports are
      # required and fail loudly when unavailable so the gate proves its declared coverage.
      - run: make test-integration
