name: Deploy (testing)

# Merge to main → build the images at the commit short SHA, push to ECR (immutable, skip-if-present
# so re-runs are idempotent), publish the E2B sandbox template, then terraform apply pins that tag —
# the hosted-service rollout. PRs touching infra run terraform plan only (against the newest pushed
# image, since the ECR digest data source needs a real tag). workflow_dispatch redeploys a chosen
# tag. Targets envs/testing (stage 1); repoint TF_DIR to envs/prod for stage 2. AWS auth is GitHub
# OIDC → the github-deploy role (no static keys). The edge job applies envs/edge — the zone-level
# Cloudflare worker fronting both apexes — from its own state, in parallel with the deploy.
on:
  push:
    branches: [main]
    paths:
      - core/**
      - control/**
      - packs/**
      - sandbox/**
      - infra/**
      - hosted.toml
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy.yml
  pull_request:
    paths:
      - infra/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/push/deploy (defaults to the commit short SHA)."
        required: false
        default: ""

# Serialize deploys; never cancel an in-flight apply. PR runs get a per-PR group so they can
# never displace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-testing-pr-{0}', github.event.pull_request.number) || 'deploy-testing' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 899147036157.dkr.ecr.us-east-1.amazonaws.com
  DEPLOY_ROLE_ARN: arn:aws:iam::899147036157:role/github-deploy
  TF_DIR: infra/envs/testing
  # The datadog terraform provider (monitors.tf) reads these at plan and apply.
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Deploys tag the commit short SHA; a PR plans against the newest pushed bundle image so the
      # aws_ecr_image digest lookup resolves.
      - name: Image tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG=$(aws ecr describe-images --repository-name ufo --output json \
              | jq -r '[.imageDetails[] | select(.imageTags != null)] | max_by(.imagePushedAt).imageTags[0] // empty')
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::8}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'pull_request'

      # Bundle image: `ufoctl bundle` freezes the assistant_hosted pack into a build context
      # (Dockerfile + ufo.toml + ufo.lock), then docker build installs the pinned ufo distribution.
      - name: Build + push bundle image
        if: github.event_name != 'pull_request'
        run: |
          if aws ecr describe-images --repository-name ufo --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo:$IMAGE_TAG already pushed — skipping"
          else
            UFO_CONFIG=hosted.toml uv run ufoctl bundle --out bundle
            docker build -t "$ECR_REGISTRY/ufo:$IMAGE_TAG" bundle
            docker push "$ECR_REGISTRY/ufo:$IMAGE_TAG"
          fi

      # The hosted carrier is E2B: the sandbox artifact is the `ufo-sbx` template, published and
      # boot-verified from the same layer definition the docker carrier renders. No ECR image.
      - name: Publish E2B sandbox template
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: uv run python sandbox/build_template.py

      - name: Build + push gateway image
        if: github.event_name != 'pull_request'
        run: |
          if aws ecr describe-images --repository-name ufo-control --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo-control:$IMAGE_TAG already pushed — skipping"
          else
            docker build -f control/Dockerfile --build-arg "UFO_IMAGE=$ECR_REGISTRY/ufo:$IMAGE_TAG" -t "$ECR_REGISTRY/ufo-control:$IMAGE_TAG" control
            docker push "$ECR_REGISTRY/ufo-control:$IMAGE_TAG"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          # The mount gate reads role/bucket via $(terraform output -raw …); the wrapper corrupts
          # captured stdout, and nothing here consumes its step outputs.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # image_tag via -var: it must beat the placeholder in terraform.tfvars (tfvars beats TF_VAR_*).
      # -lock=false: plans are read-only and run outside the deploy concurrency group, so they must
      # not contend for the state lock a concurrent apply holds.
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -no-color -lock=false -var "image_tag=$IMAGE_TAG"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve -input=false -var "image_tag=$IMAGE_TAG"

      # Mount gate: the published template + this environment's IAM and bucket must serve a live
      # workspace mount — mint, s3fs mount, write/list/read/chmod/delete — or the deploy goes red
      # instead of surfacing later as a wedged agent.
      - name: Gate sandbox workspace mount
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          uv run python sandbox/mount_gate.py \
            --role-arn "$(terraform -chdir="$TF_DIR" output -raw sandbox_fs_role_arn)" \
            --bucket "$(terraform -chdir="$TF_DIR" output -raw blob_bucket)" \
            --region "$AWS_REGION"

      - name: Gate sandbox egress proxy TLS
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          UFO_EGRESS_CA_CERT="$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_ca_cert)" \
            uv run python sandbox/proxy_gate.py \
            --proxy-url "$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_url)"

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Terraform init
        working-directory: infra/envs/edge
        run: terraform init -input=false

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: infra/envs/edge
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -no-color -lock=false

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: infra/envs/edge
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve -input=false
