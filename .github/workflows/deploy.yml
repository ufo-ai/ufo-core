name: Deploy (testing)

# Merge to main → build the images at the commit short SHA, push to ECR (immutable, skip-if-present
# so re-runs are idempotent), publish the E2B sandbox template, then terraform apply pins that tag —
# the hosted-service rollout. workflow_dispatch redeploys a chosen tag. AWS auth is GitHub OIDC →
# the github-deploy role (no static keys). The edge job
# applies envs/edge — the zone-level Cloudflare worker fronting both apexes — from its own state,
# in parallel with the platform rollout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/push/deploy (defaults to the commit short SHA)."
        required: false
        default: ""

# Serialize deploys; never cancel an in-flight apply. PR runs get a per-PR group so they can
# never displace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-testing-pr-{0}', github.event.pull_request.number) || 'deploy-testing' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 899147036157.dkr.ecr.us-east-1.amazonaws.com
  DEPLOY_ROLE_ARN: arn:aws:iam::899147036157:role/github-deploy
  TF_DIR: infra/envs/testing
  # The datadog terraform provider (monitors.tf) reads these at plan and apply.
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select deployment work
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          DEPLOY_PATHS_PATTERN: ^(\.github/(workflows/deploy\.yml|scripts/terraform_plan_guard\.py)$|infra/(envs/(testing|prod|edge)|modules/(platform|edge)|templates)/)
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/deploy-paths"
          python .github/scripts/deploy_change_gate.py "$RUNNER_TEMP/deploy-paths"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || grep -Eq "$DEPLOY_PATHS_PATTERN" "$RUNNER_TEMP/deploy-paths"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  rollout:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Deploys tag the commit short SHA; a PR plans against the newest pushed bundle image so the
      # aws_ecr_image digest lookup resolves.
      - name: Image tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG=$(aws ecr describe-images --repository-name ufo --output json \
              | jq -r '[.imageDetails[] | select(.imageTags != null)] | max_by(.imagePushedAt).imageTags[0] // empty')
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::8}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request'
        with:
          node-version: 24

      # Bundle image: `ufoctl bundle` freezes the assistant_hosted pack into a build context
      # (Dockerfile + ufo.toml + ufo.lock), then docker build installs the pinned ufo distribution.
      # The debugger and portal apps build first so their static pages ride inside the wheel.
      - name: Build + push bundle image
        if: github.event_name != 'pull_request'
        run: |
          if aws ecr describe-images --repository-name ufo --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo:$IMAGE_TAG already pushed — skipping"
          else
            npm --prefix extensions/debugger/frontend ci
            npm --prefix extensions/debugger/frontend run build
            npm --prefix extensions/web/frontend ci
            npm --prefix extensions/web/frontend run build
            UFO_CONFIG=hosted.toml uv run ufoctl bundle --out bundle
            docker build -t "$ECR_REGISTRY/ufo:$IMAGE_TAG" bundle
            docker push "$ECR_REGISTRY/ufo:$IMAGE_TAG"
          fi

      # The hosted carrier is E2B: the sandbox artifact is the `ufo-sbx` template, published and
      # boot-verified from the same layer definition the docker carrier renders. No ECR image.
      - name: Publish E2B sandbox template
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: uv run python sandbox/build_template.py

      - name: Build + push gateway image
        if: github.event_name != 'pull_request'
        run: |
          if aws ecr describe-images --repository-name ufo-control --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo-control:$IMAGE_TAG already pushed — skipping"
          else
            docker build -f control/Dockerfile --build-arg "UFO_IMAGE=$ECR_REGISTRY/ufo:$IMAGE_TAG" -t "$ECR_REGISTRY/ufo-control:$IMAGE_TAG" control
            docker push "$ECR_REGISTRY/ufo-control:$IMAGE_TAG"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          # Later steps read outputs via $(terraform output -raw …); the wrapper corrupts captured
          # stdout, and nothing here consumes its step outputs.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LOCK=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            LOCK=false
          fi
          terraform plan -input=false -no-color -lock="$LOCK" \
            -out="$RUNNER_TEMP/testing.tfplan" -var "image_tag=$IMAGE_TAG"

      - name: Reject destructive changes
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -json "$RUNNER_TEMP/testing.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false "$RUNNER_TEMP/testing.tfplan"

      - name: Wait for runtime rollout
        if: github.event_name != 'pull_request'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$(terraform -chdir="$TF_DIR" output -raw cluster_name)"
          NAMESPACE="$(terraform -chdir="$TF_DIR" output -raw system_namespace)"
          kubectl --namespace "$NAMESPACE" rollout status deployment/ufo-sandbox-proxy --timeout=15m
          kubectl --namespace "$NAMESPACE" rollout status deployment/ufo-serve --timeout=15m

      - name: Gate sandbox egress proxy TLS
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          UFO_EGRESS_CA_CERT="$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_ca_cert)" \
            uv run python sandbox/proxy_gate.py \
            --proxy-url "$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_url)"

  edge:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/envs/edge
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/edge
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LOCK=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            LOCK=false
          fi
          terraform plan -input=false -no-color -lock="$LOCK" -out="$RUNNER_TEMP/edge.tfplan"

      - name: Reject destructive changes
        working-directory: infra/envs/edge
        run: terraform show -json "$RUNNER_TEMP/edge.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: infra/envs/edge
        run: terraform apply -input=false "$RUNNER_TEMP/edge.tfplan"

  production:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      TF_DIR: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform foundation plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -input=false -no-color -lock=false -out="$RUNNER_TEMP/production.tfplan" -target=module.platform.module.eks

      - name: Reject destructive changes
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -json "$RUNNER_TEMP/production.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

  deploy:
    name: deployment
    needs: [changes, rollout, edge, production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected deployment work
        id: gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOY_SELECTED: ${{ needs.changes.outputs.deploy }}
          EVENT_NAME: ${{ github.event_name }}
          ROLLOUT_RESULT: ${{ needs.rollout.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          case "$DEPLOY_SELECTED" in
            true)
              test "$ROLLOUT_RESULT" = "success"
              test "$EDGE_RESULT" = "success"
              if [ "$EVENT_NAME" = "pull_request" ]; then
                test "$PRODUCTION_RESULT" = "success"
              else
                test "$PRODUCTION_RESULT" = "skipped"
              fi
              ;;
            false)
              test "$ROLLOUT_RESULT" = "skipped"
              test "$EDGE_RESULT" = "skipped"
              test "$PRODUCTION_RESULT" = "skipped"
              echo "No deployment-relevant changes."
              ;;
            *)
              echo "Invalid deployment selection: $DEPLOY_SELECTED" >&2
              exit 1
              ;;
          esac

      # A stuck deploy leaves the previous pods running and emitting logs, so the telemetry monitor
      # reads it as green — main's deploy conclusion has to be its own signal. It is a service check
      # rather than an event because the fleet running stale images is a state, not a moment: the
      # check holds CRITICAL until a later main deploy submits OK, which is also what clears the
      # alert. Every conclusion is submitted, so a reporter that stops working fails this step.
      - name: Report the deploy conclusion to Datadog
        if: always() && github.ref_name == 'main'
        env:
          DD_CHECK_URL: https://api.us5.datadoghq.com/api/v1/check_run
          DEPLOY_CHECK: ufo.deploy.main
          DD_STATUS_OK: "0"
          DD_STATUS_CRITICAL: "2"
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$DD_API_KEY" || { echo 'DD_API_KEY secret is unset' >&2; exit 1; }
          if [ "$GATE_OUTCOME" = success ]; then
            STATUS="$DD_STATUS_OK"
          else
            STATUS="$DD_STATUS_CRITICAL"
          fi
          curl -sS --fail-with-body -X POST "$DD_CHECK_URL" \
            -H "DD-API-KEY: $DD_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg check "$DEPLOY_CHECK" --argjson status "$STATUS" --arg url "$RUN_URL" \
              '[{check: $check, host_name: "github-actions", status: $status, message: $url,
                 tags: ["env:testing"]}]')"
