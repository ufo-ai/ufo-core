name: Deploy (testing)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/push/deploy (defaults to the commit short SHA)."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 899147036157.dkr.ecr.us-east-1.amazonaws.com
  DEPLOY_ROLE_ARN: arn:aws:iam::899147036157:role/github-deploy
  TF_DIR: infra/envs/testing
  # The `ufo` binary the sandbox image bakes, out of the five-target set the client job stages. The
  # sandbox base is amd64, so the template publish takes the musl build for that architecture.
  SANDBOX_CLIENT_BINARY: servers/control/clientbin/x86_64-unknown-linux-musl/ufo
  # The datadog terraform provider (monitors.tf) reads these at plan and apply.
  DD_API_KEY: ${{ secrets.DD_API_KEY }}
  DD_APP_KEY: ${{ secrets.DD_APP_KEY }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      image_tag: ${{ steps.tag.outputs.tag }}
      client_build: ${{ steps.client.outputs.build }}
      client_tree: ${{ steps.client.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select deployment work
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          DEPLOY_PATHS_PATTERN: ^(\.github/(workflows/deploy(-production)?\.yml|scripts/(deploy_change_gate\.py|terraform_plan_guard\.py|production_prerequisites\.sh))$|infra/(production_secrets|testing_secrets)\.py$|infra/(production-access|envs/(testing|prod|edge)|modules/(platform|edge)|templates)/)
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/deploy-paths"
          git diff --no-renames "$BASE_SHA...$HEAD_SHA" -- infra/modules/platform/iam.tf infra/modules/platform/ses.tf > "$RUNNER_TEMP/auth-diff"
          python .github/scripts/deploy_change_gate.py "$RUNNER_TEMP/deploy-paths" "$RUNNER_TEMP/auth-diff"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || grep -Eq "$DEPLOY_PATHS_PATTERN" "$RUNNER_TEMP/deploy-paths"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.select.outputs.deploy == 'true'
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploys tag the commit short SHA; a PR plans against the newest pushed bundle image so the
      # aws_ecr_image digest lookup resolves.
      - name: Image tag
        id: tag
        if: steps.select.outputs.deploy == 'true'
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TAG=$(aws ecr describe-images --repository-name ufo --output json \
              | jq -r '[.imageDetails[] | select(.imageTags != null)] | max_by(.imagePushedAt).imageTags[0] // empty')
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::8}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The binaries of a client tree are pushed once as ufo-clientbin:<git tree hash of client/>;
      # a tag hit means this client source already built, so the five-target build is skipped and
      # the gateway job copies the pushed set into its build context. The hash names the content,
      # so different client source is always a miss and the immutable tag is never contested.
      - name: Select client work
        id: client
        if: steps.select.outputs.deploy == 'true'
        run: |
          CLIENT_TREE=$(git rev-parse HEAD:client)
          echo "tree=$CLIENT_TREE" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name ufo-clientbin --image-ids imageTag="$CLIENT_TREE" >/dev/null 2>&1; then
            echo "ufo-clientbin:$CLIENT_TREE already pushed — skipping client builds"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  client:
    needs: changes
    if: needs.changes.outputs.client_build == 'true'
    strategy:
      matrix:
        include:
          - {target: aarch64-apple-darwin, runner: macos-14}
          - {target: x86_64-apple-darwin, runner: macos-14}
          - {target: x86_64-unknown-linux-musl, runner: ubuntu-24.04}
          - {target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm}
          - {target: x86_64-pc-windows-msvc, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/client-gh
        with:
          target: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: ${{ matrix.target }}

      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - working-directory: client
        run: cargo build --release --target ${{ matrix.target }}

      # Stage as <target>/<binary> so the merged download lands the whole tree the gateway
      # serves from UFO_CLIENT_BIN_DIR.
      - name: Stage the binary under its target
        shell: bash
        run: |
          BIN=ufo
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            BIN=ufo.exe
          fi
          mkdir -p "stage/${{ matrix.target }}"
          cp "client/target/${{ matrix.target }}/release/$BIN" "stage/${{ matrix.target }}/$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: clientbin-${{ matrix.target }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  # Bundle image: `ufoctl bundle` freezes the assistant_hosted pack into a build context
  # (Dockerfile + ufo.toml + ufo.lock), then docker build installs the pinned ufo distribution.
  # The debugger and portal apps build first so their static pages ride inside the wheel.
  bundle:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            extensions/debugger/frontend/pnpm-lock.yaml
            extensions/web/frontend/pnpm-lock.yaml

      - name: Build + push bundle image
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: us5.datadoghq.com
        run: |
          if aws ecr describe-images --repository-name ufo --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo:$IMAGE_TAG already pushed — skipping"
          else
            pnpm -C extensions/debugger/frontend install --frozen-lockfile
            pnpm -C extensions/debugger/frontend run build
            pnpm -C extensions/web/frontend install --frozen-lockfile
            pnpm -C extensions/web/frontend run build
            # A fault Datadog reports against a recorded session reads as source rather than as
            # minified frames. The maps upload under the service and version the page records with,
            # then leave the tree: nothing serves a `.map`, and the image carries none.
            extensions/web/frontend/node_modules/.bin/datadog-ci sourcemaps upload \
              extensions/web/ufo_ext_web/static/assets \
              --service=ufo-portal --release-version="$IMAGE_TAG" \
              --minified-path-prefix=/surface/web/static/assets/
            rm -f extensions/web/ufo_ext_web/static/assets/*.map
            UFO_CONFIG=hosted.toml uv run ufoctl bundle --out bundle
            docker build -t "$ECR_REGISTRY/ufo:$IMAGE_TAG" bundle
            docker run --rm --entrypoint python "$ECR_REGISTRY/ufo:$IMAGE_TAG" \
              -c 'from ufo.ext.loader import load_manifests; load_manifests("assistant_hosted")'
            docker push "$ECR_REGISTRY/ufo:$IMAGE_TAG"
          fi

  # Sandbox cache daemon (RFC 0032), egress proxy (RFC 0035), and preview renderer (RFC 0037):
  # Rust services rebuilt only when their source changes. Each built image carries two tags — the
  # deploy's IMAGE_TAG and the git tree hash of its directory — so a deploy whose tree already
  # built retags the pushed image instead of compiling it again. Images push before the apply that
  # points the Deployments at this tag: a push afterwards starts the new ReplicaSet's progress
  # deadline against an image that does not exist yet. The repositories are created by terraform
  # (ecr.tf), which applies later in rollout — a brand-new environment skips the push on its first
  # run and the next deploy lands the image.
  images:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {repository: ufo-cache, dir: servers/cache}
          - {repository: ufo-egress, dir: servers/egress}
          - {repository: ufo-preview, dir: servers/preview}
    env:
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Select image work
        id: select
        env:
          REPOSITORY: ${{ matrix.repository }}
          DIR: ${{ matrix.dir }}
        run: |
          TREE=$(git rev-parse "HEAD:$DIR")
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          if ! aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1; then
            echo "$REPOSITORY repository not provisioned yet (terraform apply creates it) — skipping"
            echo "work=none" >> "$GITHUB_OUTPUT"
          elif aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "$REPOSITORY:$IMAGE_TAG already pushed — skipping"
            echo "work=none" >> "$GITHUB_OUTPUT"
          elif aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TREE" >/dev/null 2>&1; then
            echo "$REPOSITORY:$TREE already built — retagging"
            echo "work=retag" >> "$GITHUB_OUTPUT"
          else
            echo "work=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag the built tree
        if: steps.select.outputs.work == 'retag'
        run: >
          docker buildx imagetools create
          -t "$ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG"
          "$ECR_REGISTRY/${{ matrix.repository }}:${{ steps.select.outputs.tree }}"

      - uses: docker/setup-buildx-action@v3
        if: steps.select.outputs.work == 'build'

      - uses: docker/build-push-action@v6
        if: steps.select.outputs.work == 'build'
        with:
          context: ${{ matrix.dir }}
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}

      # After the push so a concurrent deploy of the same tree cannot fail the build: the tag is
      # immutable and content-addressed, so losing the race means the identical source is already
      # tagged.
      - name: Tag the built tree
        if: steps.select.outputs.work == 'build'
        env:
          REPOSITORY: ${{ matrix.repository }}
          TREE: ${{ steps.select.outputs.tree }}
        run: |
          if ! OUTPUT=$(docker buildx imagetools create -t "$ECR_REGISTRY/$REPOSITORY:$TREE" "$ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG" 2>&1); then
            printf '%s\n' "$OUTPUT" >&2
            case "$OUTPUT" in
              *"already exists"*) echo "$REPOSITORY:$TREE pushed by a concurrent deploy" ;;
              *) exit 1 ;;
            esac
          fi

  # The gateway image carries the ufo-control binary and the client binaries it serves, so its
  # sources are the control tree and the client tree, joined as one tag: a deploy whose pair
  # already built retags the pushed image instead of compiling it again.
  gateway:
    needs: [changes, client]
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' && github.event_name != 'pull_request' && (needs.client.result == 'success' || needs.client.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      CLIENT_TREE: ${{ needs.changes.outputs.client_tree }}
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Select image work
        id: select
        run: |
          SOURCES="$(git rev-parse HEAD:servers/control)-$CLIENT_TREE"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name ufo-control --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "ufo-control:$IMAGE_TAG already pushed — skipping"
            echo "work=none" >> "$GITHUB_OUTPUT"
          elif aws ecr describe-images --repository-name ufo-control --image-ids imageTag="$SOURCES" >/dev/null 2>&1; then
            echo "ufo-control:$SOURCES already built — retagging"
            echo "work=retag" >> "$GITHUB_OUTPUT"
          else
            echo "work=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag the built sources
        if: steps.select.outputs.work == 'retag'
        run: >
          docker buildx imagetools create
          -t "$ECR_REGISTRY/ufo-control:$IMAGE_TAG"
          "$ECR_REGISTRY/ufo-control:${{ steps.select.outputs.sources }}"

      # The five client binaries land as clientbin/<target>/<binary> in the gateway build
      # context, where the Dockerfile copies them under UFO_CLIENT_BIN_DIR.
      - uses: actions/download-artifact@v4
        if: steps.select.outputs.work == 'build' && needs.client.result == 'success'
        with:
          pattern: clientbin-*
          merge-multiple: true
          path: servers/control/clientbin

      - name: Reuse the pushed client binaries
        if: steps.select.outputs.work == 'build' && needs.client.result == 'skipped'
        run: |
          docker create --name clientbin "$ECR_REGISTRY/ufo-clientbin:$CLIENT_TREE" noop
          docker cp clientbin:/clientbin/. servers/control/clientbin
          docker rm clientbin

      - uses: docker/setup-buildx-action@v3
        if: steps.select.outputs.work == 'build'

      - uses: docker/build-push-action@v6
        if: steps.select.outputs.work == 'build'
        with:
          context: servers/control
          push: true
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/ufo-control:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=ufo-control
          cache-to: type=gha,mode=max,scope=ufo-control

      - name: Tag the built sources
        if: steps.select.outputs.work == 'build'
        env:
          SOURCES: ${{ steps.select.outputs.sources }}
        run: |
          if ! OUTPUT=$(docker buildx imagetools create -t "$ECR_REGISTRY/ufo-control:$SOURCES" "$ECR_REGISTRY/ufo-control:$IMAGE_TAG" 2>&1); then
            printf '%s\n' "$OUTPUT" >&2
            case "$OUTPUT" in
              *"already exists"*) echo "ufo-control:$SOURCES pushed by a concurrent deploy" ;;
              *) exit 1 ;;
            esac
          fi

  rollout:
    needs: [changes, client, bundle, images, gateway]
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' && (needs.client.result == 'success' || needs.client.result == 'skipped') && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped') && (needs.images.result == 'success' || needs.images.result == 'skipped') && (needs.gateway.result == 'success' || needs.gateway.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Serialize applies; never cancel an in-flight one. Image builds run outside the group — they
    # are tag-guarded and idempotent — so a queued deploy builds while the previous one applies.
    # PR runs get a per-PR group so they can never displace a queued deploy.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-testing-pr-{0}', github.event.pull_request.number) || 'deploy-testing' }}
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'pull_request'
        with:
          python-version: "3.12"
          enable-cache: true

      # The sandbox image bakes the compiled `ufo` client, so the template publish below needs the
      # linux binary this workflow's own client job already built — never a second Rust build here,
      # and never a toolchain layer inside the sandbox image. A skipped client job means this tree
      # already built, and the same pushed set the gateway reuses carries it. Both land the tree at
      # `clientbin/<target>/ufo`, which UFO_CLIENT_BINARY names for the publish.
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request' && needs.client.result == 'success'
        with:
          pattern: clientbin-*
          merge-multiple: true
          path: servers/control/clientbin

      - name: Reuse the pushed client binaries
        if: github.event_name != 'pull_request' && needs.client.result == 'skipped'
        env:
          CLIENT_TREE: ${{ needs.changes.outputs.client_tree }}
        run: |
          docker create --name clientbin "$ECR_REGISTRY/ufo-clientbin:$CLIENT_TREE" noop
          docker cp clientbin:/clientbin/. servers/control/clientbin
          docker rm clientbin

      - name: Select sandbox template
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          UFO_CLIENT_BINARY: ${{ env.SANDBOX_CLIENT_BINARY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            E2B_TEMPLATES=small=ufo-sbx-small,medium=ufo-sbx-medium,large=ufo-sbx-large
          else
            E2B_TEMPLATES=$(uv run python sandbox/build_template.py)
          fi
          test -n "$E2B_TEMPLATES"
          echo "E2B_TEMPLATES=$E2B_TEMPLATES" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          # Later steps read outputs via $(terraform output -raw …); the wrapper corrupts captured
          # stdout, and nothing here consumes its step outputs.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Write testing runtime secrets
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SPECTRUM_PROJECT_ID: ${{ secrets.TESTING_SPECTRUM_PROJECT_ID }}
          SPECTRUM_PROJECT_SECRET: ${{ secrets.TESTING_SPECTRUM_PROJECT_SECRET }}
          TESTING_API_KEYS_SECRET_ID: ufo/ufo-testing/api-keys
          TESTING_DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run python infra/testing_secrets.py

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LOCK=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            LOCK=false
          fi
          terraform plan -input=false -no-color -lock="$LOCK" \
            -out="$RUNNER_TEMP/testing.tfplan" -var "image_tag=$IMAGE_TAG" \
            -var "e2b_templates=$E2B_TEMPLATES"

      - name: Reject destructive changes
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -json "$RUNNER_TEMP/testing.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

      - name: Refresh testing runtime secrets
        if: github.event_name != 'pull_request'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$(terraform -chdir="$TF_DIR" output -raw cluster_name)"
          NAMESPACE="$(terraform -chdir="$TF_DIR" show -json "$RUNNER_TEMP/testing.tfplan" \
            | jq -er '.planned_values.outputs.system_namespace.value')"
          python infra/secret_sync.py \
            "$NAMESPACE" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false "$RUNNER_TEMP/testing.tfplan"

      # After the apply so a first run creates the ufo-clientbin repository before the push.
      - name: Push the client binaries for this tree
        if: github.event_name != 'pull_request' && needs.client.result == 'success'
        env:
          CLIENT_TREE: ${{ needs.changes.outputs.client_tree }}
        run: |
          if aws ecr describe-images --repository-name ufo-clientbin --image-ids imageTag="$CLIENT_TREE" >/dev/null 2>&1; then
            echo "ufo-clientbin:$CLIENT_TREE already pushed — skipping"
          else
            printf 'FROM scratch\nCOPY . /clientbin\n' | docker build -t "$ECR_REGISTRY/ufo-clientbin:$CLIENT_TREE" -f - servers/control/clientbin
            docker push "$ECR_REGISTRY/ufo-clientbin:$CLIENT_TREE"
          fi

      - name: Wait for runtime rollout
        if: github.event_name != 'pull_request'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$(terraform -chdir="$TF_DIR" output -raw cluster_name)"
          .github/scripts/await_rollout.sh ingress-nginx ingress-nginx-controller
          NAMESPACE="$(terraform -chdir="$TF_DIR" output -raw system_namespace)"
          kubectl --namespace "$NAMESPACE" wait --for=condition=Ready --timeout=15m \
            externalsecret/ufo-control-secrets \
            externalsecret/ufo-platform-secrets \
            externalsecret/ufo-gateway-slack-connect \
            externalsecret/ufo-gateway-workos \
            externalsecret/ufo-egress-ca \
            externalsecret/datadog-api-key
          kubectl --namespace "$NAMESPACE" wait --for=condition=Ready --timeout=15m \
            certificate/ufo-gateway-tls \
            certificate/ufo-ingress-tls \
            certificate/ufo-serve-tls
          .github/scripts/await_rollout.sh "$NAMESPACE" ufo-gateway ufo-sandbox-proxy ufo-ingress ufo-serve
          # Only when the env enables it: preview_enabled=false renders no Deployment to wait on.
          if kubectl --namespace "$NAMESPACE" get deployment/ufo-preview >/dev/null 2>&1; then
            .github/scripts/await_rollout.sh "$NAMESPACE" ufo-preview
          fi
          .github/scripts/await_rollout.sh "$NAMESPACE" otel-collector
          kubectl --namespace "$NAMESPACE" rollout status daemonset/otel-logs-agent --timeout=15m

      - name: Gate gateway origin
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          HOST=$(terraform -chdir="$TF_DIR" output -raw hostname)
          curl -fsS -X POST "https://origin.$HOST/v1/onboard/ufo" | grep -F "x-ufo-session header is required."
          # shellcheck disable=SC2016  # literal ${UFO_URL:-...} text from the curl card, not an expansion
          curl -fsS "https://origin.$HOST/ufo" | grep -F 'UFO_URL="${UFO_URL:-https://'"$HOST"'}"'
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "https://origin.$HOST/ufo/bin/x86_64-unknown-linux-musl")" = "200"
          curl -fsS "https://origin.$HOST/fleet" | jq -e '.craft | type == "number" and . >= 0' >/dev/null

      - name: Gate sandbox egress proxy TLS
        if: github.event_name != 'pull_request'
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          UFO_EGRESS_CA_CERT="$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_ca_cert)" \
            uv run python sandbox/proxy_gate.py \
            --proxy-url "$(terraform -chdir="$TF_DIR" output -raw sandbox_proxy_url)"

      - name: Record tested artifacts
        if: github.event_name == 'push'
        run: |
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg image_tag "$IMAGE_TAG" \
            --arg sandbox_templates "$E2B_TEMPLATES" \
            '{commit: $commit, image_tag: $image_tag, sandbox_templates: $sandbox_templates}' \
            > "$RUNNER_TEMP/tested-artifacts.json"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tested-artifacts
          path: ${{ runner.temp }}/tested-artifacts.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  edge:
    needs: [changes, rollout]
    if: ${{ !cancelled() && needs.changes.outputs.deploy == 'true' && needs.rollout.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('deploy-edge-pr-{0}', github.event.pull_request.number) || 'deploy-edge' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/envs/edge
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/edge
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LOCK=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            LOCK=false
          fi
          terraform plan -input=false -no-color -lock="$LOCK" -lock-timeout=10m \
            -target=cloudflare_ruleset.shipped_app_cache \
            -target=module.testing \
            -out="$RUNNER_TEMP/edge.tfplan"

      - name: Reject destructive changes
        working-directory: infra/envs/edge
        run: terraform show -json "$RUNNER_TEMP/edge.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

      - name: Terraform production edge plan
        if: github.event_name == 'pull_request'
        working-directory: infra/envs/edge
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan -input=false -no-color -lock=false \
            -target=cloudflare_ruleset.flyingobject_redirect \
            -target=cloudflare_ruleset.shipped_app_cache \
            -target=cloudflare_zone_setting.always_use_https \
            -target=module.prod \
            -out="$RUNNER_TEMP/production-edge-review.tfplan"

      - name: Reject destructive production edge changes
        if: github.event_name == 'pull_request'
        working-directory: infra/envs/edge
        run: terraform show -json "$RUNNER_TEMP/production-edge-review.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: infra/envs/edge
        run: terraform apply -input=false "$RUNNER_TEMP/edge.tfplan"

      - name: Gate testing door
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          HOST=testing.ufo.ai
          curl -fsS "https://$HOST/" | grep -F "curl https://$HOST/waitlist"
          test "$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' "https://$HOST/login")" = "302 https://app.$HOST/login"
          curl -fsS -X POST "https://$HOST/v1/onboard/ufo" | grep -F "x-ufo-session header is required."
          # shellcheck disable=SC2016  # literal ${UFO_URL:-...} text from the curl card, not an expansion
          curl -fsS "https://$HOST/ufo" | grep -F 'UFO_URL="${UFO_URL:-https://'"$HOST"'}"'
          curl -fsS "https://$HOST/fleet" | jq -e '.craft | type == "number" and . >= 0' >/dev/null
          curl -fsS "https://$HOST/privacy" | grep -F "<h1>Privacy Policy</h1>"
          curl -fsS "https://$HOST/terms" | grep -F "<h1>Terms of Service</h1>"

  production:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      E2B_TEMPLATES: small=ufo-sbx-small,medium=ufo-sbx-medium,large=ufo-sbx-large
      TF_DIR: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform foundation plan
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          terraform plan -input=false -no-color -lock=false \
            -out="$RUNNER_TEMP/production.tfplan" \
            -target=module.platform.module.vpc \
            -target=module.platform.module.eks \
            -target=module.platform.aws_secretsmanager_secret.postgres \
            -target=module.platform.aws_secretsmanager_secret.platform \
            -target=module.platform.aws_secretsmanager_secret.api_keys \
            -target=module.platform.aws_secretsmanager_secret.gateway_slack_connect \
            -var "e2b_templates=$E2B_TEMPLATES" \
            -var "deployment_id=plan"

      - name: Reject destructive changes
        working-directory: ${{ env.TF_DIR }}
        run: terraform show -json "$RUNNER_TEMP/production.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

  production_access:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check production prerequisites
        run: bash .github/scripts/production_prerequisites.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/production-access
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/production-access
        run: terraform plan -input=false -no-color -lock=false -out="$RUNNER_TEMP/production-access.tfplan"

      - name: Reject destructive changes
        working-directory: infra/production-access
        run: terraform show -json "$RUNNER_TEMP/production-access.tfplan" | python "$GITHUB_WORKSPACE/.github/scripts/terraform_plan_guard.py"

  deploy:
    name: deployment
    needs: [changes, rollout, edge, production, production_access]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected deployment work
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPLOY_SELECTED: ${{ needs.changes.outputs.deploy }}
          EVENT_NAME: ${{ github.event_name }}
          ROLLOUT_RESULT: ${{ needs.rollout.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          PRODUCTION_ACCESS_RESULT: ${{ needs.production_access.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          # A rollout or edge job displaced from its concurrency group was superseded: the newer
          # queued deploy ships a descendant of this commit.
          case "$ROLLOUT_RESULT $EDGE_RESULT" in
            *cancelled*)
              echo "Superseded by a newer deploy."
              exit 0
              ;;
          esac
          case "$DEPLOY_SELECTED" in
            true)
              test "$ROLLOUT_RESULT" = "success"
              test "$EDGE_RESULT" = "success"
              if [ "$EVENT_NAME" = "pull_request" ]; then
                test "$PRODUCTION_RESULT" = "success"
                test "$PRODUCTION_ACCESS_RESULT" = "success"
              else
                test "$PRODUCTION_RESULT" = "skipped"
                test "$PRODUCTION_ACCESS_RESULT" = "skipped"
              fi
              ;;
            false)
              test "$ROLLOUT_RESULT" = "skipped"
              test "$EDGE_RESULT" = "skipped"
              test "$PRODUCTION_RESULT" = "skipped"
              test "$PRODUCTION_ACCESS_RESULT" = "skipped"
              echo "No deployment-relevant changes."
              ;;
            *)
              echo "Invalid deployment selection: $DEPLOY_SELECTED" >&2
              exit 1
              ;;
          esac

      - name: Report the deploy conclusion to Datadog
        if: always() && github.ref_name == 'main' && needs.rollout.result != 'cancelled' && needs.edge.result != 'cancelled'
        env:
          DD_CHECK_URL: https://api.us5.datadoghq.com/api/v1/check_run
          DEPLOY_CHECK: ufo.deploy.main
          DD_STATUS_OK: "0"
          DD_STATUS_CRITICAL: "2"
          TESTING_RESULT: ${{ needs.rollout.result }}
          EDGE_RESULT: ${{ needs.edge.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$DD_API_KEY" || { echo 'DD_API_KEY secret is unset' >&2; exit 1; }
          test "$TESTING_RESULT" = success && test "$EDGE_RESULT" = success && \
            STATUS="$DD_STATUS_OK" || STATUS="$DD_STATUS_CRITICAL"
          curl -sS --fail-with-body -X POST "$DD_CHECK_URL" \
            -H "DD-API-KEY: $DD_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg check "$DEPLOY_CHECK" --argjson status "$STATUS" --arg url "$RUN_URL" \
              '[{check: $check, host_name: "github-actions", status: $status, message: $url,
                 tags: ["env:testing"]}]')"
