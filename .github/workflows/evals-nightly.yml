name: Nightly evals

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the proving subset instead of the sweep
        type: boolean
        default: false
      reasoning:
        description: Evaluated agent reasoning effort
        type: choice
        options:
          - auto
          - "off"
          - low
          - medium
          - high
        default: auto
  pull_request:
    paths:
      - .github/workflows/evals-nightly.yml
      - .github/scripts/nightly_eval_matrix.py
      - .github/scripts/nightly_memory_ingestion.py
      - .github/scripts/eval_sweep_summary.py
      - .github/scripts/eval_sweep_metrics.py

concurrency:
  group: evals-nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWEEP_SMOKE: >-
    ${{ (github.event_name == 'pull_request' || inputs.smoke) && '--smoke' || '--no-smoke' }}
  SWEEP_MODE: >-
    ${{ (github.event_name == 'pull_request' || inputs.smoke) && 'smoke' || 'sweep' }}
  EVAL_REASONING: ${{ inputs.reasoning || 'auto' }}
  AWS_REGION: us-east-1
  ARCHIVE_ROLE_ARN: arn:aws:iam::899147036157:role/github-deploy
  ARCHIVE_BUCKET: ufo-testing-ufo-blob-899147036157
  ARCHIVE_PREFIX: eval-reports/runs

jobs:
  credentials:
    name: eval credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
    steps:
      - name: Require eval credentials
        run: |
          missing=false
          for name in ANTHROPIC_API_KEY AWS_BEARER_TOKEN_BEDROCK DD_API_KEY OPENAI_API_KEY OPENROUTER_API_KEY PERPLEXITY_API_KEY TURBOPUFFER_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi

  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
      memory_ingestion_shards: ${{ steps.matrix.outputs.memory_ingestion_shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - id: matrix
        run: |
          jobs="$(uv run python .github/scripts/nightly_eval_matrix.py --jobs "$SWEEP_SMOKE" --reasoning "$EVAL_REASONING")"
          memory_ingestion_shards="$(uv run python .github/scripts/nightly_memory_ingestion.py plan "$SWEEP_SMOKE")"
          echo "$jobs"
          echo "$memory_ingestion_shards"
          {
            echo "jobs=$jobs"
            echo "memory_ingestion_shards=$memory_ingestion_shards"
          } >>"$GITHUB_OUTPUT"

  sandbox-client:
    name: sandbox client
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/client-gh
        with:
          target: x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - working-directory: client
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-client
          path: client/target/x86_64-unknown-linux-musl/release/ufo
          if-no-files-found: error
          retention-days: 1

  web-build:
    name: web build
    needs: credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extensions/web/frontend/pnpm-lock.yaml
      - run: pnpm -C extensions/web/frontend install --frozen-lockfile
      - run: pnpm -C extensions/web/frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: sites-page-kit
          path: extensions/sites/ufo_ext_sites/page/kit
          if-no-files-found: error
          retention-days: 1

  sweep:
    name: ${{ matrix.label }} (${{ matrix.target }})
    needs: [plan, sandbox-client, web-build]
    runs-on: linux-4-core
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
      EVAL_MODEL: ${{ matrix.model }}
      EVAL_REASONING: ${{ matrix.reasoning }}
      UFO_PREVIEW_TOKEN: nightly-preview-token
      UFO_EGRESS_PREVIEW_DAEMON: 127.0.0.1:8930
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      - uses: actions/download-artifact@v4
        with:
          name: sandbox-client
          path: client/target/x86_64-unknown-linux-musl/release
      - run: |
          chmod +x client/target/x86_64-unknown-linux-musl/release/ufo
          echo "$GITHUB_WORKSPACE/client/target/x86_64-unknown-linux-musl/release" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: sites-page-kit
          path: extensions/sites/ufo_ext_sites/page/kit

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/egress
      - run: cargo build --manifest-path servers/egress/Cargo.toml

      - name: Write the shard's stack input
        run: |
          uv run python .github/scripts/nightly_eval_matrix.py "$SWEEP_SMOKE" \
            --model "$EVAL_MODEL" --reasoning "$EVAL_REASONING" \
            --write "$MATRIX_LABEL" --dir "$RUNNER_TEMP/shard"
          cat "$RUNNER_TEMP/shard/ufo.toml" "$RUNNER_TEMP/shard/matrix.toml"
        env:
          MATRIX_LABEL: ${{ matrix.label }}

      - name: Start the preview service
        if: matrix.preview
        run: |
          docker build -t ufo-preview-eval servers/preview
          docker run --rm -d --name preview-eval -p 127.0.0.1:8930:8930 \
            -e UFO_PREVIEW_LISTEN=0.0.0.0:8930 \
            -e UFO_PREVIEW_TOKEN="$UFO_PREVIEW_TOKEN" \
            -e UFO_PREVIEW_ALLOW_LOCAL=1 ufo-preview-eval
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8930/_health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8930/_health

      - name: Run the shard
        timeout-minutes: 300
        run: uv run python -m evals.stack "$RUNNER_TEMP/shard/matrix.toml"

      - name: Upload the run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-records-${{ matrix.label }}-${{ matrix.artifact }}
          path: eval-reports/runs/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-stack-logs-${{ matrix.label }}-${{ matrix.artifact }}
          path: .local/evals/**/*.log
          if-no-files-found: warn
          retention-days: 14

  memory-ingestion:
    name: memory ingestion / ${{ matrix.shard.report }}
    needs: [credentials, plan]
    runs-on: linux-4-core
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.memory_ingestion_shards) }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/egress
      - run: cargo build --manifest-path servers/egress/Cargo.toml

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/memory-ingestion-assets
          key: memory-ingestion-assets-${{ hashFiles('evals/memory_ingestion/assets.py') }}

      - name: Fetch the pinned corpora
        env:
          ASSETS: ${{ runner.temp }}/memory-ingestion-assets
          LONGMEM_URL: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/98d7416c24c778c2fee6e6f3006e7a073259d48f/longmemeval_s_cleaned.json
          LOCOMO_URL: https://raw.githubusercontent.com/snap-research/locomo/3eb6f2c585f5e1699204e3c3bdf7adc5c28cb376/data/locomo10.json
        run: |
          mkdir -p "$ASSETS"
          test -f "$ASSETS/longmemeval_s_cleaned.json" || \
            { curl --fail --location --output "$ASSETS/longmem.tmp" "$LONGMEM_URL" && \
              mv "$ASSETS/longmem.tmp" "$ASSETS/longmemeval_s_cleaned.json"; }
          test -f "$ASSETS/locomo10.json" || \
            { curl --fail --location --output "$ASSETS/locomo.tmp" "$LOCOMO_URL" && \
              mv "$ASSETS/locomo.tmp" "$ASSETS/locomo10.json"; }

      - name: Build the memory-ingestion snapshot
        run: |
          uv run python .github/scripts/nightly_memory_ingestion.py build \
            --longmem "$ASSETS/longmemeval_s_cleaned.json" \
            --locomo "$ASSETS/locomo10.json" \
            --dir "$RUNNER_TEMP/memory-ingestion" "$SWEEP_SMOKE" \
            --report "$REPORT"
        env:
          ASSETS: ${{ runner.temp }}/memory-ingestion-assets
          REPORT: ${{ matrix.shard.report }}

      - name: Derive the shared memory corpus
        env:
          UFO_CONFIG: ${{ runner.temp }}/memory-ingestion/producer.toml
        run: |
          uv run ufoctl migrate
          uv run python -m evals.memory_ingestion.materialize \
            --snapshot "$RUNNER_TEMP/memory-ingestion/snapshot" \
            --state "$RUNNER_TEMP/memory-ingestion/producer-state" \
            --corpus-output "$RUNNER_TEMP/memory-ingestion/derived-corpus.json" \
            >"$RUNNER_TEMP/memory-ingestion/producer.log" 2>&1

      - name: Score the corpus producer
        run: |
          uv run python .github/scripts/nightly_memory_ingestion.py verify-producer \
            --snapshot "$RUNNER_TEMP/memory-ingestion/snapshot" \
            --corpus "$RUNNER_TEMP/memory-ingestion/derived-corpus.json" \
            --readiness "$RUNNER_TEMP/memory-ingestion/producer-state"/*/readiness.json \
            --state-output "memory-ingestion-producer-state/$REPORT/readiness.json"
        env:
          REPORT: ${{ matrix.shard.report }}

      - name: Prepare the paired target stacks
        run: |
          uv run python .github/scripts/nightly_memory_ingestion.py prepare \
            --snapshot "$RUNNER_TEMP/memory-ingestion/snapshot" \
            --corpus "$RUNNER_TEMP/memory-ingestion/derived-corpus.json" \
            --dir "$RUNNER_TEMP/memory-ingestion/targets" \
            --reasoning "$EVAL_REASONING"
          cat "$RUNNER_TEMP/memory-ingestion/targets"/*.toml

      - name: Run paired memory ingestion targets
        timeout-minutes: 60
        run: uv run python -m evals.stack "$RUNNER_TEMP/memory-ingestion/targets/matrix.toml"

      - name: Verify paired memory ingestion targets
        if: always()
        run: |
          uv run python .github/scripts/nightly_memory_ingestion.py verify \
            --reports eval-reports --runs-root .local/evals \
            --state-root memory-ingestion-state \
            --corpus "$RUNNER_TEMP/memory-ingestion/derived-corpus.json" \
            "$SWEEP_SMOKE" --report "$REPORT"
        env:
          REPORT: ${{ matrix.shard.report }}

      - name: Upload the run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-records-memory-ingestion-${{ matrix.shard.artifact }}
          path: eval-reports/runs/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the ingestion state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-memory-ingestion-state-${{ matrix.shard.artifact }}
          path: memory-ingestion-state
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the producer score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-memory-ingestion-producer-${{ matrix.shard.artifact }}
          path: memory-ingestion-producer-state
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-stack-logs-memory-ingestion-${{ matrix.shard.artifact }}
          path: |
            .local/evals/**/*.log
            ${{ runner.temp }}/memory-ingestion/producer.log
          if-no-files-found: warn
          retention-days: 14

  archive:
    name: archive
    needs: [sweep, memory-ingestion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-run-records-*
          merge-multiple: true
          path: eval-reports/runs

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-memory-ingestion-state-*
          merge-multiple: true
          path: eval-reports/state

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-memory-ingestion-producer-*
          merge-multiple: true
          path: eval-reports/producer-state

      - name: Summarize the sweep
        run: |
          if [ -z "$(ls -A eval-reports/runs 2>/dev/null)" ]; then
            echo "no run record was written — every shard failed before it recorded a run" >&2
            exit 1
          fi
          uv run python .github/scripts/eval_sweep_summary.py eval-reports "$SWEEP_SMOKE" \
            --memory-ingestion \
            | tee eval-reports/summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the sweep archive
        uses: actions/upload-artifact@v4
        with:
          name: eval-sweep
          path: eval-reports
          if-no-files-found: error
          retention-days: 90

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ARCHIVE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive the sweep
        run: |
          aws s3 cp eval-reports \
            "s3://$ARCHIVE_BUCKET/$ARCHIVE_PREFIX/$(date -u +%F)/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --recursive --no-progress

      - name: Require a complete fixed-case cohort
        if: always()
        run: |
          uv run python .github/scripts/eval_sweep_summary.py eval-reports "$SWEEP_SMOKE" \
            --memory-ingestion --require-comparable

      - name: Report the scores to Datadog
        if: github.event_name != 'pull_request'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_HOST: api.us5.datadoghq.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$DD_API_KEY" || { echo 'DD_API_KEY secret is unset' >&2; exit 1; }
          uv run python .github/scripts/eval_sweep_metrics.py eval-reports \
            --mode "$SWEEP_MODE" --timestamp "$(date -u +%s)" \
            | curl -sS --fail-with-body -X POST "https://$DD_HOST/api/v2/series" \
                -H "DD-API-KEY: $DD_API_KEY" -H 'Content-Type: application/json' --data-binary @-
          uv run python .github/scripts/eval_sweep_metrics.py eval-reports \
            --mode "$SWEEP_MODE" --timestamp 0 --run-url "$RUN_URL" --event \
            | curl -sS --fail-with-body -X POST "https://$DD_HOST/api/v1/events" \
                -H "DD-API-KEY: $DD_API_KEY" -H 'Content-Type: application/json' --data-binary @-
