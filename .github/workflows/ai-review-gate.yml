name: AI Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  # The pull_request_target and pull_request_review triggers above drive this in real time;
  # the cron is only a backstop for a missed event, so every 30 minutes is plenty.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: write
  statuses: write

jobs:
  ai-review-gate:
    name: Publish AI review status
    # A COMMENTED review carries no verdict, so it can never change the status; skipping the job
    # allocates no runner. contains() is case-insensitive, which the lowercase webhook state needs.
    if: ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request) && !contains(github.event.review.state, 'commented') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Gate on Claude's review verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ai_review_gate.py
