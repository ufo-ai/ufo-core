name: AI Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  ai-review-gate:
    name: Publish AI review status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Gate on Claude's review verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ai_review_gate.py
