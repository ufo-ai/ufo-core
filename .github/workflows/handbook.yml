name: Handbook

# Regenerate docs/handbook/*.md from the current source and open a PR when it drifts.
# Manual any time; on a schedule roughly every other day (odd days of month, ~48h;
# the gap straddles month boundaries). Never merges — a refresh is a proposal for review.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 */2 * *'

concurrency:
  group: handbook
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # The pipeline reads one LLM call per staged source file, so its wall clock grows
    # with the tree: 23m over 575 files, 34m over 654. Keep headroom over that curve.
    timeout-minutes: 60
    env:
      OPENAI_MODEL: gpt-5.5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Regenerate handbook
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bash docs/handbook/regenerate.sh

      - name: Open PR on drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain docs/handbook)" ]; then
            echo "handbook already in sync — nothing to do"
            exit 0
          fi
          git config user.name handbook
          git config user.email handbook@users.noreply.github.com
          branch="handbook/refresh-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add docs/handbook
          git commit -m "refresh generated harness handbook"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "refresh generated harness handbook" \
            --body "Automated regeneration of \`docs/handbook/\` from current source (\`docs/handbook/regenerate.sh\`, model ${OPENAI_MODEL}). Review the drift; never auto-merged."
