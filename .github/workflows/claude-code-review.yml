name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions,claude
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr || github.event.pull_request.number }} --comment

            Unless the pull request is closed or a draft, always finish by submitting a verdict on the current head commit, even where the code-review command's steps say to stop (Claude already commented, automated or trivial change) — in those cases review the current diff first. Run `gh pr review ${{ inputs.pr || github.event.pull_request.number }} --request-changes --body "<one-line reason>"` if anything must be fixed before merge, otherwise run `gh pr review ${{ inputs.pr || github.event.pull_request.number }} --approve`.
          show_full_output: true
          claude_args: |
            --verbose --allowedTools "Skill,Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
