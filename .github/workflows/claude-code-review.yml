name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Generated handbook pages are refreshed wholesale by the handbook pipeline and
    # are not gated on AI review; the hand-written README/regenerate.sh/tool.patch in
    # the same directory, and any other path, are reviewed normally.
    paths-ignore:
      - 'docs/handbook/overview.md'
      - 'docs/handbook/index.md'
      - 'docs/handbook/register.md'
      - 'docs/handbook/stage-*.md'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

# A new push to a PR supersedes the in-flight review; cancel it so review runs never stack.
# workflow_dispatch runs group by the input pr, so a manual re-review is never cancelled by another PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

env:
  AUTO_REVIEW_LIMIT: 3

jobs:
  claude-review:
    # Skip drafts: a PR is reviewed once marked ready (the ready_for_review trigger above).
    # workflow_dispatch carries no pull_request payload, so draft is empty there and the review runs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check automatic review limit
        id: review-limit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/prior_findings.py "$REPOSITORY" "$PR_NUMBER" > "$RUNNER_TEMP/prior.json"
          rounds="$(jq -r '.rounds // empty' "$RUNNER_TEMP/prior.json")"
          if [[ -n "$rounds" && "$rounds" -lt "$AUTO_REVIEW_LIMIT" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [[ -n "$rounds" ]]; then
            echo "The automatic review limit has been reached. Run Claude Code Review manually for another review." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Review history is unavailable. Run Claude Code Review manually." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.review-limit.outputs.run == 'true'
        continue-on-error: true
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
        if: steps.review-limit.outputs.run == 'true'
        continue-on-error: true

      - uses: anthropics/claude-code-action@v1
        if: steps.review-limit.outputs.run == 'true'
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions,claude,flyingobject-ai-ufo
          prompt: |
            Use the review-pull-request skill to review https://github.com/${{ github.repository }}/pull/${{ inputs.pr || github.event.pull_request.number }}.
          show_full_output: true
          claude_args: |
            --model claude-opus-5 --verbose --allowedTools "Skill,Task,TodoWrite,Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
