name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        continue-on-error: true
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
        continue-on-error: true

      - uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions,claude
          prompt: |
            Use the review-pull-request skill to review https://github.com/${{ github.repository }}/pull/${{ inputs.pr || github.event.pull_request.number }}.
          show_full_output: true
          claude_args: |
            --model sonnet --verbose --allowedTools "Skill,Task,TodoWrite,Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"
