name: egress

# The egress proxy (RFC 0035) is a standalone Rust data-plane crate outside the client workspace, so
# it gets its own check. Its tests drive a fake control server in-process — no Postgres, no network —
# so the job is fmt + clippy + test with nothing to stand up.
on:
  push:
    branches: [main]
    paths: ["egress/**", ".github/workflows/egress.yml"]
  pull_request:
    paths: ["egress/**", ".github/workflows/egress.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: egress
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: egress
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
