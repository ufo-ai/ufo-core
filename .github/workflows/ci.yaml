name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lane selection: a pull request runs only the lanes its changed paths touch; a push to main
  # runs everything, so a wrong lane decision is caught at merge, never shipped. The filters are
  # deliberately coarse — whole top-level directories plus one markdown rule — and every rule errs
  # toward running: `not_docs_md` is a negation, so any file that is not docs markdown lights the
  # widest lane, and cross-cutting inputs (`.github/`, `testsupport/`, any top-level file) light
  # them all. Gating happens per job, never via `on.paths`: this workflow produces required
  # contexts (`test`, `checks`, `rls`), and a workflow filtered out at the trigger never posts
  # them, blocking the PR forever — a job skipped by `if:` posts skipped, which satisfies the
  # ruleset. The `test` job asserts each lane's conclusion against the decision made here, so a
  # lane selected to run that skips anyway fails the gate.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ github.event_name != 'pull_request' || steps.filter.outputs.not_docs_md == 'true' }}
      control: ${{ github.event_name != 'pull_request' || steps.filter.outputs.control == 'true' }}
      wheel: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wheel == 'true' }}
    steps:
      # On pull_request the action reads changed files from the API, so no checkout. On push the
      # outputs above are already true, so the step never runs — and never fails a main build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            not_docs_md:
              - '!docs/**/*.md'
            control:
              - 'servers/**'
              - 'testsupport/**'
              - '.github/**'
              - '*'
            wheel:
              - 'core/**'
              - 'extensions/**'
              - 'packs/**'
              - 'evals/**'
              - 'sandbox/**'
              - 'infra/**'
              - 'assets/**'
              - 'dev/**'
              - 'scripts/**'
              - 'testsupport/**'
              - '.github/**'
              - '*'

  # Static checks — no database. Runs concurrently with `test` on its own runner, so mypy and the
  # rot-guard never sit on the test job's critical path. Skipped only when the whole diff is docs
  # markdown: gates.py reads Rust, HTML, and portal TS sources, so its input set is the repo.
  checks:
    needs: triage
    if: needs.triage.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: make check
      - run: uv run pytest --collect-only -m integration -q

  # The frontend gate: the edge suite plus everything the production wheel bakes. Both apps build
  # on every push, BEFORE the wheel gate below, so the gated wheel is the production shape. Runs
  # apart from `checks` so npm and mypy never sit on each other's critical path; the required
  # `test` job asserts its result.
  wheel:
    needs: triage
    if: needs.triage.outputs.wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The landing page's behaviour is geometric and frame-timed, so its suite drives a browser.
      - run: npm --prefix infra/modules/edge ci
      # `--with-deps` runs apt against the runner's mirrors before it fetches the browser. When a
      # mirror stops answering, apt neither fails nor prints: the step goes silent and burns the
      # job's whole 15 minutes, taking `test` down with it because it reads this job's conclusion.
      # The runner image already carries Chromium's shared libraries, so the deps pass is walled
      # and best-effort; the browser download is the half that must succeed, and it fails loud.
      - name: Install the browser the landing-page suite drives
        run: |
          timeout 300 npm --prefix infra/modules/edge exec -- \
            playwright install --with-deps chromium \
            || npm --prefix infra/modules/edge exec -- playwright install chromium
      - run: node --test infra/modules/edge/*.test.mjs
      - run: npm --prefix extensions/debugger/frontend ci
      - run: npm --prefix extensions/debugger/frontend run build
      - run: npm --prefix extensions/web/frontend ci
      - run: npm --prefix extensions/web/frontend run build
      - name: Gate production wheel
        run: |
          uv build --wheel --out-dir /tmp/ufo-wheel
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -q "ufo_ext_debugger/static/index.html"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -q "ufo_ext_web/static/index.html"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -qE "ufo_ext_web/static/assets/index-.*\.js"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -qE "ufo_ext_web/static/assets/index-.*\.css"
          uv venv --python 3.12 /tmp/ufo-wheel-venv
          uv pip install --python /tmp/ufo-wheel-venv/bin/python /tmp/ufo-wheel/ufo-*.whl
          /tmp/ufo-wheel-venv/bin/ufoctl --help >/dev/null
          /tmp/ufo-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points

          for group in ("ufo.extension", "ufo.pack"):
              entries = entry_points(group=group)
              assert entries, group
              for entry in entries:
                  entry.load()()
          PY

  # The portal is a built app. This job is the only one that installs its npm tree for testing:
  # it builds, proves the bundle and every view, and publishes the output the pytest shards read,
  # so no shard installs npm. The shards still need the runner's own node — two repl tests drive a
  # real `LocalCarrier` through it — which `ubuntu-latest` ships. `wheel` builds its own copy
  # because the wheel gate has to see the production shape assembled from a clean tree.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/web/frontend/package-lock.json
      - run: npm --prefix extensions/web/frontend ci
      - run: npm --prefix extensions/web/frontend run build
      - run: npm --prefix extensions/web/frontend test
      - uses: actions/upload-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: test shard ${{ matrix.shard }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the coding suite's tests read pinned commits; a shallow checkout has none
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The portal's Python tests read its built page. The `web` job built it once; a missing
      # artifact fails this step rather than letting the suite test an absent page.
      - uses: actions/download-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
      - run: make test SHARD="${{ matrix.shard }}"
      # Artifact names take no `/`, so the shard is in the index here and spelled in full inside
      # each `run-summary.json`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-test-shard-${{ strategy.job-index }}
          path: .pytest-timings
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The control plane is a Rust crate (RFC 0036). Its ledger, gateway, and Slack suites run against a
  # real Postgres — partial unique indexes, row locks, and `for update skip locked` leases have no
  # meaning against a fake — and each test takes a database of its own, so the connecting role owns
  # the cluster. The RLS half runs in the `rls` job below, on its own cluster.
  control-test:
    needs: triage
    if: needs.triage.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: servers/control
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5549:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      UFO_CONTROL_TEST_POSTGRES: postgresql://ufo:ufo@127.0.0.1:5549/ufo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/control
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  integration:
    if: github.event_name == 'push'
    uses: ./.github/workflows/integration.yaml

  # Every assertion states the exact conclusion the triage decision implies, so a lane selected to
  # run that skips anyway — a broken `if:`, a dropped need — goes red here instead of merging
  # green. The triage assertion is first and unconditional: a failed triage leaves its outputs
  # empty, every expectation would collapse to skipped, and the gate would pass with no coverage.
  test:
    if: always()
    needs: [triage, test-shard, control-test, integration, wheel]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.triage.result }}" = success
      - run: test "${{ needs.test-shard.result }}" = success
      - run: test "${{ needs.control-test.result }}" = "${{ needs.triage.outputs.control == 'true' && 'success' || 'skipped' }}"
      - run: test "${{ needs.integration.result }}" = "${{ github.event_name == 'push' && 'success' || 'skipped' }}"
      - run: test "${{ needs.wheel.result }}" = "${{ needs.triage.outputs.wheel == 'true' && 'success' || 'skipped' }}"

  # The workspace RLS proof uses its own SUPERUSER Postgres on :5544 (never the parallel suite's
  # :5541, nor `control-test`'s :5549). It CREATEs roles and databases, applies RLS policies, and
  # mints the RLS-subject serve role — so it needs a superuser and is the sole owner of its cluster
  # (global CREATE/DROP ROLE), which is why it runs on its own runner. A Postgres role is
  # cluster-wide while a database is not, so sharing a cluster with `control-test` would let the two
  # jobs write the same `ufo_serve` and `ufo_control` rows. This is the gate the U1 / ufo_dbos /
  # serve-role bugs slipped past.
  rls:
    needs: triage
    if: needs.triage.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: servers/control
    services:
      postgres-admin:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      UFO_CONTROL_TEST_POSTGRES: postgresql://admin:admin@127.0.0.1:5544/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/control
      - run: cargo test --test rls_it
