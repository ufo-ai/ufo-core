name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks — no database. Runs concurrently with `test` on its own runner, so mypy and the
  # rot-guard never sit on the test job's critical path.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-push
      - run: node --test infra/modules/edge/*.test.mjs
      - run: uv run pytest --collect-only -m integration -q

  # Parallel unit tests — the per-push bottleneck, on its own runner with the postgres service.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # Parallel unit pass: the process-parallel-safe tests fan out across xdist workers. Each worker
      # is its own process (so the process-singleton DBOS executor is fine per worker) with its own
      # sqlite temp dir and its own worker-suffixed postgres database, so no two workers touch one
      # store. The container/image-build/live turns (`serial`/`integration`/`docker`) run in the
      # nightly `integration` workflow, off this per-push hot path.
      - run: uv run pytest -n auto -m "not serial and not integration and not docker" -q
      - run: uv run --project control pytest control/tests --ignore=control/tests/test_rls.py -q

  # The workspace RLS proof uses its own SUPERUSER Postgres on :5544 (never the parallel
  # suite's :5541). Setup CREATEs roles + databases, applies RLS
  # policies, and mints the RLS-subject serve role — so it needs a superuser and is the sole owner of
  # its cluster (global DROP ROLE/DATABASE), which is why it runs on its own runner, serial, off the
  # `test` job's xdist. This is the gate the U1 / ufo_dbos / serve-role bugs slipped past; UFO_RLS_
  # REQUIRED makes an unreachable DB a hard collection error, so the suite can never silently skip.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-admin:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run --project control pytest control/tests/test_rls.py -q
        env:
          UFO_RLS_REQUIRED: "1"
