name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: selfhost
          POSTGRES_PASSWORD: selfhost
          POSTGRES_DB: selfhost
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U selfhost"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run python gates.py
      # Rot-guard: the gated integration suite must always import + collect, even where its live
      # dependencies (a model key, extra services) are absent, so it can't silently bit-rot.
      - run: uv run pytest core/tests/integration --collect-only -m integration -q
      # The full suite runs serially (no xdist) — the DBOS executor is a process singleton — and the
      # runner has Docker, so the `docker` and container-backed `integration` turns execute here;
      # `integration` tests needing an absent key (a live model) skip with a clear reason.
      - run: uv run pytest
