name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: selfhost
          POSTGRES_PASSWORD: selfhost
          POSTGRES_DB: selfhost
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U selfhost"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run python gates.py
      # Split the run by dialect: DBOS is a process singleton, and relaunching it across the
      # sqlite→postgres param in one process hangs the DBOS-driving tests. One process per dialect
      # launches DBOS exactly once. timeout-minutes bounds the known intermittent DBOS-postgres hang
      # to a fail-fast red instead of stalling the job.
      - run: uv run pytest -k "not postgres"
        timeout-minutes: 10
      - run: uv run pytest -k postgres
        timeout-minutes: 10
