name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: selfhost
          POSTGRES_PASSWORD: selfhost
          POSTGRES_DB: selfhost
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U selfhost"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      # The sandbox image (e2b base + libreoffice + chromium + playwright + pip/npm) is ~6-7 GB and
      # its build peaks near the runner's ~14 GB free disk. Reclaim the large preinstalled toolchains
      # this build never touches so the docker-gated tests can build instead of stalling on space.
      - name: Reclaim runner disk for the sandbox image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check .
      - run: uv run python gates.py
      - run: uv run mypy core/src/selfhost extensions gates.py
      # Rot-guard: the gated integration suite must always import + collect, even where its live
      # dependencies (a model key, extra services) are absent, so it can't silently bit-rot. The
      # whole tree is swept — core's live suite plus each extension's own tests/integration.
      - run: uv run pytest --collect-only -m integration -q
      # The full suite runs serially (no xdist) — the DBOS executor is a process singleton — and the
      # runner has Docker, so the `docker` and container-backed `integration` turns execute here;
      # `integration` tests needing an absent key (a live model) skip with a clear reason. `-rs`
      # surfaces those skip reasons so a bounded-out image build or an absent dependency is visible
      # in the log rather than hidden behind a bare "s".
      - run: uv run pytest -rs
