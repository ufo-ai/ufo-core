name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gating happens per job, never via `on.paths`: a workflow filtered out at the trigger never posts its
  # required contexts, blocking the PR forever, while a job skipped by `if:` posts skipped.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checks: ${{ github.event_name != 'pull_request' || steps.filter.outputs.not_docs_md == 'true' }}
      control: ${{ github.event_name != 'pull_request' || steps.filter.outputs.control == 'true' }}
      wheel: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wheel == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            not_docs_md:
              - '!docs/**/*.md'
            control:
              - 'servers/**'
              - 'testsupport/**'
              - '.github/**'
              - '*'
            client:
              - 'client/**'
              - 'testsupport/**'
              - '.github/**'
              - '*'
            wheel:
              - 'core/**'
              - 'extensions/**'
              - 'packs/**'
              - 'evals/**'
              - 'sandbox/**'
              - 'infra/**'
              - 'assets/**'
              - 'dev/**'
              - 'scripts/**'
              - 'testsupport/**'
              - '.github/**'
              - '*'

  checks:
    needs: triage
    if: needs.triage.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: make check
      - run: uv run pytest --collect-only -m integration -q

  wheel:
    needs: triage
    if: needs.triage.outputs.wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            infra/modules/edge/pnpm-lock.yaml
            extensions/debugger/frontend/pnpm-lock.yaml
            extensions/web/frontend/pnpm-lock.yaml
      - run: pnpm -C infra/modules/edge install --frozen-lockfile
      # `--with-deps` runs apt against the runner's mirrors first. When a mirror stops answering, apt neither
      # fails nor prints: the step burns the job's whole 15 minutes, so the deps pass is walled best-effort.
      - name: Install the browser the landing-page suite drives
        run: |
          timeout 300 pnpm -C infra/modules/edge exec \
            playwright install --with-deps chromium \
            || pnpm -C infra/modules/edge exec playwright install chromium
      - run: node --test infra/modules/edge/*.test.mjs
      - run: pnpm -C extensions/debugger/frontend install --frozen-lockfile
      - run: pnpm -C extensions/debugger/frontend run build
      - run: pnpm -C extensions/web/frontend install --frozen-lockfile
      - run: pnpm -C extensions/web/frontend run build
      # `load_apps` digests the whole app tree it finds, so a wheel holding a subset serves a content digest
      # no test ever proved and 404s the names it dropped, with the suite green off the repo tree.
      - name: Gate production wheel
        run: |
          uv build --wheel --all-packages --out-dir /tmp/ufo-wheel
          python3 - /tmp/ufo-wheel/ufo-*.whl <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          TREES = {
              "extensions/debugger/ufo_ext_debugger/static": "ufo_ext_debugger/static",
              "extensions/web/ufo_ext_web/static": "ufo_ext_web/static",
              "extensions/web/ufo_ext_web/apps": "ufo_ext_web/apps",
              "extensions/sites/ufo_ext_sites/page/kit": "ufo_ext_sites/page/kit",
          }
          packed = set(zipfile.ZipFile(sys.argv[1]).namelist())
          missing = []
          for tree, prefix in TREES.items():
              built = [p for p in Path(tree).rglob("*") if p.is_file()]
              if not built:
                  raise SystemExit(f"{tree}: the build left nothing to ship")
              print(f"{tree}: {len(built)} files")
              missing += [
                  str(path)
                  for path in built
                  if f"{prefix}/{path.relative_to(tree).as_posix()}" not in packed
              ]
          if missing:
              raise SystemExit("built but absent from the wheel:\n" + "\n".join(sorted(missing)))
          PY
          uv venv --python 3.12 /tmp/ufo-wheel-venv
          uv pip install --python /tmp/ufo-wheel-venv/bin/python \
            /tmp/ufo-wheel/ufo-*.whl
          /tmp/ufo-wheel-venv/bin/ufoctl --help >/dev/null
          /tmp/ufo-wheel-venv/bin/python - <<'PY'
          import os
          from importlib.metadata import entry_points

          from ufo.harness.agent import AgentDefinition, AgentEngine, Message, ToolDefinition
          from ufo.harness.context import ContextWindow
          from ufo.harness.rounds import ModelRoundRunner
          from ufo.harness.sandbox.protocol import SandboxCommands

          assert AgentDefinition and AgentEngine and Message and ToolDefinition
          assert ContextWindow and ModelRoundRunner and SandboxCommands

          os.chdir("/tmp")
          import evals.registry

          for group in ("ufo.extension", "ufo.pack"):
              entries = entry_points(group=group)
              assert entries, group
              for entry in entries:
                  entry.load()()
          PY

  # The shards need the runner's own node — two repl tests drive a real `LocalCarrier` through it —
  # which `ubuntu-latest` ships.
  web-build:
    needs: triage
    if: needs.triage.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extensions/web/frontend/pnpm-lock.yaml
      - run: pnpm -C extensions/web/frontend install --frozen-lockfile
      - run: pnpm -C extensions/web/frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: portal-apps
          path: extensions/web/ufo_ext_web/apps
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sites-page-kit
          path: extensions/sites/ufo_ext_sites/page/kit
          if-no-files-found: error
          retention-days: 1

  web-test:
    needs: [triage, web-build]
    if: needs.triage.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extensions/web/frontend/pnpm-lock.yaml
      - run: pnpm -C extensions/web/frontend install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
      - uses: actions/download-artifact@v4
        with:
          name: portal-apps
          path: extensions/web/ufo_ext_web/apps
      - uses: actions/download-artifact@v4
        with:
          name: sites-page-kit
          path: extensions/sites/ufo_ext_sites/page/kit
      - run: pnpm -C extensions/web/frontend test

  sandbox-client:
    needs: triage
    if: needs.triage.outputs.checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/client-gh
        with:
          target: x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
      - working-directory: client
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-client
          path: client/target/release/ufo
          if-no-files-found: error
          retention-days: 1

  client:
    needs: triage
    if: needs.triage.outputs.client == 'true'
    uses: ./.github/workflows/client.yml
    secrets: inherit

  test-shard:
    name: test shard ${{ matrix.shard }}
    needs: [triage, web-build, sandbox-client]
    if: needs.triage.outputs.checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/10", "2/10", "3/10", "4/10", "5/10", "6/10", "7/10", "8/10", "9/10", "10/10"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-install-package actionlint-py
      - uses: actions/download-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
      - uses: actions/download-artifact@v4
        with:
          name: portal-apps
          path: extensions/web/ufo_ext_web/apps
      - uses: actions/download-artifact@v4
        with:
          name: sites-page-kit
          path: extensions/sites/ufo_ext_sites/page/kit
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-client
          path: client/target/release
      - run: |
          chmod +x client/target/release/ufo
          echo "$GITHUB_WORKSPACE/client/target/release" >> "$GITHUB_PATH"
      - run: UV_NO_SYNC=1 make test SHARD="${{ matrix.shard }}"
      # Artifact names take no `/`, so the shard is in the index here and spelled in full inside each
      # `run-summary.json`.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-timings-test-shard-${{ strategy.job-index }}
          path: .pytest-timings
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Partial unique indexes, row locks and `for update skip locked` leases have no meaning against a
  # fake, and each test takes a database of its own, so the connecting role owns the cluster.
  control-test:
    needs: triage
    if: needs.triage.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: servers/control
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5549:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      UFO_CONTROL_TEST_POSTGRES: postgresql://ufo:ufo@127.0.0.1:5549/ufo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/control
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  integration:
    needs: triage
    if: needs.triage.outputs.checks == 'true'
    uses: ./.github/workflows/integration.yaml

  # The triage assertion is first and unconditional: a failed triage leaves its outputs empty and every
  # expectation would collapse to skipped. A cancelled gate passes only when GitHub names a newer head.
  test:
    if: always()
    needs: [triage, test-shard, web-test, control-test, integration, wheel, client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a newer head after cancellation
        if: ${{ contains(needs.*.result, 'cancelled') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          else
            CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          fi
          test "$CURRENT_SHA" != "$RUN_SHA"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.triage.result }}" = success
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.test-shard.result }}" = "${{ needs.triage.outputs.checks == 'true' && 'success' || 'skipped' }}"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.web-test.result }}" = "${{ needs.triage.outputs.checks == 'true' && 'success' || 'skipped' }}"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.control-test.result }}" = "${{ needs.triage.outputs.control == 'true' && 'success' || 'skipped' }}"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.integration.result }}" = "${{ needs.triage.outputs.checks == 'true' && 'success' || 'skipped' }}"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.wheel.result }}" = "${{ needs.triage.outputs.wheel == 'true' && 'success' || 'skipped' }}"
      - if: ${{ !contains(needs.*.result, 'cancelled') }}
        run: test "${{ needs.client.result }}" = "${{ needs.triage.outputs.client == 'true' && 'success' || 'skipped' }}"

  # A Postgres role is cluster-wide while a database is not, so sharing a cluster with `control-test`
  # would let the two jobs write the same `ufo_serve` and `ufo_control` rows.
  rls:
    needs: triage
    if: needs.triage.outputs.control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: servers/control
    services:
      postgres-admin:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      UFO_CONTROL_TEST_POSTGRES: postgresql://admin:admin@127.0.0.1:5544/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: servers/control
      - run: cargo test --test rls_it
