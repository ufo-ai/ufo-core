name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks — no database. Runs concurrently with `test` on its own runner, so mypy and the
  # rot-guard never sit on the test job's critical path.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files --hook-stage pre-push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The landing page's behaviour is geometric and frame-timed, so its suite drives a browser.
      - run: npm --prefix infra/modules/edge ci
      - run: npm --prefix infra/modules/edge exec -- playwright install --with-deps chromium
      - run: node --test infra/modules/edge/*.test.mjs
      # Both apps build on every push, BEFORE the wheel gate below: the bundle image bakes them,
      # so the gated wheel must be the production shape.
      - run: npm --prefix extensions/debugger/frontend ci
      - run: npm --prefix extensions/debugger/frontend run build
      - run: npm --prefix extensions/web/frontend ci
      - run: npm --prefix extensions/web/frontend run build
      - name: Gate production wheel
        run: |
          uv build --wheel --out-dir /tmp/ufo-wheel
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -q "ufo_ext_debugger/static/index.html"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -q "ufo_ext_web/static/index.html"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -qE "ufo_ext_web/static/assets/index-.*\.js"
          unzip -l /tmp/ufo-wheel/ufo-*.whl | grep -qE "ufo_ext_web/static/assets/index-.*\.css"
          uv venv --python 3.12 /tmp/ufo-wheel-venv
          uv pip install --python /tmp/ufo-wheel-venv/bin/python /tmp/ufo-wheel/ufo-*.whl
          /tmp/ufo-wheel-venv/bin/ufoctl --help >/dev/null
          /tmp/ufo-wheel-venv/bin/python - <<'PY'
          from importlib.metadata import entry_points

          for group in ("ufo.extension", "ufo.pack"):
              entries = entry_points(group=group)
              assert entries, group
              for entry in entries:
                  entry.load()()
          PY
      - run: uv run pytest --collect-only -m integration -q

  # The portal is a built app. This job is the only one that installs its npm tree for testing:
  # it builds, proves the bundle and the page walk, and publishes the output the pytest shards
  # read. `checks` builds its own copy because the wheel gate has to see the production shape
  # assembled from a clean tree.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/web/frontend/package-lock.json
      - run: npm --prefix extensions/web/frontend ci
      - run: npm --prefix extensions/web/frontend run build
      - run: npm --prefix extensions/web/frontend test
      - run: npm --prefix extensions/web/frontend run walk
      - uses: actions/upload-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: test shard ${{ matrix.shard }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ufo
          POSTGRES_PASSWORD: ufo
          POSTGRES_DB: ufo
        ports:
          - 5541:5432
        options: >-
          --health-cmd "pg_isready -U ufo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      # The portal's Python tests read its built page. The `web` job built it once; a missing
      # artifact fails this step rather than letting the suite test an absent page.
      - uses: actions/download-artifact@v4
        with:
          name: portal-static
          path: extensions/web/ufo_ext_web/static
      - run: uv run pytest -n auto --shard "${{ matrix.shard }}" -m "not serial and not integration and not docker" -q

  control-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run --project control pytest control/tests --ignore=control/tests/test_rls.py -q

  integration:
    uses: ./.github/workflows/integration.yaml

  test:
    if: always()
    needs: [test-shard, control-test, integration]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = success
      - run: test "${{ needs.control-test.result }}" = success
      - run: test "${{ needs.integration.result }}" = success

  # The workspace RLS proof uses its own SUPERUSER Postgres on :5544 (never the parallel
  # suite's :5541). Setup CREATEs roles + databases, applies RLS
  # policies, and mints the RLS-subject serve role — so it needs a superuser and is the sole owner of
  # its cluster (global DROP ROLE/DATABASE), which is why it runs on its own runner, serial, off the
  # `test` job's xdist. This is the gate the U1 / ufo_dbos / serve-role bugs slipped past; UFO_RLS_
  # REQUIRED makes an unreachable DB a hard collection error, so the suite can never silently skip.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-admin:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5544:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run --project control pytest control/tests/test_rls.py -q
        env:
          UFO_RLS_REQUIRED: "1"
