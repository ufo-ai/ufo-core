[project]
name = "selfhost-ext-sites"
version = "0.1.0"
description = "Website tool pack: build and serve sites in the sandbox, and the website-building subagent"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
sites = "selfhost_ext_sites.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_sites"]
