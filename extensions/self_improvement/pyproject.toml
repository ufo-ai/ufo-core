[project]
name = "selfhost-ext-self-improvement"
version = "0.1.0"
description = "Self-improvement extension: offline-replay eval loop opening governed prompt changes"
requires-python = ">=3.12"
dependencies = ["selfhost", "anthropic>=0.40"]

[project.entry-points."selfhost.extension"]
self_improvement = "selfhost_ext_self_improvement.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_self_improvement"]
