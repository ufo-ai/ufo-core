<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ufo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText;
         height: 100vh; display: grid; grid-template-columns: 240px 1fr; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

  nav { display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  .brand { padding: 14px 16px; font-weight: 600; letter-spacing: 0.35em; }
  #agents { flex: 1; overflow-y: auto; padding: 4px 0; margin: 0; list-style: none; }
  #agents button { display: block; width: 100%; text-align: left; padding: 8px 16px 8px 14px;
                   border: 0; border-left: 2px solid transparent; background: none;
                   color: inherit; }
  #agents button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
  #agents button[aria-current="true"] { border-left-color: CanvasText;
                                        background: color-mix(in srgb, CanvasText 6%, transparent); }
  #agents .model { display: block; opacity: 0.55; }
  nav footer { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;
               border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  nav footer a { color: inherit; }
  nav footer button { border: 0; background: none; color: inherit; padding: 0; text-align: left;
                      font: inherit; text-decoration: underline; }
  .admin-view { padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
                gap: 18px; }
  .admin-view h2 { margin: 0; font-size: 14px; }
  .admin-view table { border-collapse: collapse; }
  .admin-view th, .admin-view td { text-align: left; padding: 4px 14px 4px 0; vertical-align: top;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #agent-head { padding: 12px 16px; display: flex; gap: 10px; align-items: baseline;
                border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #agent-head h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #agent-head .model { opacity: 0.55; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;
         gap: 10px; }
  .bubble { max-width: 70ch; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap;
            word-wrap: break-word; }
  .me { align-self: flex-end; background: color-mix(in srgb, CanvasText 12%, transparent); }
  .agent { align-self: flex-start; background: color-mix(in srgb, CanvasText 6%, transparent); }
  .meta { font-size: 12px; opacity: 0.6; margin-top: 4px;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bubble a { color: inherit; }
  .empty { margin: auto; max-width: 44ch; text-align: center; opacity: 0.7; }
  #composer { display: flex; gap: 8px; padding: 12px 16px;
              border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #msg { flex: 1; padding: 10px 12px; border-radius: 8px; font: inherit;
         border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
         background: Field; color: FieldText; }
  .send, #token-form button { padding: 10px 18px; border: 0; border-radius: 8px;
         background: CanvasText; color: Canvas; font-weight: 600; }
  .send:disabled { opacity: 0.4; cursor: default; }

  #token-card { grid-column: 1 / -1; margin: auto; width: min(440px, calc(100vw - 32px));
                border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
                border-radius: 12px; padding: 20px; display: none; }
  #token-card h1 { margin: 0 0 4px; font-size: 18px; }
  #token-card .hint { font-size: 13px; opacity: 0.75; margin-bottom: 14px; }
  #token-form { display: flex; gap: 8px; }
  #token-form input { flex: 1; padding: 10px 12px; border-radius: 8px; font: inherit;
                      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
                      background: Field; color: FieldText; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { flex-direction: row; align-items: center; border-right: 0;
          border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .brand { padding: 10px 12px; }
    #agents { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; }
    #agents button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid
                     transparent; }
    #agents button[aria-current="true"] { border-bottom-color: CanvasText; }
    #agents .model { display: none; }
    nav footer { border-top: 0; margin-left: auto; padding: 10px 12px; }
    nav footer .email { display: none; }
  }
</style>
</head>
<body>
<section id="token-card">
  <h1>Open your workspace</h1>
  <div class="hint">Paste the session token from <code>ufoctl init</code> or your sign-in
    page.</div>
  <form id="token-form" method="post" action="/surface/web">
    <input name="token" placeholder="Session token" required autofocus>
    <button type="submit">Open</button>
  </form>
</section>

<nav hidden>
  <div class="brand">u f o</div>
  <ul id="agents"></ul>
  <footer class="mono">
    <span class="email" id="member-email"></span>
    <a id="spend" href="/surface/web/spend" hidden>spend</a>
    <button id="admin" type="button" hidden>administration</button>
  </footer>
</nav>

<main hidden>
  <div id="agent-head"></div>
  <div id="log"></div>
  <form id="composer">
    <input id="msg" autocomplete="off" placeholder="Message the agent…">
    <button type="submit" class="send">Send</button>
  </form>
</main>

<script>
const BASE = '/surface/web';
const nav = document.querySelector('nav');
const main = document.querySelector('main');
const list = document.getElementById('agents');
const head = document.getElementById('agent-head');
const log = document.getElementById('log');
const composer = document.getElementById('composer');
const input = document.getElementById('msg');
const send = composer.querySelector('button');
let agents = [];
let selected = null;
const chats = new Map();

function chatState(id) {
  let state = chats.get(id);
  if (!state) {
    state = { messages: null, busy: false };
    chats.set(id, state);
  }
  return state;
}

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'bubble ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function emptyState(text) {
  const el = document.createElement('div');
  el.className = 'empty';
  el.textContent = text;
  log.appendChild(el);
}

function cell(text) {
  const el = document.createElement('td');
  el.textContent = text;
  return el;
}

function row(...texts) {
  const el = document.createElement('tr');
  texts.forEach((text) => el.appendChild(cell(text)));
  return el;
}

function table(headers, rows) {
  const el = document.createElement('table');
  const heading = document.createElement('tr');
  headers.forEach((header) => {
    const cellEl = document.createElement('th');
    cellEl.textContent = header;
    heading.appendChild(cellEl);
  });
  el.appendChild(heading);
  rows.forEach((entry) => el.appendChild(entry));
  return el;
}

async function showAdmin() {
  selected = null;
  location.hash = '#/admin';
  for (const item of list.children) item.firstChild.setAttribute('aria-current', 'false');
  const view = document.createElement('div');
  view.className = 'admin-view';
  main.replaceChildren(view);
  let res;
  try {
    res = await fetch(BASE + '/api/admin', { credentials: 'same-origin' });
  } catch (err) {
    view.textContent = 'network error — try again';
    return;
  }
  if (!res.ok) {
    view.textContent = 'error ' + res.status + ' — reload to retry';
    return;
  }
  const payload = await res.json();
  const agentsTitle = document.createElement('h2');
  agentsTitle.textContent = 'Agents';
  view.appendChild(agentsTitle);
  view.appendChild(table(
    ['agent', 'model', 'public internet', 'surfaces', 'web audience'],
    payload.agents.map((agent) => row(
      agent.name + (agent.main ? ' ·' : ''),
      agent.model,
      agent.internet_access_allowed ? 'allowed' : 'blocked',
      agent.installations.join(', ') || '—',
      agent.web_audience.concat('admins').join(', ')
    ))
  ));
  const membersTitle = document.createElement('h2');
  const seats = payload.seats;
  const gated = seats.limit !== null || seats.included !== null;
  membersTitle.textContent = 'Members'
    + (gated ? '' : ' · seats ungated')
    + (seats.limit !== null ? ' · ' + seats.limit + ' seat limit' : '')
    + (seats.included !== null ? ' · ' + seats.included + ' included' : '');
  view.appendChild(membersTitle);
  view.appendChild(table(
    gated ? ['member', 'role', 'seat'] : ['member', 'role'],
    payload.members.map((member) => gated
      ? row(member.email, member.admin ? 'admin' : 'member', member.seated ? 'seated' : '—')
      : row(member.email, member.admin ? 'admin' : 'member'))
  ));
}

function restoreChatPane() {
  main.replaceChildren(head, log, composer);
}

function agentFromHash() {
  const match = location.hash.match(/^#\/agents\/([0-9a-f-]{36})$/);
  return match && agents.find((agent) => agent.id === match[1]);
}

function renderSidebar(member) {
  document.getElementById('member-email').textContent =
    member.email + (member.admin ? ' · admin' : '');
  document.getElementById('spend').hidden = !member.admin;
  const admin = document.getElementById('admin');
  admin.hidden = !member.admin;
  admin.addEventListener('click', showAdmin);
  list.replaceChildren(...agents.map((agent) => {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    const name = document.createElement('span');
    name.textContent = agent.name + (agent.main ? ' ·' : '');
    const model = document.createElement('span');
    model.className = 'model mono';
    model.textContent = agent.model;
    button.append(name, model);
    button.addEventListener('click', () => select(agent));
    item.appendChild(button);
    item.dataset.id = agent.id;
    return item;
  }));
}

function syncComposer() {
  const state = selected && chatState(selected.id);
  send.disabled = !state || state.busy || state.messages === null;
}

function renderChat(agent) {
  const state = chatState(agent.id);
  log.replaceChildren();
  if (state.messages === null) return;
  for (const message of state.messages) {
    bubble(message.role === 'user' ? 'me' : 'agent', message.text);
  }
  if (!state.messages.length && !state.busy) {
    emptyState('No conversation with ' + agent.name + ' yet.');
  }
}

async function select(agent) {
  if (!head.isConnected) restoreChatPane();
  selected = agent;
  location.hash = '#/agents/' + agent.id;
  for (const item of list.children) {
    item.firstChild.setAttribute('aria-current', item.dataset.id === agent.id);
  }
  head.replaceChildren();
  const name = document.createElement('h1');
  name.textContent = agent.name;
  const model = document.createElement('span');
  model.className = 'model mono';
  model.textContent = agent.model;
  head.append(name, model);
  const state = chatState(agent.id);
  renderChat(agent);
  syncComposer();
  if (state.messages === null) {
    const res = await fetch(BASE + '/agents/' + agent.id + '/transcript',
      { credentials: 'same-origin' });
    const loaded = res.ok ? (await res.json()).messages : [];
    if (state.messages === null) state.messages = loaded;
    if (selected !== agent) return;
    renderChat(agent);
    syncComposer();
  }
  input.focus();
}

composer.addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || !selected) return;
  const agent = selected;
  const state = chatState(agent.id);
  if (state.busy || state.messages === null) return;
  input.value = '';
  state.busy = true;
  syncComposer();
  if (!state.messages.length) log.replaceChildren();
  state.messages.push({ role: 'user', text });
  bubble('me', text);
  const reply = bubble('agent', '');
  run(agent, state, text, reply);
});

async function run(agent, state, text, reply) {
  function finish() {
    state.busy = false;
    if (selected === agent) {
      if (!reply.isConnected) renderChat(agent);
      syncComposer();
      input.focus();
    }
  }
  let res;
  try {
    res = await fetch(BASE + '/agents/' + agent.id + '/chat',
      { method: 'POST', body: text, credentials: 'same-origin' });
  } catch (err) {
    reply.textContent = 'network error — try again';
    finish();
    return;
  }
  if (!res.ok) {
    reply.textContent = 'error ' + res.status + ' — try again';
    finish();
    return;
  }
  const turnId = (await res.json()).turn_id;
  const source = new EventSource(BASE + '/turns/' + turnId + '/stream');
  const streamedText = document.createTextNode('');
  reply.appendChild(streamedText);
  let meter = null;
  let activity = null;
  function note(text) {
    if (!activity) {
      activity = document.createElement('div');
      activity.className = 'meta';
      reply.appendChild(activity);
    }
    activity.textContent = text;
    log.scrollTop = log.scrollHeight;
  }
  function record() {
    if (streamedText.textContent) {
      state.messages.push({ role: 'assistant', text: streamedText.textContent });
    }
  }
  function close() {
    source.close();
    finish();
  }
  source.onmessage = (event) => {
    streamedText.textContent += JSON.parse(event.data).text;
    log.scrollTop = log.scrollHeight;
  };
  source.addEventListener('tool', (event) => {
    const frame = JSON.parse(event.data);
    note(frame.description || (frame.tool + ' ' + frame.preview));
  });
  source.addEventListener('skill', (event) => {
    note('loading skill: ' + JSON.parse(event.data).skill);
  });
  source.addEventListener('cost', (event) => {
    const frame = JSON.parse(event.data);
    if (!meter) {
      meter = document.createElement('div');
      meter.className = 'meta';
      reply.appendChild(meter);
    }
    meter.textContent = frame.tokens + ' tok · $' + (frame.cost_micro_usd / 1e6).toFixed(6);
    log.scrollTop = log.scrollHeight;
  });
  source.addEventListener('connect', (event) => {
    const link = document.createElement('a');
    link.href = JSON.parse(event.data).url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Connect account';
    reply.appendChild(link);
    log.scrollTop = log.scrollHeight;
  });
  source.addEventListener('connect_error', (event) => {
    note(JSON.parse(event.data).message);
  });
  source.addEventListener('terminal', (event) => {
    const frame = JSON.parse(event.data);
    if (frame.status === 'done') {
      if (frame.text && !streamedText.textContent) streamedText.textContent = frame.text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = frame.model + ' · ' + frame.tokens + ' tok · $'
        + (frame.cost_micro_usd / 1e6).toFixed(6);
      reply.appendChild(meta);
    } else {
      streamedText.textContent += (streamedText.textContent ? '\n' : '')
        + (frame.text || '(' + frame.status
           + (frame.error_class ? ': ' + frame.error_class : '') + ')');
    }
    record();
    close();
  });
  source.addEventListener('parked', (event) => {
    streamedText.textContent += (streamedText.textContent ? '\n' : '')
      + JSON.parse(event.data).message;
    record();
    close();
  });
  source.onerror = () => close();
}

async function boot() {
  let res;
  try {
    res = await fetch(BASE + '/api/agents', { credentials: 'same-origin' });
  } catch (err) {
    res = null;
  }
  if (!res || res.status === 401) {
    document.getElementById('token-card').style.display = 'block';
    return;
  }
  if (!res.ok) {
    const failed = document.createElement('div');
    failed.className = 'empty';
    failed.style.gridColumn = '1 / -1';
    failed.textContent = 'error ' + res.status + ' — reload to retry';
    document.body.replaceChildren(failed);
    return;
  }
  const payload = await res.json();
  agents = payload.agents;
  nav.hidden = false;
  main.hidden = false;
  renderSidebar(payload.member);
  if (!agents.length) {
    composer.style.display = 'none';
    emptyState('No agents are shared with you yet. Ask a workspace admin for access.');
    return;
  }
  if (location.hash === '#/admin' && payload.member.admin) {
    showAdmin();
    return;
  }
  select(agentFromHash() || agents[0]);
}

boot();
</script>
</body>
</html>
