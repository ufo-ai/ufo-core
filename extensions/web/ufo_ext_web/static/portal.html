<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ufo</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText;
         height: 100vh; display: grid; grid-template-columns: 240px 1fr; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid CanvasText; outline-offset: 2px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }

  nav { display: flex; flex-direction: column; min-height: 0;
        border-right: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  .brand { padding: 14px 16px; font-weight: 600; letter-spacing: 0.35em; }
  #agents { flex: 1; overflow-y: auto; padding: 4px 0; margin: 0; list-style: none; }
  #agents button { display: block; width: 100%; text-align: left; padding: 8px 16px 8px 14px;
                   border: 0; border-left: 2px solid transparent; background: none;
                   color: inherit; }
  #agents button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
  #agents button[aria-current="true"] { border-left-color: CanvasText;
                                        background: color-mix(in srgb, CanvasText 6%, transparent); }
  #agents .model { display: block; opacity: 0.55; }
  nav footer { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px;
               border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  nav footer a { color: inherit; }
  nav footer button { border: 0; background: none; color: inherit; padding: 0; text-align: left;
                      font: inherit; text-decoration: underline; }
  .admin-view { padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
                gap: 18px; }
  .admin-view h2 { margin: 0; font-size: 14px; }
  .admin-view table { border-collapse: collapse; }
  .admin-view th, .admin-view td { text-align: left; padding: 4px 14px 4px 0; vertical-align: top;
        border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); }
  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #agent-head { padding: 12px 16px 0; display: flex; gap: 10px; align-items: baseline; }
  #agent-head h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #agent-head .model { opacity: 0.55; }
  #tabs { display: flex; gap: 4px; padding: 6px 12px 0;
          border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #tabs button { padding: 6px 10px; border: 0; border-bottom: 2px solid transparent;
                 background: none; color: inherit; opacity: 0.7; }
  #tabs button[aria-selected="true"] { border-bottom-color: CanvasText; opacity: 1;
                                       font-weight: 600; }
  #panel { flex: 1; overflow-y: auto; padding: 16px; }
  #panel table { border-collapse: collapse; width: 100%; margin: 0 0 20px; }
  #panel th, #panel td { text-align: left; padding: 6px 10px;
                         border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
                         vertical-align: baseline; }
  #panel th { font-size: 12px; opacity: 0.6; font-weight: 600; }
  #panel .empty { display: block; margin: 40px auto; }
  #panel section { margin-bottom: 22px; max-width: 76ch; }
  #panel section h2 { font-size: 13px; margin: 0 0 6px; opacity: 0.7; }
  #panel .field { margin-bottom: 12px; }
  #panel .field label { display: block; font-weight: 600; margin-bottom: 2px; }
  #panel .hint { font-size: 12px; opacity: 0.6; margin: 4px 0 12px; max-width: 64ch; }
  #panel select { max-width: 40ch; padding: 8px 10px; border-radius: 8px; font: inherit;
                 background: Field; color: FieldText;
                 border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); }
  #panel input[type="text"] { width: 100%; max-width: 40ch; padding: 8px 10px;
                 border-radius: 8px; font: inherit; background: Field; color: FieldText;
                 border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); }
  #panel pre { overflow-x: auto; padding: 12px; border-radius: 8px; white-space: pre-wrap;
               background: color-mix(in srgb, CanvasText 6%, transparent);
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #panel .result { margin-top: 10px; }
  #panel h2 { font-size: 13px; opacity: 0.7; margin: 14px 0 4px; }
  #panel form.search { display: flex; gap: 8px; margin-bottom: 12px; }
  #panel form.search input { flex: 1; padding: 8px 10px; border-radius: 8px; font: inherit;
                      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
                      background: Field; color: FieldText; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column;
         gap: 10px; }
  .bubble { max-width: 70ch; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap;
            word-wrap: break-word; }
  .me { align-self: flex-end; background: color-mix(in srgb, CanvasText 12%, transparent); }
  .agent { align-self: flex-start; background: color-mix(in srgb, CanvasText 6%, transparent); }
  .meta { font-size: 12px; opacity: 0.6; margin-top: 4px;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bubble a { color: inherit; }
  .empty { margin: auto; max-width: 44ch; text-align: center; opacity: 0.7; }
  #composer { display: flex; gap: 8px; padding: 12px 16px;
              border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
  #msg { flex: 1; padding: 10px 12px; border-radius: 8px; font: inherit;
         border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
         background: Field; color: FieldText; }
  .send, #token-form button { padding: 10px 18px; border: 0; border-radius: 8px;
         background: CanvasText; color: Canvas; font-weight: 600; }
  .send:disabled { opacity: 0.4; cursor: default; }

  #token-card { grid-column: 1 / -1; margin: auto; width: min(440px, calc(100vw - 32px));
                border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
                border-radius: 12px; padding: 20px; display: none; }
  #token-card h1 { margin: 0 0 4px; font-size: 18px; }
  #token-card .hint { font-size: 13px; opacity: 0.75; margin-bottom: 14px; }
  #token-form { display: flex; gap: 8px; }
  #token-form input { flex: 1; padding: 10px 12px; border-radius: 8px; font: inherit;
                      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
                      background: Field; color: FieldText; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    nav { flex-direction: row; align-items: center; border-right: 0;
          border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    .brand { padding: 10px 12px; }
    #agents { display: flex; overflow-x: auto; overflow-y: hidden; padding: 0; }
    #agents button { width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid
                     transparent; }
    #agents button[aria-current="true"] { border-bottom-color: CanvasText; }
    #agents .model { display: none; }
    nav footer { border-top: 0; margin-left: auto; padding: 10px 12px; }
    nav footer .email { display: none; }
  }
</style>
</head>
<body>
<section id="token-card">
  <h1>Open your workspace</h1>
  <div class="hint">Paste the session token from <code>ufoctl init</code> or your sign-in
    page.</div>
  <form id="token-form" method="post" action="/surface/web">
    <input name="token" placeholder="Session token" required autofocus>
    <button type="submit">Open</button>
  </form>
</section>

<nav hidden>
  <div class="brand">u f o</div>
  <ul id="agents"></ul>
  <footer class="mono">
    <span class="email" id="member-email"></span>
    <a id="spend" href="/surface/web/spend" hidden>spend</a>
    <button id="admin" type="button" hidden>administration</button>
  </footer>
</nav>

<main hidden>
  <div id="agent-head"></div>
  <div id="tabs" role="tablist"></div>
  <div id="log"></div>
  <div id="panel" hidden></div>
  <form id="composer">
    <input id="msg" autocomplete="off" placeholder="Message the agent…">
    <button type="submit" class="send">Send</button>
  </form>
</main>

<script>
const BASE = '/surface/web';
const MAX_STREAM_RETRIES = 5;
const nav = document.querySelector('nav');
const main = document.querySelector('main');
const list = document.getElementById('agents');
const head = document.getElementById('agent-head');
const tabs = document.getElementById('tabs');
const panel = document.getElementById('panel');
const log = document.getElementById('log');
const composer = document.getElementById('composer');
const input = document.getElementById('msg');
const send = composer.querySelector('button');
let agents = [];
let member = null;
let selected = null;
const chats = new Map();

function chatState(id) {
  let state = chats.get(id);
  if (!state) {
    state = { messages: null, busy: false, live: null };
    chats.set(id, state);
  }
  return state;
}

function bubble(cls, text) {
  const el = document.createElement('div');
  el.className = 'bubble ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function errorLine(text) {
  const line = document.createElement('div');
  line.className = 'meta';
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function emptyState(text) {
  const el = document.createElement('div');
  el.className = 'empty';
  el.textContent = text;
  log.appendChild(el);
}

const TABS = ['chat', 'overview', 'tasks', 'connections', 'credentials', 'sources', 'skills',
  'memory', 'usage'];
let tab = 'chat';
let panelLoad = 0;

function hashState() {
  const match = location.hash.match(/^#\/agents\/([0-9a-f-]{36})(?:\/(\w+))?$/);
  if (!match) return { agent: null, tab: 'chat' };
  return {
    agent: agents.find((agent) => agent.id === match[1]) || null,
    tab: TABS.includes(match[2]) ? match[2] : 'chat',
  };
}

function cell(text) {
  const el = document.createElement('td');
  el.textContent = text == null ? '\u2014' : text;
  return el;
}

function row(...texts) {
  const el = document.createElement('tr');
  texts.forEach((text) => el.appendChild(cell(text)));
  return el;
}

function table(headers, rows) {
  const el = document.createElement('table');
  const heading = document.createElement('tr');
  headers.forEach((header) => {
    const cellEl = document.createElement('th');
    cellEl.textContent = header;
    heading.appendChild(cellEl);
  });
  el.appendChild(heading);
  rows.forEach((entry) => el.appendChild(entry));
  return el;
}

async function showAdmin() {
  selected = null;
  panelLoad += 1;
  location.hash = '#/admin';
  for (const item of list.children) item.firstChild.setAttribute('aria-current', 'false');
  const view = document.createElement('div');
  view.className = 'admin-view';
  main.replaceChildren(view);
  let res;
  try {
    res = await fetch(BASE + '/api/admin', { credentials: 'same-origin' });
  } catch (err) {
    view.textContent = 'Network error — try again.';
    return;
  }
  if (!res.ok) {
    view.textContent = 'Error ' + res.status + ' — reload to retry.';
    return;
  }
  const payload = await res.json();
  const agentsTitle = document.createElement('h2');
  agentsTitle.textContent = 'Agents';
  view.appendChild(agentsTitle);
  view.appendChild(table(
    ['agent', 'model', 'public internet', 'surfaces', 'web audience'],
    payload.agents.map((agent) => row(
      agent.name + (agent.main ? ' ·' : ''),
      agent.model,
      agent.internet_access_allowed ? 'allowed' : 'blocked',
      agent.installations.join(', ') || '—',
      agent.web_audience.concat('admins').join(', ')
    ))
  ));
  const membersTitle = document.createElement('h2');
  const seats = payload.seats;
  const gated = seats.limit !== null || seats.included !== null;
  membersTitle.textContent = 'Members'
    + (gated ? '' : ' · seats ungated')
    + (seats.limit !== null ? ' · ' + seats.limit + ' seat limit' : '')
    + (seats.included !== null ? ' · ' + seats.included + ' included' : '');
  view.appendChild(membersTitle);
  view.appendChild(table(
    gated ? ['member', 'role', 'seat'] : ['member', 'role'],
    payload.members.map((member) => gated
      ? row(member.email, member.admin ? 'admin' : 'member', member.seated ? 'seated' : '—')
      : row(member.email, member.admin ? 'admin' : 'member'))
  ));
}

function restoreChatPane() {
  main.replaceChildren(head, tabs, log, panel, composer);
}

function wireMemberChrome() {
  document.getElementById('member-email').textContent =
    member.email + (member.admin ? ' · admin' : '');
  document.getElementById('spend').hidden = !member.admin;
  const admin = document.getElementById('admin');
  admin.hidden = !member.admin;
  admin.addEventListener('click', showAdmin);
}

function renderSidebar() {
  list.replaceChildren(...agents.map((agent) => {
    const item = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    const name = document.createElement('span');
    name.textContent = agent.name + (agent.main ? ' ·' : '');
    const model = document.createElement('span');
    model.className = 'model mono';
    model.textContent = agent.model;
    button.append(name, model);
    button.setAttribute('aria-current', selected !== null && selected.id === agent.id);
    button.addEventListener('click', () => select(agent));
    item.appendChild(button);
    item.dataset.id = agent.id;
    return item;
  }));
}

function syncComposer() {
  const state = selected && chatState(selected.id);
  send.disabled = !state || state.busy || state.messages === null;
}

function renderChat(agent) {
  const state = chatState(agent.id);
  log.replaceChildren();
  if (state.messages === null) return;
  for (const message of state.messages) {
    if (message.role === 'error') {
      errorLine(message.text);
    } else {
      bubble(message.role === 'user' ? 'me' : 'agent', message.text);
    }
  }
  if (state.live) {
    log.appendChild(state.live);
    log.scrollTop = log.scrollHeight;
  }
  if (!state.messages.length && !state.busy) {
    emptyState('No conversation with ' + agent.name + ' yet.');
  }
}

const PANELS = {
  connections: {
    key: 'connections',
    columns: ['provider', 'account', 'owner', 'access', 'connected'],
    row: (entry) => [entry.provider, entry.account_id, entry.owner_email,
                     entry.shared ? 'agent-shared' : 'private',
                     entry.connected_at.slice(0, 10)],
    empty: 'No accounts are connected to this agent.',
  },
  credentials: {
    key: 'slots',
    columns: ['slot', 'description', 'extension', 'state'],
    row: (entry) => [entry.slot, entry.description, entry.extension,
                     entry.filled ? 'filled' : 'empty'],
    empty: 'No credential slots are declared.',
  },
  tasks: {
    key: 'tasks',
    columns: ['name', 'schedule', 'task', 'creator', 'next run', 'last run', 'expires'],
    row: (entry) => [entry.name, entry.schedule,
                     entry.description || entry.prompt || 'private member task',
                     entry.created_by || '—', day(entry.next_run_at) || '—',
                     day(entry.last_run_at) || '—', day(entry.expires_at) || '—'],
    empty: 'No scheduled tasks for this agent.',
  },
  sources: {
    key: 'sources',
    columns: ['backend', 'owner', 'access', 'errors', 'next sync'],
    row: (entry) => [entry.backend, entry.owner_email || '—',
                     entry.shared ? 'shared' : 'private',
                     String(entry.consecutive_errors),
                     entry.next_sync_at.replace('T', ' ').slice(0, 16)],
    empty: 'No sources are registered.',
  },
};

function renderTabs() {
  tabs.replaceChildren(...TABS.map((name) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', name === tab);
    button.textContent = name;
    button.addEventListener('click', () => selectTab(name));
    return button;
  }));
}

function fail(load, text, notice) {
  if (load !== panelLoad) return;
  const failed = document.createElement('span');
  failed.className = 'empty';
  failed.textContent = notice ? notice + ' The panel could not be re-read: ' + text : text;
  panel.appendChild(failed);
}

function panelEmpty(text) {
  const el = document.createElement('span');
  el.className = 'empty';
  el.textContent = text;
  panel.appendChild(el);
}

function day(iso) {
  return iso == null ? null : iso.slice(0, 16).replace('T', ' ');
}

async function renderSkills(agent, load) {
  let listed;
  try {
    const res = await fetch(BASE + '/agents/' + agent.id + '/skills',
      { credentials: 'same-origin' });
    if (load !== panelLoad) return;
    if (!res.ok) { panelEmpty('Error ' + res.status + ' — reload to retry.'); return; }
    listed = (await res.json()).skills;
  } catch (err) {
    fail(load, 'Network error — try again.');
    return;
  }
  if (load !== panelLoad) return;
  const custom = listed.filter((skill) => skill.origin === 'member');
  const deploy = listed.filter((skill) => skill.origin === 'deploy');
  for (const [title, group, empty] of [
    ["This agent's skills", custom, 'No member-authored skills for ' + agent.name + '.'],
    ['Deploy skills', deploy, 'No deploy skills.'],
  ]) {
    const heading = document.createElement('h2');
    heading.textContent = title;
    panel.appendChild(heading);
    if (!group.length) { panelEmpty(empty); continue; }
    panel.appendChild(table(
      ['name', 'description'],
      group.map((skill) => row(skill.name, skill.description))
    ));
  }
}

async function renderMemory(agent, load, query) {
  const form = document.createElement('form');
  form.className = 'search';
  const search = document.createElement('input');
  search.placeholder = 'Search memory…';
  search.value = query || '';
  const go = document.createElement('button');
  go.type = 'submit';
  go.className = 'send';
  go.textContent = 'Search';
  form.append(search, go);
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (search.value.trim()) selectTab('memory', search.value.trim());
  });
  panel.appendChild(form);
  if (!query) return;
  let payload;
  try {
    const res = await fetch(
      BASE + '/agents/' + agent.id + '/memory?q=' + encodeURIComponent(query),
      { credentials: 'same-origin' });
    if (load !== panelLoad) return;
    if (!res.ok) { panelEmpty('Error ' + res.status + ' — reload to retry.'); return; }
    payload = await res.json();
  } catch (err) {
    fail(load, 'Network error — try again.');
    return;
  }
  if (load !== panelLoad) return;
  if (!payload.available) { panelEmpty('This deploy has no memory extension.'); return; }
  if (!payload.matches.length) { panelEmpty('No matches.'); return; }
  panel.appendChild(table(
    ['memory', 'kind', 'ref', 'date'],
    payload.matches.map((match) => row(match.text, match.kind, match.ref, day(match.created_at)))
  ));
}

async function renderUsage(agent, load) {
  let report;
  try {
    const res = await fetch(BASE + '/agents/' + agent.id + '/usage',
      { credentials: 'same-origin' });
    if (load !== panelLoad) return;
    if (!res.ok) { panelEmpty('Error ' + res.status + ' — reload to retry.'); return; }
    report = await res.json();
  } catch (err) {
    fail(load, 'Network error — try again.');
    return;
  }
  if (load !== panelLoad) return;
  const heading = document.createElement('h2');
  heading.textContent = 'Last ' + (report.window_seconds / 3600) + 'h · $'
    + (report.total_micro_usd / 1e6).toFixed(6);
  panel.appendChild(heading);
  if (!report.by_dimension.length) panelEmpty('No spend in window for ' + agent.name + '.');
  else {
    panel.appendChild(table(
      ['dimension', 'units', 'cost'],
      report.by_dimension.map((line) => row(
        line.dimension,
        line.amount.toLocaleString(),
        '$' + (line.priced_micro_usd / 1e6).toFixed(6)
      ))
    ));
  }
  const caps = document.createElement('h2');
  caps.textContent = 'Caps for this agent';
  panel.appendChild(caps);
  if (!report.caps.length) panelEmpty('No agent-scoped caps.');
  else {
    panel.appendChild(table(
      ['window', 'limit', 'on breach'],
      report.caps.map((cap) => row(
        (cap.window_seconds / 3600) + 'h',
        '$' + (cap.limit_micro_usd / 1e6).toFixed(2),
        cap.on_breach
      ))
    ));
  }
  if (report.workspace_spend) {
    const link = document.createElement('a');
    link.href = BASE + '/spend';
    link.textContent = 'workspace totals';
    panel.appendChild(link);
  }
}

async function selectTab(name, detail) {
  tab = name;
  const load = ++panelLoad;
  renderTabs();
  location.hash = '#/agents/' + selected.id + (name === 'chat' ? '' : '/' + name);
  const chatting = name === 'chat';
  log.hidden = !chatting;
  composer.hidden = !chatting;
  panel.hidden = chatting;
  if (chatting) {
    input.focus();
    return;
  }
  const agent = selected;
  panel.replaceChildren();
  if (name === 'overview') { await renderOverview(agent, load, detail); return; }
  if (name === 'skills') { await renderSkills(agent, load); return; }
  if (name === 'memory') { await renderMemory(agent, load, detail); return; }
  if (name === 'usage') { await renderUsage(agent, load); return; }
  const spec = PANELS[name];
  let entries;
  try {
    const res = await fetch(BASE + '/agents/' + agent.id + '/' + name,
      { credentials: 'same-origin' });
    if (load !== panelLoad) return;
    if (!res.ok) {
      fail(load, 'Error ' + res.status + ' — reload to retry.');
      return;
    }
    entries = (await res.json())[spec.key];
  } catch (err) {
    fail(load, 'Network error — try again.');
    return;
  }
  if (load !== panelLoad) return;
  if (!entries.length) {
    panelEmpty(spec.empty);
    return;
  }
  panel.appendChild(table(spec.columns, entries.map((entry) => row(...spec.row(entry)))));
}

function panelSection(title) {
  const section = document.createElement('section');
  const heading = document.createElement('h2');
  heading.textContent = title;
  section.appendChild(heading);
  panel.appendChild(section);
  return section;
}

function specField(key, prop, value, options) {
  const field = document.createElement('div');
  field.className = 'field';
  const label = document.createElement('label');
  label.textContent = key;
  field.appendChild(label);
  let widget;
  if (options) {
    widget = document.createElement('select');
    for (const option of options) {
      const entry = document.createElement('option');
      entry.value = entry.textContent = option;
      entry.selected = option === value;
      widget.appendChild(entry);
    }
  } else if (prop.type === 'boolean') {
    widget = document.createElement('input');
    widget.type = 'checkbox';
    widget.checked = value === true;
  } else {
    widget = document.createElement('input');
    widget.type = 'text';
    widget.value = value === undefined || value === null ? '' : String(value);
  }
  widget.dataset.key = key;
  label.htmlFor = widget.id = 'spec-' + key;
  field.appendChild(widget);
  return field;
}

async function renderOverview(agent, load, notice) {
  panel.replaceChildren();
  let data;
  try {
    const res = await fetch(BASE + '/agents/' + agent.id + '/overview',
      { credentials: 'same-origin' });
    if (load !== panelLoad) return;
    if (!res.ok) {
      fail(load, 'Error ' + res.status + ' — reload to retry.', notice);
      return;
    }
    data = await res.json();
  } catch (err) {
    fail(load, 'Network error — try again.', notice);
    return;
  }
  if (load !== panelLoad) return;
  const identity = panelSection('Agent');
  const facts = document.createElement('div');
  facts.className = 'mono';
  facts.textContent = [
    data.agent.main ? 'main agent' : 'agent',
    'installations: ' + (data.agent.surfaces.length ? data.agent.surfaces.join(', ') : 'none'),
    'updated ' + data.agent.updated_at.slice(0, 16).replace('T', ' '),
  ].join(' · ');
  identity.appendChild(facts);

  const settings = panelSection('Settings');
  const form = document.createElement('form');
  const properties = data.spec_schema.properties || {};
  for (const key of Object.keys(properties)) {
    form.appendChild(specField(
      key, properties[key], data.spec[key], key === 'model' ? data.models : null));
  }
  if (!data.deploy.sandbox_internet) {
    const ceiling = document.createElement('div');
    ceiling.className = 'hint';
    ceiling.textContent = 'This deploy grants no sandbox public internet — the agent setting '
      + 'narrows a capability that is currently off.';
    form.appendChild(ceiling);
  }
  const save = document.createElement('button');
  save.type = 'submit';
  save.className = 'send';
  save.textContent = 'Save';
  form.appendChild(save);
  const result = document.createElement('div');
  result.className = 'result mono';
  if (notice) result.textContent = notice;
  form.appendChild(result);
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    save.disabled = true;
    const spec = {};
    for (const widget of form.querySelectorAll('input[data-key], select[data-key]')) {
      spec[widget.dataset.key] = widget.type === 'checkbox' ? widget.checked : widget.value;
    }
    let submitted;
    try {
      submitted = await fetch(BASE + '/agents/' + agent.id + '/intents', {
        method: 'POST',
        credentials: 'same-origin',
        body: JSON.stringify({ verb: 'apply', kind: 'agent', name: data.agent.name, spec }),
      });
    } catch (err) {
      result.textContent = 'Network error — try again.';
      save.disabled = false;
      return;
    }
    const outcome = await submitted.json().catch(() => null);
    result.textContent = outcome && outcome.message
      ? outcome.message
      : 'Error ' + submitted.status + ' — try again.';
    save.disabled = false;
    if (outcome && outcome.applied) {
      agent.model = spec.model || agent.model;
      renderSidebar();
      if (selected !== agent) return;
      renderHead(agent);
      if (tab === 'overview') selectTab('overview', outcome.message);
    }
  });
  settings.appendChild(form);

  const prompt = panelSection('Prompt');
  const digest = document.createElement('div');
  digest.className = 'hint mono';
  digest.textContent = 'digest ' + data.agent.prompt_digest + ' — prompt changes go through the '
    + 'governed proposal path in chat';
  prompt.appendChild(digest);
  const text = document.createElement('pre');
  text.textContent = data.agent.prompt;
  prompt.appendChild(text);

  if (data.audience) {
    const audience = panelSection('Web audience');
    const emails = document.createElement('div');
    emails.className = 'mono';
    emails.textContent = data.audience.length
      ? data.audience.join(', ')
      : 'no member grants — admins only';
    audience.appendChild(emails);
  }
}


function renderHead(agent) {
  head.replaceChildren();
  const title = document.createElement('h1');
  title.textContent = agent.name;
  const model = document.createElement('span');
  model.className = 'model mono';
  model.textContent = agent.model;
  head.append(title, model);
}

async function select(agent, name, detail) {
  if (!head.isConnected) restoreChatPane();
  selected = agent;
  for (const item of list.children) {
    item.firstChild.setAttribute('aria-current', item.dataset.id === agent.id);
  }
  renderHead(agent);
  const state = chatState(agent.id);
  renderChat(agent);
  syncComposer();
  await selectTab(name || 'chat', detail);
  if (tab === 'chat' && state.messages === null) {
    const res = await fetch(BASE + '/agents/' + agent.id + '/transcript',
      { credentials: 'same-origin' });
    const loaded = res.ok ? (await res.json()).messages : [];
    if (state.messages === null) state.messages = loaded;
    if (selected !== agent || tab !== 'chat') return;
    renderChat(agent);
    syncComposer();
  }
}

composer.addEventListener('submit', (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text || !selected) return;
  const agent = selected;
  const state = chatState(agent.id);
  if (state.busy || state.messages === null) return;
  input.value = '';
  state.busy = true;
  syncComposer();
  if (!state.messages.length) log.replaceChildren();
  state.messages.push({ role: 'user', text });
  bubble('me', text);
  const reply = bubble('agent', '');
  state.live = reply;
  run(agent, state, text, reply);
});

async function run(agent, state, text, reply) {
  function finish() {
    state.busy = false;
    state.live = null;
    if (selected === agent) {
      if (!reply.isConnected) renderChat(agent);
      if (tab === 'chat') input.focus();
      syncComposer();
    }
  }
  let res;
  try {
    res = await fetch(BASE + '/agents/' + agent.id + '/chat',
      { method: 'POST', body: text, credentials: 'same-origin' });
  } catch (err) {
    state.messages.push({ role: 'error', text: 'Network error — try again.' });
    reply.remove();
    finish();
    return;
  }
  if (!res.ok) {
    state.messages.push({ role: 'error', text: 'Error ' + res.status + ' — try again.' });
    reply.remove();
    finish();
    return;
  }
  const turnId = (await res.json()).turn_id;
  const source = new EventSource(BASE + '/turns/' + turnId + '/stream');
  const streamedText = document.createTextNode('');
  reply.appendChild(streamedText);
  let meter = null;
  let stalled = 0;
  let activity = null;
  function note(text) {
    if (!activity) {
      activity = document.createElement('div');
      activity.className = 'meta';
      reply.appendChild(activity);
    }
    activity.textContent = text;
    log.scrollTop = log.scrollHeight;
  }
  function record() {
    if (streamedText.textContent) {
      state.messages.push({ role: 'assistant', text: streamedText.textContent });
    }
  }
  function close() {
    source.close();
    finish();
  }
  source.addEventListener('open', () => { stalled = 0; });
  source.onmessage = (event) => {
    streamedText.textContent += JSON.parse(event.data).text;
    log.scrollTop = log.scrollHeight;
  };
  source.addEventListener('tool', (event) => {
    const frame = JSON.parse(event.data);
    note(frame.description || (frame.tool + ' ' + frame.preview));
  });
  source.addEventListener('skill', (event) => {
    note('loading skill: ' + JSON.parse(event.data).skill);
  });
  source.addEventListener('cost', (event) => {
    const frame = JSON.parse(event.data);
    if (!meter) {
      meter = document.createElement('div');
      meter.className = 'meta';
      reply.appendChild(meter);
    }
    meter.textContent = frame.tokens + ' tok · $' + (frame.cost_micro_usd / 1e6).toFixed(6);
    log.scrollTop = log.scrollHeight;
  });
  source.addEventListener('connect', (event) => {
    const link = document.createElement('a');
    link.href = JSON.parse(event.data).url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = 'Connect account';
    reply.appendChild(link);
    log.scrollTop = log.scrollHeight;
  });
  source.addEventListener('connect_error', (event) => {
    note(JSON.parse(event.data).message);
  });
  source.addEventListener('terminal', (event) => {
    const frame = JSON.parse(event.data);
    if (frame.status === 'done') {
      if (frame.text && !streamedText.textContent) streamedText.textContent = frame.text;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = frame.model + ' · ' + frame.tokens + ' tok · $'
        + (frame.cost_micro_usd / 1e6).toFixed(6);
      reply.appendChild(meta);
    } else {
      streamedText.textContent += (streamedText.textContent ? '\n' : '')
        + (frame.text || '(' + frame.status
           + (frame.error_class ? ': ' + frame.error_class : '') + ')');
    }
    record();
    close();
  });
  source.addEventListener('parked', (event) => {
    streamedText.textContent += (streamedText.textContent ? '\n' : '')
      + JSON.parse(event.data).message;
    record();
    close();
  });
  source.onerror = () => {
    stalled += 1;
    if (source.readyState !== EventSource.CLOSED && stalled < MAX_STREAM_RETRIES) return;
    record();
    state.messages.push({ role: 'error', text: 'Connection lost — reload to see the reply.' });
    reply.remove();
    close();
  };
}

async function boot() {
  let res;
  try {
    res = await fetch(BASE + '/api/agents', { credentials: 'same-origin' });
  } catch (err) {
    res = null;
  }
  if (!res || res.status === 401) {
    document.getElementById('token-card').style.display = 'block';
    return;
  }
  if (!res.ok) {
    const failed = document.createElement('div');
    failed.className = 'empty';
    failed.style.gridColumn = '1 / -1';
    failed.textContent = 'Error ' + res.status + ' — reload to retry.';
    document.body.replaceChildren(failed);
    return;
  }
  const payload = await res.json();
  agents = payload.agents;
  nav.hidden = false;
  main.hidden = false;
  member = payload.member;
  wireMemberChrome();
  renderSidebar();
  if (!agents.length) {
    composer.style.display = 'none';
    emptyState('No agents are shared with you yet. Ask a workspace admin for access.');
    return;
  }
  if (location.hash === '#/admin' && payload.member.admin) {
    showAdmin();
    return;
  }
  const opening = hashState();
  select(opening.agent || agents[0], opening.tab);
}

boot();
</script>
