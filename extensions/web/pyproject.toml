[project]
name = "selfhost-ext-web"
version = "0.1.0"
description = "Research web tool pack: search_web and fetch_url over Exa, egress-proxied via a BYOK credential slot"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
web = "selfhost_ext_web:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_web.py"]
