[project]
name = "selfhost-ext-web"
version = "0.1.0"
description = "Web chat surface extension: a self-contained chat page, cookie-authenticated admission, an SSE hub tail, and a spend view"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
web = "selfhost_ext_web.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_web"]
