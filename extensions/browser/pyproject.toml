[project]
name = "selfhost-ext-browser"
version = "0.1.0"
description = "Browser tool pack: sandbox browser/computer-use tools and the browser subagent profile"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
browser = "selfhost_ext_browser.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_browser"]
