[project]
name = "selfhost-ext-e2b"
version = "0.1.0"
description = "E2B sandbox carrier: runs the per-conversation sandbox on E2B cloud sandboxes"
requires-python = ">=3.12"
dependencies = ["selfhost", "e2b>=2.29"]

[project.entry-points."selfhost.extension"]
e2b = "selfhost_ext_e2b:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_e2b.py"]
