[project]
name = "selfhost-ext-mcp"
version = "0.1.0"
description = "MCP tool pack: discover and call the tools a workspace's configured MCP servers expose, over JSON-RPC"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
mcp = "selfhost_ext_mcp:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_mcp.py"]
