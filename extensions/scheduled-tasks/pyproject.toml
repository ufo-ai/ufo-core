[project]
name = "selfhost-ext-scheduled-tasks"
version = "0.1.0"
description = "Scheduled tasks extension: chat-native recurring tasks and a batch-at-interval runner that invokes the agent on schedule"
requires-python = ">=3.12"
dependencies = ["selfhost", "croniter>=2.0"]

[project.entry-points."selfhost.extension"]
scheduled_tasks = "selfhost_ext_scheduled_tasks.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_scheduled_tasks"]
