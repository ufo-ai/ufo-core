[project]
name = "selfhost-ext-skills"
version = "0.1.0"
description = "Skills authoring: the create-skill workflow that guides authoring and saving a workspace skill"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
skills = "selfhost_ext_skills:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_skills.py", "skills"]
