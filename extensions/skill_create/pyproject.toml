[project]
name = "selfhost-ext-skill-create"
version = "0.1.0"
description = "Skill authoring: the create-skill workflow, the save_custom_skill tool, and the per-turn runtime-skills provider"
requires-python = ">=3.12"
dependencies = ["selfhost", "sqlalchemy>=2", "pydantic>=2"]

[project.entry-points."selfhost.extension"]
skill_create = "selfhost_ext_skill_create.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_skill_create"]
