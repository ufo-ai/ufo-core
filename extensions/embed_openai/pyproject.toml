[project]
name = "selfhost-ext-embed-openai"
version = "0.1.0"
description = "Base-pinned default embed backend: OpenAI text-embedding-3-large over the async SDK"
requires-python = ">=3.12"
dependencies = ["selfhost", "openai>=1.0"]

[project.entry-points."selfhost.extension"]
embed-openai = "selfhost_ext_embed_openai:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_embed_openai.py"]
