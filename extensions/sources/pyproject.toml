[project]
name = "selfhost-ext-sources"
version = "0.1.0"
description = "Feed-sync content sources: the REST connector framework and its providers, consuming the pluggable auth-proxy seam"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
sources = "selfhost_ext_sources.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_sources"]
