[project]
name = "selfhost-ext-slack"
version = "0.1.0"
description = "Slack surface extension: thread-keyed ingress, durable writeback, streamed two-way file attachments"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
slack = "selfhost_ext_slack.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_slack"]
