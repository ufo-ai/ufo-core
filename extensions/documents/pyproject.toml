[project]
name = "selfhost-ext-documents"
version = "0.1.0"
description = "Document-production skills pack: PDF, Word (.docx), and the shared design foundations they build on"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
documents = "selfhost_ext_documents.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_documents"]
