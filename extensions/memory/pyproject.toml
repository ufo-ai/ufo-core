[project]
name = "selfhost-ext-memory"
version = "0.1.0"
description = "Memory: durable facts and recall — memory_search/memory_update tools, on_inbound recall, the memory-index job"
requires-python = ">=3.12"
dependencies = ["selfhost", "sqlalchemy>=2", "pydantic>=2"]

[project.entry-points."selfhost.extension"]
memory = "selfhost_ext_memory.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_memory"]
