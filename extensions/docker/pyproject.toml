[project]
name = "selfhost-ext-docker"
version = "0.1.0"
description = "Docker sandbox carrier: runs the per-conversation sandbox as a sibling container"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
docker = "selfhost_ext_docker:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_docker.py"]
