[project]
name = "selfhost-ext-research"
version = "0.1.0"
description = "Web-research tool pack: search_web, fetch_url, search_vertical, and wide_research over the selected search backend, plus the research and deep_research subagent profiles"
requires-python = ">=3.12"
dependencies = ["selfhost", "pydantic>=2.9"]

[project.entry-points."selfhost.extension"]
research = "selfhost_ext_research.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_research"]
