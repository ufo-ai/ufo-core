[project]
name = "selfhost-ext-exa"
version = "0.1.0"
description = "Exa search backend: the host-side ExaSearchProvider on core's search_providers seam, reading a BYOK Exa key in-process"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
exa = "selfhost_ext_exa:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_exa.py"]
