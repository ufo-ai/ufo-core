[project]
name = "selfhost-ext-repl"
version = "0.1.0"
description = "Persistent REPL tool pack: js_repl (Node) and xlsx_repl (Python/openpyxl) over the sandbox"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
repl = "selfhost_ext_repl:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_repl.py"]
