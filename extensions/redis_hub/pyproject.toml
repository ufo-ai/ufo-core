[project]
name = "selfhost-ext-redis-hub"
version = "0.1.0"
description = "Redis Streams live-frame hub: cross-process fan-out that scales serve out past one instance"
requires-python = ">=3.12"
dependencies = ["selfhost", "redis>=5"]

[project.entry-points."selfhost.extension"]
redis_hub = "selfhost_ext_redis_hub.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_redis_hub"]
