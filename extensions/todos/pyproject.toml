[project]
name = "selfhost-ext-todos"
version = "0.1.0"
description = "Todo checklist tool pack: update_todo_list and update_todo_status over the extension's scoped store"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
todos = "selfhost_ext_todos:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_todos.py", "todo_list_section.md"]
