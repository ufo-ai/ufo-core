[project]
name = "selfhost-ext-knowledge-graph"
version = "0.1.0"
description = "Knowledge graph: page -> typed-edge graph extraction, stub-on-reference nodes, and k-hop graph_search traversal"
requires-python = ">=3.12"
dependencies = ["selfhost", "sqlalchemy>=2", "pydantic>=2"]

[project.entry-points."selfhost.extension"]
knowledge_graph = "selfhost_ext_knowledge_graph.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_knowledge_graph"]
