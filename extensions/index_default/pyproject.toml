[project]
name = "selfhost-ext-index-default"
version = "0.1.0"
description = "Base-pinned default index backend: SQLite FTS5 + local cosine, Postgres tsvector + pgvector"
requires-python = ">=3.12"
dependencies = ["selfhost", "sqlalchemy>=2"]

[project.entry-points."selfhost.extension"]
index-default = "selfhost_ext_index_default:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_index_default.py", "migrations"]
