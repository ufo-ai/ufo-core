[project]
name = "selfhost-ext-connectors"
version = "0.1.0"
description = "Connector extension: Composio-brokered OAuth providers and their egress-proxied action tools"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
connectors = "selfhost_ext_connectors.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_connectors"]
