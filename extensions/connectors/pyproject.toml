[project]
name = "selfhost-ext-connectors"
version = "0.1.0"
description = "Connector extension: Composio-brokered OAuth providers, their dynamic action tools, and the Composio auth-proxy backend for feed-sync"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27", "fastmcp>=3.4.2"]

[project.entry-points."selfhost.extension"]
connectors = "selfhost_ext_connectors.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_connectors"]
