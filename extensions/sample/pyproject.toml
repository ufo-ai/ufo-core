[project]
name = "selfhost-ext-sample"
version = "0.1.0"
description = "Conformance sample extension: the probe that pins the public SDK seam"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
sample = "selfhost_ext_sample:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_sample.py"]
