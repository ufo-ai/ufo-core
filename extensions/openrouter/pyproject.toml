[project]
name = "selfhost-ext-openrouter"
version = "0.1.0"
description = "OpenRouter model-provider extension: the OpenAI-wire router as a ModelClient backend"
requires-python = ">=3.12"
dependencies = ["selfhost", "openai>=1.0"]

[project.entry-points."selfhost.extension"]
openrouter = "selfhost_ext_openrouter:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_openrouter.py"]
