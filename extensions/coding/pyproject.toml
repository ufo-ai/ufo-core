[project]
name = "selfhost-ext-coding"
version = "0.1.0"
description = "Coding subagent pack: the software-engineering subagent profile over the core code builtins"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.extension"]
coding = "selfhost_ext_coding:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_coding.py", "subagent_coding.md"]
