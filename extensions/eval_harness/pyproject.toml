[project]
name = "selfhost-ext-eval-harness"
version = "0.1.0"
description = "Capability-eval harness: run cases through the agent, grade the answer + tool trajectory"
requires-python = ">=3.12"
dependencies = ["selfhost", "anthropic>=0.40"]

[project.entry-points."selfhost.extension"]
eval_harness = "selfhost_ext_eval_harness.manifest:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_eval_harness"]
