[project]
name = "selfhost-ext-turbopuffer"
version = "0.1.0"
description = "Turbopuffer index backend: cosine ANN + BM25 lexical over a per-workspace namespace"
requires-python = ">=3.12"
dependencies = ["selfhost", "httpx>=0.27"]

[project.entry-points."selfhost.extension"]
turbopuffer = "selfhost_ext_turbopuffer:manifest"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_ext_turbopuffer.py"]
