[package]
name = "ufo-preview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ufo-preview"
path = "src/main.rs"

[[bin]]
name = "preview-worker"
path = "src/bin/preview_worker.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
csv = "1"
zip = { version = "2", default-features = false }
libc = "0.2"
tempfile = "3"
url = "2"
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
