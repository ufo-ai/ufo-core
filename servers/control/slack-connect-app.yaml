# Outbound Web API calls only — no event subscriptions, interactivity, redirect URL or inbound endpoint
# — so it needs no client id, client secret, or signing secret. Not the customer-installed Slack app.
display_information:
  name: ufo onboarder
  description: Opens each new customer's shared channel and invites them to it.
features:
  bot_user:
    display_name: ufo onboarder
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:manage
      - channels:read
      - chat:write
      - conversations.connect:manage
      - conversations.connect:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
