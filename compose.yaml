services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: selfhost
      POSTGRES_PASSWORD: selfhost
      POSTGRES_DB: selfhost
    ports:
      - "127.0.0.1:5541:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhost"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
