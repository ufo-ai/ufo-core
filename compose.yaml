
x-dev-env: &dev-env
  UFO_CONTROL_POSTGRES_OWNER_DSN: postgresql://ufo:ufo@postgres:5432/ufo
  UFO_ONBOARD_CONTROL_TOKEN: ufo-local-dev-onboard-token
  UFO_CONTROL_PG_ROLE_SEED: ufo-local-dev
  PG_HOST: postgres:5432
  APP_DB: ufo
  UFO_DEV_PACK: ${UFO_DEV_PACK:-assistant}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ufo
      POSTGRES_PASSWORD: ufo
      POSTGRES_DB: ufo
    ports:
      # Host publish is only for host tooling and tests; override `UFO_PG_PORT` if 5541 is taken by another
      # local Postgres.
      - "127.0.0.1:${UFO_PG_PORT:-5541}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufo"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${UFO_REDIS_PORT:-5543}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  init:
    build: {context: ., dockerfile: dev/Dockerfile}
    image: ${UFO_DEV_IMAGE:-ufo-dev}
    command: ["init"]
    environment:
      <<: *dev-env
      # The same Fernet serve opens: this runs the migrations, and a revision that carries a
      # credential row from one slot to another reads and rewrites the value under this key.
      UFO_CREDENTIAL_KEY: b2Adxpv2mSpXfvoBrALyxxePNw-h7N_1mgxzUFVMMFI=
      UFO_PUBLIC_BASE_URL: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}
      UFO_INGRESS_PUBLIC_URL: http://${UFO_STACK_HOST:-ufo.localhost}:${UFO_INGRESS_PORT_HOST:-8100}
    volumes:
      - ./dev:/app/dev:ro
      - egress-ca:/egress-ca
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  gateway:
    image: ${UFO_DEV_IMAGE:-ufo-dev}
    command: ["gateway"]
    environment:
      <<: *dev-env
      UFO_CONTROL_EMAIL_MODE: console
      UFO_TOKEN_SECRET: ufo-local-dev-token-secret
      # Locally the owner role, for convenience; a deploy hands the gateway the `ufo_control` role, which
      # holds no privilege on any table in `public`. Either way core's tables are reached over the RPC.
      UFO_CONTROL_GATEWAY_DSN: postgresql://ufo:ufo@postgres:5432/ufo
      UFO_CONTROL_SERVE_INTERNAL_URL: http://serve:8710
      UFO_PUBLIC_BASE_URL: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}
      UFO_WORKSPACE_BASE_URL: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}
      # `WORKOS_MODE=console` runs a credential-free dev verifier, so `make stack` needs no WorkOS secret
      # and codes are logged (the dev code is 000000). `workos` plus an API key and client id exercises the real path.
      WORKOS_MODE: ${WORKOS_MODE:-console}
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_REDIRECT_URI: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}/v1/onboard/auth/callback
      UFO_INVITE_REQUIRED: "false"
      UFO_GATEWAY_PORT: "8080"
    volumes:
      - ./dev:/app/dev:ro
    depends_on:
      postgres: {condition: service_healthy}
      init: {condition: service_completed_successfully}
      serve: {condition: service_started}
    restart: unless-stopped

  serve:
    image: ${UFO_DEV_IMAGE:-ufo-dev}
    command: ["serve"]
    environment:
      <<: *dev-env
      UFO_TOKEN_SECRET: ufo-local-dev-token-secret
      UFO_CREDENTIAL_KEY: b2Adxpv2mSpXfvoBrALyxxePNw-h7N_1mgxzUFVMMFI=
      UFO_ARTIFACT_TOKEN_SECRET: ufo-local-dev-artifact-secret
      # The gateway's send seam. Locally the gateway runs in console mode, so a send is logged.
      UFO_CONTROL_EMAIL_URL: http://gateway:8080
      UFO_PUBLIC_BASE_URL: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}
      UFO_INGRESS_PUBLIC_URL: http://${UFO_STACK_HOST:-ufo.localhost}:${UFO_INGRESS_PORT_HOST:-8100}
      AWS_REGION: us-east-1
      UFO_OWNER_DSN: postgresql://ufo:ufo@postgres:5432/ufo
      UFO_ANTHROPIC_API_KEY: ${UFO_ANTHROPIC_API_KEY:-}
      # The base-pinned embed backend reads this on every embed call, so memory indexing and recall raise
      # without it while the rest of the deploy runs.
      UFO_OPENAI_API_KEY: ${UFO_OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Name a recordings file outside the extension package to record what it fetches, because the
      # package's own digest pins the deploy.
      UFO_ENRICHMENT_PROVIDER: ${UFO_ENRICHMENT_PROVIDER:-recorded}
      UFO_ENRICHMENT_RECORDINGS: ${UFO_ENRICHMENT_RECORDINGS:-/app/extensions/enrichment/ufo_ext_enrichment/recordings.json}
      UFO_PEOPLE_DATA_LABS_API_KEY: ${UFO_PEOPLE_DATA_LABS_API_KEY:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      PIPEDREAM_PROJECT_ID: ${PIPEDREAM_PROJECT_ID:-}
      PIPEDREAM_CLIENT_ID: ${PIPEDREAM_CLIENT_ID:-}
      PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET:-}
      PIPEDREAM_GITHUB_OAUTH_APP_ID: ${PIPEDREAM_GITHUB_OAUTH_APP_ID:-}
      # Point these at a Metronome SANDBOX token and a Stripe TEST-MODE key: the flow creates real objects
      # in the accounts they name.
      METRONOME_BEARER_TOKEN: ${METRONOME_BEARER_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${STRIPE_BILLING_PORTAL_CONFIGURATION_ID:-}
    ports:
      - "127.0.0.1:${UFO_SERVE_PORT_HOST:-8710}:8710"
      - "127.0.0.1:${UFO_INGRESS_PORT_HOST:-8100}:8100"
    volumes:
      - ./dev:/app/dev:ro
      - blobs:/data/blobs
      - ${UFO_WORKSPACE_ROOT:-./.local/${COMPOSE_PROJECT_NAME:-ufo}/workspaces}:/data/workspaces
      - egress-ca:/egress-ca:ro
    depends_on:
      postgres: {condition: service_healthy}
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: dev/web.Dockerfile}
    image: ${UFO_DEV_IMAGE:-ufo-dev}-web
    environment:
      UFO_WEB_VITE_CONFIG: ${UFO_WEB_VITE_CONFIG:-sidebar/vite.config.ts}
      UFO_STACK_ORIGIN: http://front:8080
    volumes:
      - ./dev:/app/dev:ro
      - ./assets:/app/assets:ro
      - ./extensions:/app/extensions:ro
      - web-modules:/app/deps/node_modules
      - web-modules:/app/extensions/web/frontend/node_modules
    restart: unless-stopped

  front:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${UFO_STACK_PORT_HOST:-8080}:8080"
    volumes:
      - ./dev/front.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway: {condition: service_started}
      serve: {condition: service_started}
      web: {condition: service_started}
    restart: unless-stopped

  ingress:
    image: ${UFO_DEV_IMAGE:-ufo-dev}
    command: ["ingress"]
    network_mode: "service:serve"
    environment:
      <<: *dev-env
      UFO_TOKEN_SECRET: ufo-local-dev-token-secret
      UFO_PUBLIC_BASE_URL: http://${UFO_STACK_HOST:-localhost}:${UFO_STACK_PORT_HOST:-8080}
      UFO_INGRESS_PUBLIC_URL: http://${UFO_STACK_HOST:-ufo.localhost}:${UFO_INGRESS_PORT_HOST:-8100}
      UFO_OWNER_DSN: postgresql://ufo:ufo@postgres:5432/ufo
    volumes:
      - ./dev:/app/dev:ro
      - blobs:/data/blobs
      - ${UFO_WORKSPACE_ROOT:-./.local/${COMPOSE_PROJECT_NAME:-ufo}/workspaces}:/data/workspaces
    depends_on:
      postgres: {condition: service_healthy}
      init: {condition: service_completed_successfully}
      serve: {condition: service_started}
    restart: unless-stopped

  egress:
    build: {context: ./servers/egress, dockerfile: Dockerfile}
    image: ${UFO_EGRESS_DEV_IMAGE:-ufo-egress-dev}
    network_mode: "service:serve"
    environment:
      UFO_EGRESS_BIND: "0.0.0.0"
      UFO_EGRESS_PORT: "8888"
      UFO_EGRESS_CONTROL_URL: http://127.0.0.1:8710
      UFO_EGRESS_CONTROL_TOKEN: ufo-local-dev-egress-token
      UFO_TOKEN_SECRET: ufo-local-dev-token-secret
      UFO_EGRESS_CA_CERT_FILE: /egress-ca/ca.crt
      UFO_EGRESS_CA_KEY_FILE: /egress-ca/ca.key
    volumes:
      - egress-ca:/egress-ca:ro
    depends_on:
      init: {condition: service_completed_successfully}
      serve: {condition: service_started}
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
  egress-ca:
  web-modules:
