[project]
name = "selfhost"
version = "0.1.0"
description = "An agent runtime a developer can run, read, and extend"
requires-python = ">=3.12"
dependencies = [
    "aiobotocore>=3.7.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "anthropic>=0.40",
    "asyncpg>=0.31.0",
    "click>=8.1",
    "dbos>=2.24",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lz4>=4.3",
    "openai>=1.50",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
selfhost = "selfhost.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfhost"]
