default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: gates
        name: repo gates
        entry: uv run python gates.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy core/src/ufo extensions evals gates.py
        language: system
        types: [python]
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run actionlint -color
        language: system
        files: ^\.github/(workflows/|actionlint\.yaml$)
        pass_filenames: false
      - id: fmt-control
        name: cargo fmt control
        entry: sh -c 'cd control && cargo fmt --check'
        language: system
        files: ^control/
        pass_filenames: false
      - id: clippy-control
        name: cargo clippy control
        entry: sh -c 'cd control && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^control/
        pass_filenames: false
      - id: fmt-preview
        name: cargo fmt preview
        entry: sh -c 'cd preview && cargo fmt --check'
        language: system
        files: ^preview/
        pass_filenames: false
      - id: clippy-preview
        name: cargo clippy preview
        entry: sh -c 'cd preview && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^preview/
        pass_filenames: false
