default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: gates
        name: repo gates
        entry: uv run python gates.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy core/src/ufo extensions evals gates.py
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-control
        name: ruff control
        entry: uv run --project control ruff check control/src control/tests
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy-control
        name: mypy control
        entry: uv run --project control mypy --config-file control/pyproject.toml control/src/ufo_control control/tests
        language: system
        types: [python]
        pass_filenames: false
