default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: complexity
        name: cyclomatic complexity
        entry: uv run ruff check --select C901 .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: gates
        name: repo gates
        entry: uv run python gates.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy core/src/ufo extensions gates.py
        language: system
        types: [python]
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: uv run actionlint -color
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
      - id: fmt-preview
        name: cargo fmt preview
        entry: sh -c 'cd servers/preview && cargo fmt --check'
        language: system
        files: ^servers/preview/
        pass_filenames: false
      - id: fmt-client
        name: cargo fmt client
        entry: sh -c 'cd client && cargo fmt --check'
        language: system
        files: ^client/
        pass_filenames: false
      - id: fmt-cache
        name: cargo fmt cache
        entry: sh -c 'cd servers/cache && cargo fmt --check'
        language: system
        files: ^servers/cache/
        pass_filenames: false
      - id: fmt-egress
        name: cargo fmt egress
        entry: sh -c 'cd servers/egress && cargo fmt --check'
        language: system
        files: ^servers/egress/
        pass_filenames: false
      - id: clippy-preview
        name: cargo clippy preview
        entry: sh -c 'cd servers/preview && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^servers/preview/
        pass_filenames: false
