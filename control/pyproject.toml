[project]
name = "ufo-control"
version = "0.1.0"
description = "The Kubernetes control plane that runs ufo as its per-workspace backend runtime"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "click>=8.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-exporter-otlp-proto-http>=1.43",
    "opentelemetry-instrumentation-logging>=0.64b0",
    "opentelemetry-sdk>=1.43",
    "pydantic>=2.9",
    "tomli-w>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
ufo-control = "ufo_control.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufo_control"]

# The POSIX `ufo` client the gateway role serves at GET /ufo — a non-Python data file, force-included
# so it ships in the wheel where `gateway.py` resolves it by `Path(__file__).parent`.
[tool.hatch.build.targets.wheel.force-include]
"src/ufo_control/client/ufo" = "ufo_control/client/ufo"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "PTH", "RUF", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["ufo_control"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests" = { msg = "sync HTTP client blocks the loop; use httpx.AsyncClient" }

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/ufo_control", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

# The runtime `ufo` package ships no py.typed marker; follow into its source so control checks
# against the real DeployRequest/DeployStatus shapes it imports (RFC 0011 §1: one definition).
[[tool.mypy.overrides]]
module = ["ufo.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "cluster: needs a live Kubernetes cluster (kubectl/helm apply) — skipped without one",
]
