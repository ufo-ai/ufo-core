# Default-deny ingress across the tenant namespace, then narrowly re-open ingress to the serve pods
# on the serve port (the ingress controller reaches them through the Service). Egress is left open:
# the whole-`serve` runtime must reach the model API, OAuth, S3, Postgres and Redis directly; a
# sandbox's own egress is confined by the shared egress proxy (ufo-system), not this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-serve-ingress
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ufo-serve
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.serve_port }}
