apiVersion: v1
kind: Service
metadata:
  name: ufo-serve
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
spec:
  selector:
    app: ufo-serve
  ports:
    - name: http
      port: {{ .Values.serve_port }}
      targetPort: http
{{- if .Values.sandbox_proxy_hostname }}
---
# The sandbox egress proxy, exposed off-cluster: an e2b sandbox runs outside the cluster and dials
# the in-pod proxy (on the serve pod, the same pod as serve_port) at sandbox_proxy_hostname to reach
# its metered, credential-injecting, default-deny egress route. Internet-facing and DNS-only
# (grey-cloud): a raw TCP CONNECT proxy that Cloudflare's HTTP proxy cannot front, and e2b connects
# from its own IPs (not Cloudflare's), so the LoadBalancer is not source-restricted — public
# reachability is bounded entirely by the proxy's own authorization (every request carries a run
# token that must resolve to a running turn; an unauthorized or keyed-host CONNECT is refused).
apiVersion: v1
kind: Service
metadata:
  name: ufo-sandbox-proxy
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.sandbox_proxy_hostname | quote }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: ufo-serve
  ports:
    - name: proxy
      port: {{ .Values.proxy_port }}
      targetPort: proxy
{{- end }}
