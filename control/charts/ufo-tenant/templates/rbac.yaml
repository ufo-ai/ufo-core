apiVersion: v1
kind: ServiceAccount
metadata:
  name: ufo-serve
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
---
# The sandbox-manager Role — verbs copied verbatim from metalcraft's `metalcraft-sandbox-manager`.
# It authorizes the pod carrier (RFC 0003 §3.1, shipped as extension P2.b) to drive per-conversation
# sandbox pods: a StatefulSet+PVC+Service+NetworkPolicy named by conversation, and pods/exec into it.
# Bound now so the carrier works the moment `[sandbox] backend = "pod"` is bundled; harmless until then.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ufo-sandbox-manager
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ufo-sandbox-manager
  labels:
    {{- include "ufo-tenant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ufo-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: ufo-serve
