# Tenant-specific values (overridden per deploy by the reconciler's rendered values file). The
# reconciler passes exactly the flat keys below that mirror ufo_control.render.TenantChartValues;
# everything under `serve`, `hpa`, `quota`, `limitRange` keeps these chart defaults.

namespace: ""
tenant_name: ""
pack: ""
host: ""
owner_email: ""

# Digest-pinned images (repository@sha256:...). bundle_image runs `ufoctl serve`; sandbox_image is
# the pod carrier's sandbox (used once the pod carrier extension — P2.b — is bundled).
bundle_image: ""
sandbox_image: ""

serve_port: 8710

# The per-tenant Secret (config + minted keys) the control plane applies out of band, and the
# cluster Secret carrying model + cloud credentials. Referenced by name only — no secret in values.
tenant_secret: ufo-tenant
platform_secret: ufo-platform-secrets

# Ingress / TLS (RFC 0004 decision 6: cert-manager + ExternalDNS).
ingress_class: nginx
cluster_issuer: letsencrypt
tls_secret: ufo-tenant-tls

# --- chart defaults (not per-tenant) ---

replicas: 2

# Whole-`serve` (all four roles in one process) per RFC 0003 decision 8 — per-role autoscaled
# Deployments wait on core's `serve --role` selector knob, which is not built yet.
serve:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Faithful to metalcraft's gateway HPA (2→10 @ 70% CPU).
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70

quota:
  requestsCpu: "8"
  requestsMemory: 24Gi
  requestsStorage: 200Gi
  pods: "100"

limitRange:
  default:
    cpu: "1"
    memory: 1Gi
  defaultRequest:
    cpu: 100m
    memory: 256Mi
