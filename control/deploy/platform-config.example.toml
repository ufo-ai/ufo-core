# The control plane's own config (PlatformConfig) — mounted at /config/platform.toml via the
# ufo-control-platform ConfigMap. Distinct from a tenant's ufo.toml: this names the shared
# backing services and cluster facts the reconciler overlays onto every tenant's core config.
#
# Secrets are NOT here — the Postgres admin DSN and the role-derivation seed come from the
# ufo-control-secrets Secret (see deploy/control-plane.yaml), referenced by env.

chart_path = "/charts/ufo-tenant"
registry = "ghcr.io/metalcraftai"

# Shared Postgres. postgres_model picks the tenant tier server-side (overrides DeployRequest.postgres):
#   rls (default) — one shared app_database, each tenant an RLS-subject role scoped by workspace_id,
#                   plus a private ufo_dbos_<name>; policies bootstrapped by the migrate Job.
#   database      — a whole database per tenant (hard isolation, self-host tier).
# The reconciler provisions roles/databases from the admin DSN (UFO_CONTROL_POSTGRES_ADMIN_DSN);
# each tenant dials Postgres at tenant_postgres_host.
postgres_model = "rls"
tenant_postgres_host = "postgres.ufo-system.svc:5432"
app_database = "ufo"

# Shared Redis (lifts core's multi-instance boot guard; core keys by workspace_id).
redis_url = "redis://redis.ufo-system.svc:6379"

# Shared S3 bucket for tenant blobs (core isolates by workspace_id key prefixes).
blob_bucket = "ufo-tenants"
blob_region = "us-east-1"
blob_sts_role_arn = "arn:aws:iam::000000000000:role/ufo-sandbox-fs"

# Ingress / TLS (RFC 0004 decision 6).
ingress_class = "nginx"
cluster_issuer = "letsencrypt"

# The Secret carrying model API keys + cloud credentials a tenant's serve reads from env. Created
# once in ufo-system (see deploy/control-plane.yaml); the operator replicates it into each
# tenant namespace during provisioning.
platform_secret = "ufo-platform-secrets"

reconcile_interval_seconds = 15
