# The control plane's own install: the ufo-system namespace, the operator ServiceAccount + a
# broad ClusterRole (it manages tenant namespaces and every resource the tenant chart applies via
# helm), the deploy API Deployment/Service, and the leader-elected operator Deployment.
#
# Apply after deploy/crds/tenant.yaml. Set the image, the platform ConfigMap, the
# ufo-control-secrets Secret (Postgres admin DSN + role seed; owner DSN under postgres-owner-dsn
# for the migrate Job's RLS bootstrap, deploy/migrate-job.yaml), and the ufo-platform-secrets
# Secret (model API keys + cloud credentials the tenant pods read from env — the operator replicates
# it from this namespace into each tenant namespace during provisioning) for your cluster first.
apiVersion: v1
kind: Namespace
metadata:
  name: ufo-system
  labels:
    app.kubernetes.io/managed-by: ufo-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ufo-operator
  namespace: ufo-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ufo-operator
rules:
  # The Tenant kind + its status.
  - apiGroups: [flyingobject.ai]
    resources: [tenants]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [flyingobject.ai]
    resources: [tenants/status]
    verbs: [get, update, patch]
  # Tenant namespaces and the per-tenant Secret (config + minted keys).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, update, patch]
  - apiGroups: [""]
    resources: [secrets, services, serviceaccounts, resourcequotas, limitranges, configmaps]
    verbs: [get, list, create, update, patch, delete]
  # The tenant workload the chart applies via helm. statefulsets/watch is here (not just for the
  # workload) because the sandbox-manager Role grants it and the operator must hold every verb it
  # grants (RBAC escalation guard).
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  # The sandbox-manager Role (charts/ufo-tenant/templates/rbac.yaml) grants the pod carrier
  # pods, pods/exec, and PVCs; K8s escalation-prevention rejects Role creation unless the operator
  # already holds every verb the Role grants. (services/networkpolicies/statefulsets are covered by
  # the rules above; these three are added here to complete the set.)
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
  # The operator creates the sandbox-manager Role + RoleBinding in each tenant namespace.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ufo-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ufo-operator
subjects:
  - kind: ServiceAccount
    name: ufo-operator
    namespace: ufo-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufo-api
  namespace: ufo-system
  labels: {app: ufo-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ufo-api}
  template:
    metadata:
      labels: {app: ufo-api}
    spec:
      serviceAccountName: ufo-operator
      containers:
        - name: api
          image: ghcr.io/metalcraftai/ufo-control:latest
          args: [api]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: ufo-api
  namespace: ufo-system
spec:
  selector: {app: ufo-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufo-operator
  namespace: ufo-system
  labels: {app: ufo-operator}
spec:
  # One replica + Recreate is the mutual-exclusion guarantee; the Lease coordinates the rollout gap.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ufo-operator}
  template:
    metadata:
      labels: {app: ufo-operator}
    spec:
      serviceAccountName: ufo-operator
      containers:
        - name: operator
          image: ghcr.io/metalcraftai/ufo-control:latest
          args: [operator]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: UFO_CONTROL_CONFIG
              value: /config/platform.toml
            - name: UFO_CONTROL_POSTGRES_ADMIN_DSN
              valueFrom:
                secretKeyRef: {name: ufo-control-secrets, key: postgres-admin-dsn}
            - name: UFO_CONTROL_PG_ROLE_SEED
              valueFrom:
                secretKeyRef: {name: ufo-control-secrets, key: pg-role-seed}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: config, mountPath: /config}
      volumes:
        - name: config
          configMap: {name: ufo-control-platform}
