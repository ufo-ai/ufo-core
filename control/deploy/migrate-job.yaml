# The cluster-scoped, run-once-per-rollout schema Job for the rls tier (RFC 0011 §2). The tenants
# share one application database (`ufo`), so migrations run ONCE here as the owner — not per tenant.
# `ufoctl migrate` (bundle image) brings the shared schema to head as `ufo_owner` (tables are
# owned by the owner, which bypasses RLS by design); then `ufo-control rls-bootstrap` (control
# image) enables RLS and (re)creates the workspace policies as the same owner — the enforcement
# gate that makes the shared database present each tenant a single-workspace view.
#
# Apply after a new bundle/control image is pushed and before opening traffic. The per-tenant init
# Job still runs `ufoctl init`, which at head is a no-op needing only SELECT on alembic_version.
#
# Ops provides, in ufo-system, before applying:
#   - Secret `ufo-migrate-config`, key `ufo.toml`: `[database] url` = the owner's +asyncpg DSN to
#     the shared app db, `[pack] name = "assistant_hosted"`.
#   - Secret `ufo-control-secrets`, key `postgres-owner-dsn`: the owner's libpq DSN to the same db.
apiVersion: batch/v1
kind: Job
metadata:
  name: ufo-migrate
  namespace: ufo-system
  labels: {app: ufo-migrate}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app: ufo-migrate}
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: migrate
          image: ghcr.io/metalcraftai/ufo:latest
          args: [migrate]
          env:
            - name: UFO_CONFIG
              value: /config/ufo.toml
          volumeMounts:
            - {name: config, mountPath: /config}
      containers:
        - name: rls-bootstrap
          image: ghcr.io/metalcraftai/ufo-control:latest
          args: [rls-bootstrap]
          env:
            - name: UFO_CONTROL_POSTGRES_OWNER_DSN
              valueFrom:
                secretKeyRef: {name: ufo-control-secrets, key: postgres-owner-dsn}
      volumes:
        - name: config
          secret:
            secretName: ufo-migrate-config
            items:
              - {key: ufo.toml, path: ufo.toml}
