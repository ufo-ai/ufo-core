# The one custom resource this control plane owns. metalcraft projected seven product CRDs
# (Store/Source/Tool/Agent/Channel/SpendPolicy/Refinement) from pydantic; those are gone — core's DB
# schema is the store (RFC 0003 §2). What remains is a Tenant: one whole ufo workspace in
# its own namespace. Its .spec is the deploy-request contract (ufo.deploy.DeployRequest)
# verbatim; the operator reconciles it and server-side-applies .status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.flyingobject.ai
spec:
  group: flyingobject.ai
  scope: Namespaced
  names:
    kind: Tenant
    plural: tenants
    singular: tenant
    shortNames: [tn]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Host
          type: string
          jsonPath: .spec.tenant.host
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenant, bundle_image, config_toml, pack]
              properties:
                tenant:
                  type: object
                  required: [name, host, owner_email]
                  properties:
                    name: {type: string}
                    host: {type: string}
                    owner_email: {type: string}
                bundle_image:
                  type: object
                  required: [repository, digest]
                  properties:
                    repository: {type: string}
                    digest: {type: string}
                sandbox_image:
                  type: object
                  required: [repository, digest]
                  properties:
                    repository: {type: string}
                    digest: {type: string}
                config_toml: {type: string}
                pack: {type: string}
                postgres:
                  type: string
                  enum: [database, rls]
                  default: database
                secrets:
                  type: object
                  properties:
                    minted:
                      type: array
                      items: {type: string}
                    platform:
                      type: array
                      items: {type: string}
            status:
              type: object
              properties:
                tenant: {type: string}
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Failed]
                url: {type: string}
                message: {type: string}
                # The control-plane-minted workspace uuid. Set on the first reconcile and reused
                # on every later one (idempotency): the RLS GUC pin and `init --workspace-id`.
                workspaceId: {type: string}
