<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Canela'; font-style: normal; font-weight: 300;
    src: url('fonts/Canela-normal-300.woff2') format('woff2'); }
  @font-face { font-family: 'Canela'; font-style: italic; font-weight: 300;
    src: url('fonts/Canela-italic-300.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500;
    src: url('fonts/Inter-normal-500.woff2') format('woff2'); }

  :root {
    --void-900: #0D1418;
    --signal-400: #4F97C7;
    --sand-25: #FFFAEF;
    --sand-50: #F3ECDE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body { background: var(--void-900); overflow: hidden; }

  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }

  /* The artboard framing the landing page uses: a square image in a wide
     window, the figures held low so the sky stays open for the headline. */
  .art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 18%;
  }
  /* Scrim: darkens the sky the headline sits on, leaves the figures lit. */
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(13,20,24,0.94) 0%, rgba(13,20,24,0.72) 42%, rgba(13,20,24,0.10) 72%, rgba(13,20,24,0) 100%);
  }

  .lockup {
    position: absolute; top: 52px; left: 64px;
    display: flex; align-items: center; gap: 14px;
  }
  .lockup svg { width: 34px; height: 34px; display: block; }
  .lockup .word {
    font-family: 'Canela', Georgia, serif; font-weight: 300;
    font-size: 38px; line-height: 1; color: var(--sand-25);
    letter-spacing: 0.02em;
  }

  .headline {
    position: absolute; left: 64px; right: 64px; top: 196px;
    font-family: 'Canela', Georgia, serif; font-weight: 300;
    font-size: 132px; line-height: 1.02; color: var(--sand-50);
    text-align: center; white-space: nowrap;
  }
  .headline .lead { color: var(--signal-400); }
  .headline em { font-style: italic; }

  /* --- sites variant ---------------------------------------------------- */
  body.sites .headline { top: 214px; font-size: 108px; }
</style>
</head>
<body class="VARIANT">
  <div class="card">
    <img class="art" src="hero.png" alt="">
    <div class="scrim"></div>
    <div class="lockup">MARK<span class="word">UFO</span></div>
    <div class="headline">HEADLINE</div>
  </div>
</body>
</html>
