[project]
name = "selfhost-pack-sample"
version = "0.1.0"
description = "Conformance sample pack: the probe that pins the packs seam — bundles the sample extension plus a pack-level skill and onboarding step"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.pack"]
sample_pack = "selfhost_pack_sample:pack"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_pack_sample.py", "skills"]
