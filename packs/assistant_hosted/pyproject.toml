[project]
name = "selfhost-pack-assistant-hosted"
version = "0.1.0"
description = "Hosted assistant pack: the assistant bundle backed by managed infra — Turbopuffer index, Slack surface, Redis live-frame hub, and the E2B sandbox carrier"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.pack"]
assistant_hosted = "selfhost_pack_assistant_hosted:pack"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_pack_assistant_hosted.py"]
