[project]
name = "selfhost-pack-assistant"
version = "0.1.0"
description = "Assistant pack: a full self-contained assistant (memory over the local index, research, connectors, browser, sites, repl, documents, todos, scheduled tasks, web surface, coding) on core's own carrier — no managed infra"
requires-python = ">=3.12"
dependencies = ["selfhost"]

[project.entry-points."selfhost.pack"]
assistant = "selfhost_pack_assistant:pack"

[tool.uv.sources]
selfhost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["selfhost_pack_assistant.py"]
