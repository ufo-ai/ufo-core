name = "app-builder-blocks-recipes"
base = "HEAD"
suites = ["ufo-app-bench"]
cases = ["pre-meeting-briefs", "issue-planner", "engineering-metrics", "code-review-queue"]
repeats = 1
concurrency = 2
max_stacks = 1
budget_usd = 45.0
est_usd_per_case = 3.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

[[arm]]
name = "no-recipes"
[arm.files]
"extensions/sites/ufo_ext_sites/skills/application-homepage/SKILL.md" = "arms/no-recipes-application-homepage.md"
