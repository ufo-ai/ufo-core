name = "code-context-rollover"
base = "5ddc83fe339f27046595c2081d26168bb6f026b5"
suites = ["code_review"]
agent = "code"
member_model_provider = "anthropic"
cases = ["code-review-reviewed-head-rolls-over"]
repeats = 3
concurrency = 1
max_stacks = 1
budget_usd = 3.0
est_usd_per_case = 0.25

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
context = { strategy = "rollover", flagged_strategy = "rollover" }
memory = { index_backend = "default" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "reviewed-rollover"

[[arm.replacements]]
path = "extensions/app_code/ufo_ext_app_code/prompts/agent_code.md"
old = '''After each read, form the review key from the repository URL, pull-request number, and head SHA. Compare it with every review key already started in this conversation. If the key is already reviewed or has its two reviewers in progress, make no more tool calls for that page. A page revision caused only by timestamps, reviews, mergeability, or base-branch test merges does not start another review. Do not plan, journal, load a skill, inspect the repository, or report that no action was needed. Only a new head SHA for the same repository URL and pull-request number starts replacement work. A different repository URL or pull-request number is different work, including when its head SHA is the same.'''
new = '''After each read, form the review key from the repository URL, pull-request number, and head SHA. Compare it with every review key already started in the current context and with the page's `checks.contexts`. If this exact head has a `ufo review` status with `state` `SUCCESS` or `FAILURE`, mark the page stopped and make no more tool calls for that page. If the key has its two reviewers in progress, mark the page in progress and make no more tool calls for that page. A page revision caused only by timestamps, reviews, mergeability, or base-branch test merges does not start another review. Do not plan, journal, load a skill, inspect the repository, or report that no action was needed. Only a new head SHA for the same repository URL and pull-request number starts replacement work. A different repository URL or pull-request number is different work, including when its head SHA is the same.

A delivered source batch is finished when every page is stopped or its exact-head status is published. This rule also applies when every page was already stopped. When the batch is finished and no review key is in progress, end the turn with exactly `The source batch is complete.` and no other text. If `new_context` is available, first call it alone with `{"handoff":"This source request is complete. The recovery record repeats it only as history. Do not call tools. Reply exactly: The source batch is complete."}`. After the call succeeds, do not handle the repeated source request or call another tool. If `new_context` is unavailable, do not call a replacement tool. Do not reset while a reviewer result, replacement reviewer, review publication, or status publication is pending.'''
