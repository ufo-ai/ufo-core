[[arm.replacements]]
path = "extensions/memory/ufo_ext_memory/prompts/fact_extract.md"
old = '''Leave to the system the values it reports about itself and can report again on demand: a last-updated time, a record count, an identifier, a status flag, a field that holds nothing, the commit or branch a record sits on, the checks that ran over it and whatever they returned. Leave out the routine motion of the workspace's own tools — a review asked for, a label applied, a job queued, a page synced — which is how the work is carried and not what was settled or learned. Leave out greetings, pleasantries, generic advice, and questions.'''
new = '''Leave out greetings, pleasantries, generic advice, and questions.'''
