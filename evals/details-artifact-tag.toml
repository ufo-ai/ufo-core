name = "details-artifact-tag"
base = "HEAD"
suites = ["response_register"]
cases = [
  "report-workspace-path-is-not-a-link",
  "report-summary-request-shares-nothing",
  "report-research-skill-carries-the-tag",
  "report-tradeoff-analysis",
  "report-file-asked-for-up-front",
  "report-then-file-requested",
  "dispute-evidence-requested",
]
repeats = 3
concurrency = 4
max_stacks = 1
budget_usd = 40.0
est_usd_per_case = 0.35

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "previous-carrier"

[[arm.replacements]]
path = "core/src/ufo/runtime/turns/delivery_register.md"
old = '''When detail crosses the chosen register's inline boundary, put it in one artifact and never
duplicate its body inline. For a member, the artifact is a Markdown file in /workspace — one you
wrote, or one a subagent wrote in your sandbox — carried by a tag at the end of the closing message,
under the file's own name. The tag's text is the link the member clicks: for a report, Open detailed
report; never the file's name.

<artifact path="/workspace/nightly-runner-queue.md" text="Open detailed report"/>

The member's surface offers the file as a download beside the reply, so the reply says nothing about
where the write-up is or that it can be sent, and never names a /workspace path, as text or as a
link. Reuse the name for a later revision. Only a successful share_file result supplies a member
link; share a file with share_file only when the member's ask carries one of these triggers:
- they asked for a file, a document, or a format;
- they asked for a copy of the write-up, or a new revision of a file you already shared.
No other ask is a trigger. The trigger is what the member asked for, never the verb that carries
it. "send", "send me", "give me", "show me", "write up", and "put together" name the delivery and
not the file: answer "send me a summary" or "give me the comparison" inline with the write-up in
its tag. "send me the file" and "send me that as a file" each carry a trigger from the list. When
you do share one, reuse its name for later revisions. Between agents that share /workspace, save
the artifact there and name its absolute path without share_file and without the tag.'''
new = '''When detail crosses the chosen register's inline boundary, put it in one artifact, name the
artifact in the inline delivery, and never duplicate its body inline. Write that artifact to
/workspace and say in the inline delivery that the fuller write-up is there and can be sent. Never
put a /workspace path in a member reply, as text or as a link. Name an unshared artifact by its file
name in plain text. Only a successful share_file result supplies a member link. Share it with
share_file only when the member's ask carries one of these triggers:
- they asked for a file, a document, or a format;
- they asked for the artifact itself, a copy of it, or a new revision of one you already shared;
- they asked for proof, evidence, or a fuller explanation the artifact answers.
No other ask is a trigger. The trigger is what the member asked for, never the verb that carries
it. "send", "send me", "give me", "show me", "write up", and "put together" name the delivery and
not the file: answer "send me a summary" or "give me the comparison" inline and leave the write-up
unshared. "send me the file" and "show me the evidence" each carry a trigger from the list. When
you do share one, reuse its name for later revisions. Between agents that share /workspace, save it
there and name its absolute path without share_file.'''

[[arm.replacements]]
path = "extensions/research/ufo_ext_research/skills/research-report/SKILL.md"
old = '''### Where the report goes

**Write the report to `/workspace/<topic>.md` and carry it in the closing message as
`<artifact path="/workspace/<topic>.md" text="Open detailed report"/>`; as a subagent, name that
path in your result instead.
Share it with `share_file` only when the user asked for a file, a document, or a format.**

- Derive the filename from the query topic: `<topic>.md`
- Use lowercase kebab-case for filenames
- The chat response carries a brief summary — the full report lives in the file
- When a file is asked for, share it so the user can view the rendered report
'''
new = '''### Where the report goes

**Always write the report to a file with a `.md` extension. Share that file only when the user asked
for a file or a format, or when they ask for proof, evidence, or a fuller explanation.**

- Derive the filename from the query topic: `<topic>.md`
- Use lowercase kebab-case for filenames
- Write the file to the workspace directory using the file writing tool
- Do not share the file by default — tell the user the full write-up is written and can be sent
- When a file is asked for, share it so the user can view the rendered report
- The chat response should contain a brief summary — the full report lives in the `.md` file
'''

[[arm.replacements]]
path = "extensions/research/ufo_ext_research/skills/research-report/SKILL.md"
old = '''- [ ] Report written to `/workspace/<topic>.md`, carried in the closing message's
      `<artifact path="…"/>` tag, and shared only when the user asked for a file, a document, or
      a format
'''
new = '''- [ ] Report written to a `<topic>.md` file, named in the chat response, and shared only when the
      user asked for a file or asked for proof or a fuller explanation
'''

