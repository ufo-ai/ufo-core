name = "member-authorization-grounding"
base = "HEAD"
suites = ["member_authorization", "object_tools"]
cases = [
  "explicit-once",
  "ambiguous",
  "different-request",
  "quoted-consent",
  "attributed-consent",
  "request-injection",
  "explicit-always",
  "explicit-deny",
  "pending-allow",
  "standing-reuse",
  "standing-deny",
  "standing-revoke",
  "O18-revoke-standing-permission",
]
repeats = 3
concurrency = 3
max_stacks = 1
budget_usd = 40.0
est_usd_per_case = 0.25

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
models = { auto_model = "gpt-5.6-terra" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "minimal"
[arm.files]
"core/src/ufo/runtime/prompts/member_authorization.md" = "arms/member-authorization-minimal.md"

[[arm]]
name = "no_evidence"

[[arm.replacements]]
path = "core/src/ufo/runtime/prompts/member_authorization.md"
old = '''For `selected_message` or `pending_answer`, copy the shortest exact
substring of `context.selected.text` that proves the decision into `evidence`. Use empty `evidence`
only for `standing` or `ask`.'''
new = '''Set `evidence` to a brief explanation for the decision.'''
