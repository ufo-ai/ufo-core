name = "app-homepage-repair-traps"
base = "HEAD"
suites = ["ufo-app-bench"]
cases = ["kanban-board", "call-notes", "daily-brief"]
repeats = 2
concurrency = 2
max_stacks = 2
budget_usd = 60.0
est_usd_per_case = 3.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

# Four traps, each taken from a refusal that cost a deploy in the 2026-09-07 run: kanban-board
# spent 9 deploys and call-notes 13, against `MAX_PRODUCT_QA_CALLS` of 3. Seven of call-notes'
# thirteen went on `lacks visible <region>` after it put four regions behind tabs; one deploy per
# case went on a page that never mounted, reaching for `.map` on absent data; several on a 361 px
# document where a flex child wanted `min-w-0`.
#
# The arm drops all four. Read it on `processQa`, which is the deploy count, and on `processBuilder`
# and the app scores beside it: if the traps are load-bearing the arm deploys more and the control
# passes more, and if the counts sit together the strings are context the child was not short of.
#
# Rules the skill already stated and the child broke anyway — `gap-xs`, `max-w-[140px]` — are
# deliberately not in this change. Those are compliance, and no arm here would measure them.
[[arm]]
name = "no-repair-traps"

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/skills/application-homepage/SKILL.md"
old = """- Write the page for a member who has nothing in it yet, because that is the state it is measured
  in. Every region draws its own container and a line saying it is empty, never nothing at all, and
  every read that can be absent is guarded before you reach through it. A region that renders
  nothing is measured as missing however carefully its slug is marked, and a read through data that
  is not there throws before the page mounts. Two recorded builds lost six deploys to `lacks
  visible <region>` and two more to `the page never mounted`.
- A flex row holding text needs `min-w-0` on the child that holds it. Without it the text refuses
  to shrink and the deploy answers `document is 361px` at a 360 px lane, or names the label it
  clipped.
- A `Stat` carries no border. It is already a tile; a figure divides by the space around it."""
new = ""
