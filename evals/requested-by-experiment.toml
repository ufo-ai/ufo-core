name = "requested-by-hint"
base = "HEAD"
suites = ["object_tools", "new_application"]
cases = ["O11-archive-in-a-shared-conversation", "A02-stated-up-front"]
repeats = 4
concurrency = 2
max_stacks = 1
budget_usd = 60.0
est_usd_per_case = 1.20

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
research = { search_provider = "perplexity" }

[[arm]]
name = "no-hint"

[[arm.replacements]]
path = "core/src/ufo/runtime/engine.py"
old = """REQUESTED_BY_HINT = (
    " Set requested_by to the message_ref of the member who asked; active member messages: {refs}."
)"""
new = """REQUESTED_BY_HINT = ""
"""

[[arm]]
name = "offer-ref-always"

[[arm.replacements]]
path = "core/src/ufo/runtime/engine.py"
old = """        if self._own_member(requesters) is not None:
            return ()
        return tuple(ref for ref, message in requesters.items() if message.member_id is not None)"""
new = """        return tuple(ref for ref, message in requesters.items() if message.member_id is not None)"""

[[arm]]
name = "no-own-binding"

[[arm.replacements]]
path = "core/src/ufo/runtime/engine.py"
old = """        elif (member := self._own_member(requesters)) is not None:
            requester = member
"""
new = ""

[[arm.replacements]]
path = "core/src/ufo/runtime/engine.py"
old = """        if self._own_member(requesters) is not None:
            return ()
        return tuple(ref for ref, message in requesters.items() if message.member_id is not None)"""
new = """        return tuple(ref for ref, message in requesters.items() if message.member_id is not None)"""
