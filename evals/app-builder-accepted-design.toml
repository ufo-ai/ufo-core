# Does telling the worker the design is settled change the page it builds?
#
# The worker's prompt is read on a journey case and nowhere else — the create cases never reach it —
# so this is a separate experiment from the skill's clauses, on the two journeys that run a build,
# at a build's cost. `base = "HEAD"` again holds the grader still: this branch reads the regions off
# the worker's own design call and refuses one that drops what the member accepted.
#
# One arm, because there is one paragraph. Its control is the same prompt with the paragraph in.
name = "app-builder-accepted-design"
base = "HEAD"
suites = ["new_application"]
cases = ["A07-named-homepage-journey", "A08-guided-homepage-journey"]
repeats = 1
concurrency = 2
max_stacks = 2
budget_usd = 80.0
est_usd_per_case = 18.00

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
# The pack installs `research`, whose seam serve refuses to start without a provider.
research = { search_provider = "perplexity" }

# The accepted design goes back to being one input among the application instructions, with no
# sentence saying it is settled and no instruction to mark one region per accepted region. The
# worker still writes a design contract; the question is whether it writes the member's.
[[arm]]
name = "no-accepted-binding"

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/prompts/subagent_ufo_application_builder.md"
old = '''The `Homepage design` in the application instructions is settled: the member was shown that design
and accepted it. Its regions, its first-screen priority, and its layout are the contract you
implement, not a starting point you revise.

Before source work, call `write_application_design` once with one complete SVG of the first laptop
screen. Use the real facts, information order, component shapes, labels, and action placement you
will implement. Mark one region per accepted region, in the accepted display order, with unique
`data-app-region` values on SVG `<g>` elements — 2–6 of them, major and non-overlapping. Where the
instructions carry no accepted design, the regions are yours to settle. Use the same values on the
semantic app containers that implement those regions.'''
new = '''Before source work, call `write_application_design` once with one complete SVG of the first laptop
screen. Use the real facts, information order, component shapes, labels, and action placement you
will implement. Mark 2–6 major, non-overlapping semantic regions with unique `data-app-region`
values on SVG `<g>` elements. Use the same values on the semantic app containers that implement
those regions.'''
