name = "app-design-kit-component"
base = "HEAD"
suites = ["ufo-app-bench"]
cases = ["kanban-board", "call-notes", "daily-brief"]
repeats = 1
concurrency = 3
max_stacks = 2
budget_usd = 40.0
est_usd_per_case = 3.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

# Whether naming a kit component in the wireframe is load-bearing. Its enforcement needs a 90-name
# list copied out of the kit, and the deploy gate's "renders at least one kit component" plus the
# visual judge already cover the intent — so the arm drops the annotation from the design contract
# and the validator that reads it. Scored on the visual-taste and source criteria: if they hold,
# §3's cut lands; if they move, the list is generated from the kit at build time instead.
[[arm]]
name = "no-kit-annotations"

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/skills/application-homepage/SKILL.md"
old = '''  across y=844. One carries `data-kit-component="ComponentName"` naming a visual `ufo/kit` export.'''
new = '''  across y=844.'''

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/application_audit.py"
old = '''    if not kit_components:
        raise ValueError(
            "application design requires data-kit-component on at least one SVG g element"
        )'''
new = ""

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/application_audit.py"
old = '''    if design is not None:
        _validate_designed_components(rendered_kit_components, design.kit_components)
        _validate_designed_regions(source, design.regions)'''
new = '''    if design is not None:
        _validate_designed_regions(source, design.regions)'''
