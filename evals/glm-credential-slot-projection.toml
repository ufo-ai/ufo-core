name = "glm-credential-slot-projection"
base = "e7a7e719ab496d13bd9da85416b6fc1639f5cc43"
suites = ["credential_handoff"]
cases = [
  "member-offers-to-paste",
  "byok-server-token",
  "secret-already-pasted",
  "keyed-provider-api-key",
  "oauth-brokered-provider",
  "no-secret-in-the-question",
]
repeats = 5
concurrency = 5
max_stacks = 2
budget_usd = 30.0
est_usd_per_case = 0.50
model = "z-ai/glm-5.3-flash"
reasoning = "medium"

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "slot-projection"

[[arm.replacements]]
path = "core/src/ufo/host/kinds/credential_kind.py"
old = '''                fields={"extension": slot.extension, "filled": slot.name in filled},
'''
new = '''                fields={
                    "slot": slot.name,
                    "extension": slot.extension,
                    "filled": slot.name in filled,
                },
'''

[[arm.replacements]]
path = "core/src/ufo/host/ext/loader.py"
old = '''        list_fields=frozenset({"extension", "filled"}),
'''
new = '''        list_fields=frozenset({"slot", "extension", "filled"}),
'''
