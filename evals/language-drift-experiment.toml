name = "language-drift"
base = "HEAD"
suites = ["language_drift"]
cases = [
  "drift-after-mandarin-round",
  "drift-under-repeated-fires",
  "drift-after-mandarin-tool-result",
  "mandarin-member-message",
  "mandarin-translation-request",
]
repeats = 4
concurrency = 2
max_stacks = 1
budget_usd = 20.0
model = "z-ai/glm-5.3-flash"
reasoning = "medium"
est_usd_per_case = 0.10

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
browser = { cdp_provider = "browserbase" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "turbopuffer" }
models = { auto_model = "gpt-5.4-mini" }
pack = { name = "assistant_hosted" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "english-lock"

[[arm.replacements]]
path = "core/src/ufo/runtime/prompts/shell.md"
old = '''- Answer in the user's language — in the conversation and in every artifact you produce.
'''
new = '''- Language: English. Write every reply in English. A member who writes "这个文件在哪里？" gets "The report is at /workspace/report.md." A member who writes "帮我订个会议室" gets "The room is booked for Thursday." Read your draft before you send it: if any part of it is not English, rewrite that part in English. Translating is the one exception, and only the translated text itself: a member who asks for text in another language gets exactly that text.
'''

[[arm]]
name = "pr2836"

[[arm.replacements]]
path = "core/src/ufo/runtime/prompts/shell.md"
old = '''- Answer in the user's language — in the conversation and in every artifact you produce.
'''
new = '''- Write final replies and every artifact you produce in English.
'''

[[arm]]
name = "no-lang-line"

[[arm.replacements]]
path = "core/src/ufo/runtime/prompts/shell.md"
old = '''- Answer in the user's language — in the conversation and in every artifact you produce.
'''
new = ''''''
