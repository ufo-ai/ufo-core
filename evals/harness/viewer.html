<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ufo eval viewer</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101310;
  --panel: #171b17;
  --panel-2: #1d221d;
  --line: #303830;
  --line-strong: #465146;
  --text: #eef2e9;
  --muted: #9ca89a;
  --green: #a7f06d;
  --green-deep: #26451f;
  --red: #ff8c7a;
  --red-deep: #4c2722;
  --amber: #f3c96b;
  --amber-deep: #44371d;
  --blue: #96c7ff;
  --blue-deep: #21374c;
  --purple: #cbb0ff;
  --purple-deep: #322549;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
button, select { font: inherit; }
button { color: inherit; }
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(260px, 420px) minmax(260px, 420px) auto;
  gap: 16px;
  align-items: end;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  background: #131713;
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 11px; min-height: 38px; }
.mark {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  color: var(--green);
  font: 700 11px var(--mono);
  letter-spacing: .08em;
}
.brand h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
.brand p { color: var(--muted); margin: 1px 0 0; font: 11px var(--mono); }
.control label { display: block; margin-bottom: 5px; color: var(--muted); font: 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
select {
  width: 100%;
  min-height: 38px;
  padding: 7px 34px 7px 10px;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 5px;
}
.actions { display: flex; gap: 7px; }
.button {
  min-height: 38px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel-2);
  cursor: pointer;
}
.button:hover { border-color: var(--line-strong); background: #252c25; }
.summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  border-bottom: 1px solid var(--line);
}
.metric { min-height: 108px; padding: 19px 22px; border-right: 1px solid var(--line); }
.metric:last-child { border-right: 0; }
.metric-label { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: .09em; }
.metric-value { margin-top: 7px; font: 600 29px/1.1 var(--mono); }
.metric-note { margin-top: 7px; color: var(--muted); font-size: 12px; }
.positive { color: var(--green); }
.negative { color: var(--red); }
.neutral { color: var(--muted); }
.scoreboard { border-bottom: 1px solid var(--line); background: #131713; }
.scoreboard > summary {
  min-height: 47px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 22px;
  cursor: pointer;
  list-style: none;
}
.scoreboard > summary::-webkit-details-marker { display: none; }
.scoreboard-title { display: flex; align-items: center; gap: 9px; font-weight: 650; }
.disclosure { color: var(--muted); font: 18px/1 var(--mono); transition: transform .12s ease; }
.scoreboard[open] .disclosure { transform: rotate(90deg); }
.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 7px;
  padding: 0 15px 15px;
}
.score-card {
  min-width: 0;
  padding: 11px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--panel);
  cursor: pointer;
}
.score-card:hover { border-color: var(--line-strong); background: var(--panel-2); }
.score-card.selected { border-color: var(--green); }
.score-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 11px var(--mono); }
.score-value { margin-top: 9px; font: 600 18px/1 var(--mono); }
.score-rate { margin-left: 7px; color: var(--muted); font-size: 11px; }
.workspace { display: grid; grid-template-columns: 300px 350px minmax(480px, 1fr); flex: 1; min-height: 0; }
.column { min-width: 0; border-right: 1px solid var(--line); }
.column:last-child { border-right: 0; }
.column-head {
  min-height: 51px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: #131713;
  position: sticky;
  top: 75px;
  z-index: 5;
}
.column-head h2 { margin: 0; font-size: 11px; font-family: var(--mono); letter-spacing: .09em; text-transform: uppercase; }
.count { color: var(--muted); font: 11px var(--mono); }
.list { padding: 7px; }
.suite-row, .case-row {
  width: 100%;
  display: block;
  text-align: left;
  padding: 10px;
  margin: 0 0 5px;
  border: 1px solid transparent;
  border-radius: 5px;
  background: transparent;
  cursor: pointer;
}
.suite-row:hover, .case-row:hover { background: var(--panel); }
.suite-row.selected, .case-row.selected { background: var(--panel-2); border-color: var(--line-strong); }
.row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.row-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; color: var(--muted); font: 11px var(--mono); }
.leaf-label {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--blue);
  background: var(--blue-deep);
  font: 9px var(--mono);
}
.delta { margin-left: auto; }
.badge {
  display: inline-flex;
  align-items: center;
  min-height: 20px;
  padding: 2px 6px;
  border-radius: 3px;
  font: 700 9px var(--mono);
  letter-spacing: .05em;
  text-transform: uppercase;
}
.pass { color: var(--green); background: var(--green-deep); }
.fail, .regressed { color: var(--red); background: var(--red-deep); }
.excluded, .changed { color: var(--amber); background: var(--amber-deep); }
.fixed, .new, .running { color: var(--blue); background: var(--blue-deep); }
.missing, .same { color: var(--muted); background: #292f29; }
.compaction { color: var(--purple); background: var(--purple-deep); }
.filters { display: flex; gap: 5px; flex-wrap: wrap; padding: 8px 8px 2px; }
.filter {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font: 10px var(--mono);
}
.filter.active { color: var(--text); border-color: var(--line-strong); background: var(--panel-2); }
.detail { min-width: 0; }
.detail-head { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.detail-leaf { margin-bottom: 7px; color: var(--blue); font: 10px var(--mono); }
.detail-head h2 { margin: 0; font-size: 19px; }
.prompt { max-width: 110ch; color: var(--muted); margin: 8px 0 0; white-space: pre-wrap; }
.compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.run-pane { min-width: 0; padding: 18px 20px 36px; border-right: 1px solid var(--line); }
.run-pane:last-child { border-right: 0; }
.pane-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.pane-kicker { color: var(--muted); font: 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
.pane-title { margin-top: 3px; font-weight: 650; }
.reason { padding: 10px 11px; margin: 0 0 15px; border-left: 2px solid var(--line-strong); background: var(--panel); white-space: pre-wrap; }
.section { margin-top: 18px; }
.section-title { margin: 0 0 7px; color: var(--muted); font: 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
pre {
  margin: 0;
  max-height: 480px;
  overflow: auto;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: #111411;
  color: #dbe3d6;
  font: 11px/1.55 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.attempt, .call { margin: 7px 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.attempt > summary, .call > summary { padding: 9px 10px; cursor: pointer; font-family: var(--mono); font-size: 11px; }
.attempt-body, .call-body { padding: 0 10px 11px; }
.artifact-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.artifact { display: flex; flex-direction: column; gap: 5px; max-width: 220px; }
.artifact-thumb { max-width: 220px; max-height: 300px; border: 1px solid var(--line); border-radius: 4px; background: #fff; display: block; }
.artifact-link { font-family: var(--mono); font-size: 11px; word-break: break-all; }
.call-grid { display: grid; gap: 9px; }
.timing { width: 100%; border-collapse: collapse; font: 11px var(--mono); margin: 6px 0 12px; }
.timing th, .timing td { border-bottom: 1px solid var(--line); padding: 3px 8px; text-align: left; }
.timing th { color: var(--muted); font-weight: 500; }
.timing .num { text-align: right; }
.trajectory-link { color: var(--blue); font: 11px var(--mono); text-decoration: none; }
.trajectory-link:hover { text-decoration: underline; }
.trajectory-head { padding: 18px 20px; border-bottom: 1px solid var(--line); }
.trajectory-head h2 { margin: 12px 0 3px; font-size: 19px; }
.trajectory-meta { color: var(--muted); font: 11px/1.6 var(--mono); overflow-wrap: anywhere; }
.trajectory-body { padding: 20px; max-width: 1200px; }
.message { margin: 9px 0; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.message-head { padding: 7px 10px; border-bottom: 1px solid var(--line); color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.message-body { padding: 10px; }
.message-body pre + pre { margin-top: 8px; }
.empty { padding: 32px 20px; color: var(--muted); }
.archive-empty { max-width: 680px; margin: 15vh auto; padding: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.archive-empty h1 { margin-top: 0; }
.archive-empty code { font-family: var(--mono); color: var(--green); }
.toast { min-width: 130px; color: var(--green); font: 11px var(--mono); align-self: center; }
@media (max-width: 1100px) {
  .topbar { grid-template-columns: 1fr 1fr; }
  .actions { justify-content: flex-end; }
  .workspace { grid-template-columns: 250px 300px minmax(420px, 1fr); }
}
@media (max-width: 820px) {
  .topbar { position: static; grid-template-columns: 1fr; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  .score-grid { grid-template-columns: 1fr; }
  .metric:nth-child(2) { border-right: 0; }
  .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .workspace { display: block; }
  .column { border-right: 0; border-bottom: 1px solid var(--line); }
  .column-head { position: static; }
  .compare-grid { grid-template-columns: 1fr; }
  .run-pane { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<main id="app"></main>
<script id="eval-data" type="application/json">__EVAL_PAYLOAD__</script>
<script>
const data = JSON.parse(document.getElementById('eval-data').textContent);
const runs = data.runs;
const LEAF_PREFIXES = ['memory_100.', 'hle_gold.', 'dsqa_100.'];
const hash = new URLSearchParams(location.hash.slice(1));
const state = {
  current: hash.get('current') || data.current || (runs[0] && runs[0].id) || '',
  baseline: hash.get('baseline') || data.baseline || (runs[1] && runs[1].id) || '',
  suite: hash.get('suite') || '',
  caseName: hash.get('case') || '',
  filter: hash.get('filter') || 'all',
  scoresOpen: hash.get('scores') === 'open',
  trajectory: hash.get('trajectory') || ''
};
const app = document.getElementById('app');

function h(value) {
  return String(value == null ? '' : value)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
}

function runById(id) { return runs.find(run => run.id === id); }
function reportByName(run, name) { return run && run.reports.find(report => report.name === name); }
function caseByName(report, name) { return report && report.cases.find(item => item.name === name); }
function leafLabel(name) {
  const prefix = LEAF_PREFIXES.find(value => name && name.startsWith(value));
  return prefix ? name.slice(prefix.length) : name;
}
function scored(cases) { return (cases || []).filter(item => !item.excluded); }
function passed(cases) { return scored(cases).filter(item => item.passed).length; }
function rate(cases) { const rows = scored(cases); return rows.length ? passed(rows) / rows.length : 0; }
function pct(value) { return Math.round(value * 100) + '%'; }
function points(value) { return (value > 0 ? '+' : '') + Math.round(value * 100) + ' pp'; }
function compatible(left, right) { return Boolean(left && right && left.digest === right.digest); }
function formatDate(value) {
  return new Intl.DateTimeFormat(undefined, {dateStyle: 'medium', timeStyle: 'short'}).format(new Date(value));
}
function shortId(run) { return run ? run.id.slice(0, 8) : ''; }
function runName(run) {
  return run ? (run.label || `${run.revision} · ${formatDate(run.created_at)}`) : 'No baseline';
}
function reportStatus(report) {
  if (!report) return {label: 'missing', cls: 'missing'};
  const rows = scored(report.cases);
  return rows.length && rows.every(item => item.passed)
    ? {label: 'pass', cls: 'pass'} : {label: 'fail', cls: 'fail'};
}
function recallMeta(report) {
  if (!report || report.degradedRecallCount == null || report.unmappedEvidenceCount == null) return '';
  const coverage = report.meanMappedEvidenceCoverage == null || report.minMappedEvidenceCoverage == null
    ? 'mapped evidence coverage n/a'
    : `mapped evidence coverage mean ${pct(report.meanMappedEvidenceCoverage)} · min ${pct(report.minMappedEvidenceCoverage)}`;
  return `${coverage} · ${report.degradedRecallCount} degraded · ${report.unmappedEvidenceCount} unmapped evidence`;
}
function metricMeta(report) {
  return (report && report.metrics || []).map(metric => `${metric.name.replaceAll('_', ' ')} ${pct(metric.value)}`).join(' · ');
}
function benchmarkMeta(report) {
  const performance = report && report.benchmark && report.benchmark.performance;
  if (!performance) return '';
  return `${performance.tier} tier · mean claim coverage ${pct(performance.meanClaimCoverage)} at ${pct(report.benchmark.claimCoverageThreshold)} task threshold`;
}
function caseStatus(item) {
  if (!item) return {label: 'missing', cls: 'missing'};
  if (item.excluded) return {label: 'excluded', cls: 'excluded'};
  return item.passed ? {label: 'pass', cls: 'pass'} : {label: 'fail', cls: 'fail'};
}
function trend(left, right, canCompare) {
  if (!right) return {label: 'removed', cls: 'missing'};
  if (!left) return {label: 'new', cls: 'new'};
  if (!canCompare) return {label: 'suite changed', cls: 'changed'};
  if (right.excluded) return {label: 'excluded', cls: 'excluded'};
  if (left.excluded) return {label: 'now scored', cls: 'new'};
  if (left.passed && !right.passed) return {label: 'regressed', cls: 'regressed'};
  if (!left.passed && right.passed) return {label: 'fixed', cls: 'fixed'};
  return {label: 'unchanged', cls: 'same'};
}
function unionNames(left, right, field) {
  return [...new Set([...(left || []).map(item => item[field]), ...(right || []).map(item => item[field])])];
}
function persist() {
  history.replaceState(null, '', stateHash());
}
function stateHash(overrides = {}) {
  const next = new URLSearchParams();
  const values = {...{
    current: state.current, baseline: state.baseline, suite: state.suite,
    case: state.caseName, filter: state.filter, scores: state.scoresOpen ? 'open' : '',
    trajectory: state.trajectory
  }, ...overrides};
  for (const [key, value] of Object.entries(values)) if (value) next.set(key, value);
  return '#' + next.toString();
}
function comparableTotals(base, current) {
  const totals = {basePassed: 0, currentPassed: 0, scored: 0, regressions: 0, fixes: 0};
  if (!base || !current) return totals;
  for (const report of current.reports) {
    const before = reportByName(base, report.name);
    if (!compatible(before, report)) continue;
    for (const item of report.cases) {
      const prior = caseByName(before, item.name);
      if (!prior || prior.excluded || item.excluded) continue;
      totals.scored += 1;
      totals.basePassed += prior.passed ? 1 : 0;
      totals.currentPassed += item.passed ? 1 : 0;
      totals.regressions += prior.passed && !item.passed ? 1 : 0;
      totals.fixes += !prior.passed && item.passed ? 1 : 0;
    }
  }
  return totals;
}
function summaryMarkup(base, current) {
  const cases = current ? current.reports.flatMap(report => report.cases) : [];
  const comparable = comparableTotals(base, current);
  const delta = comparable.scored
    ? comparable.currentPassed / comparable.scored - comparable.basePassed / comparable.scored : 0;
  const excluded = cases.filter(item => item.excluded).length;
  return `<section class="summary">
    <div class="metric"><div class="metric-label">Current pass rate</div>
      <div class="metric-value">${pct(rate(cases))}</div>
      <div class="metric-note">${passed(cases)} / ${scored(cases).length} scored cases</div></div>
    <div class="metric"><div class="metric-label">Comparable delta</div>
      <div class="metric-value ${delta > 0 ? 'positive' : delta < 0 ? 'negative' : 'neutral'}">${comparable.scored ? points(delta) : '—'}</div>
      <div class="metric-note">${comparable.scored} digest-matched cases</div></div>
    <div class="metric"><div class="metric-label">Regressions</div>
      <div class="metric-value ${comparable.regressions ? 'negative' : 'neutral'}">${comparable.regressions}</div>
      <div class="metric-note">${comparable.fixes} fixed since baseline</div></div>
    <div class="metric"><div class="metric-label">Excluded</div>
      <div class="metric-value ${excluded ? 'neutral' : ''}">${excluded}</div>
      <div class="metric-note">external infrastructure failures</div></div>
  </section>`;
}
function scoreMarkup(base, current, name) {
  const before = reportByName(base, name);
  const after = reportByName(current, name);
  const status = reportStatus(after);
  const canCompare = compatible(before, after);
  const primary = after && after.metrics && after.metrics[0];
  const priorPrimary = before && before.metrics && before.metrics.find(metric => primary && metric.name === primary.name);
  const currentScore = primary ? primary.value : after ? rate(after.cases) : 0;
  const priorScore = priorPrimary ? priorPrimary.value : before ? rate(before.cases) : 0;
  const delta = canCompare ? currentScore - priorScore : 0;
  const detail = after ? primary ? `${primary.name.replaceAll('_', ' ')} ${pct(primary.value)}` : `${passed(after.cases)}/${scored(after.cases).length}` : '—';
  const deltaText = canCompare ? points(delta) : before && after ? 'digest changed' : before ? 'missing current' : 'no baseline';
  return `<button type="button" class="score-card ${name === state.suite ? 'selected' : ''}" data-suite="${h(name)}" data-score>
    <div class="row-top"><span class="score-name" title="${h(name)}">${h(leafLabel(name))}</span><span class="badge ${status.cls}">${status.label}</span></div>
    <div class="score-value">${detail}<span class="score-rate">${after && primary ? `${passed(after.cases)}/${scored(after.cases).length} strict` : after ? pct(rate(after.cases)) : ''}</span></div>
    <div class="row-meta ${delta < 0 ? 'negative' : delta > 0 ? 'positive' : ''}">${h(deltaText)}</div>
  </button>`;
}
function scoresMarkup(base, current, names) {
  const reports = current ? current.reports.filter(report => scored(report.cases).length) : [];
  const passing = reports.filter(report => reportStatus(report).cls === 'pass').length;
  return `<details class="scoreboard" id="scoreboard" ${state.scoresOpen ? 'open' : ''}>
    <summary><span class="scoreboard-title"><span class="disclosure">›</span>Suite scores</span>
      <span class="count">${passing}/${reports.length} passing · ${reports.length - passing} failing</span></summary>
    <div class="score-grid">${names.map(name => scoreMarkup(base, current, name)).join('')}</div>
  </details>`;
}
function runOptions(selected, allowEmpty) {
  const none = allowEmpty ? '<option value="">No baseline</option>' : '';
  return none + runs.map(run => `<option value="${h(run.id)}" ${run.id === selected ? 'selected' : ''}>${h(runName(run))} · ${h(shortId(run))}</option>`).join('');
}
function topbarMarkup(base, current) {
  return `<header class="topbar">
    <div class="brand"><div class="mark">UFO</div><div><h1>Eval lab</h1><p>${runs.length} recorded run${runs.length === 1 ? '' : 's'}</p></div></div>
    <div class="control"><label for="current-run">Current run</label><select id="current-run">${runOptions(state.current, false)}</select></div>
    <div class="control"><label for="baseline-run">Baseline run</label><select id="baseline-run">${runOptions(state.baseline, true)}</select></div>
    <div class="actions"><button class="button" id="copy-link">Copy link</button><button class="button" id="copy-runs">Copy run IDs</button><span class="toast" id="toast"></span></div>
  </header>`;
}
function suiteMarkup(base, current, name) {
  const before = reportByName(base, name);
  const after = reportByName(current, name);
  const status = reportStatus(after);
  const canCompare = compatible(before, after);
  const delta = canCompare ? rate(after.cases) - rate(before.cases) : 0;
  const detail = after ? `${passed(after.cases)}/${scored(after.cases).length}` : '—';
  const deltaText = canCompare ? points(delta) : before && after ? 'digest changed' : '';
  const recall = recallMeta(after);
  const metrics = metricMeta(after);
  const benchmark = benchmarkMeta(after);
  return `<button class="suite-row ${name === state.suite ? 'selected' : ''}" data-suite="${h(name)}">
    <div class="row-top"><span class="row-title">${h(name)}</span><span class="badge ${status.cls}">${status.label}</span></div>

  app.innerHTML = `<div class="shell">${topbarMarkup(base, current)}${summaryMarkup(base, current)}${scoresMarkup(base, current, suiteNames)}
    <div class="workspace">
      <section class="column"><div class="column-head"><h2>Suites</h2><span class="count">${suiteNames.length}</span></div><div class="list">${suiteNames.map(name => suiteMarkup(base, current, name)).join('')}</div></section>
      <section class="column"><div class="column-head"><h2>Cases</h2><span class="count">${visibleCases.length}/${caseNames.length}</span></div>
        <div class="filters">${['all','regressions','failures','fixed','excluded'].map(name => `<button class="filter ${name === state.filter ? 'active' : ''}" data-filter="${name}">${name}</button>`).join('')}</div>
        <div class="list">${caseNames.map(name => caseMarkup(before, after, compatible(before, after), name, state.suite)).join('') || '<div class="empty">No cases match this filter.</div>'}</div></section>
      ${detailMarkup(base, current, before, after)}
    </div></div>`;
  persist();
  document.getElementById('current-run').addEventListener('change', event => { state.current = event.target.value; state.trajectory = ''; render(); });
  document.getElementById('baseline-run').addEventListener('change', event => { state.baseline = event.target.value; state.trajectory = ''; render(); });
  document.querySelectorAll('[data-suite]').forEach(node => node.addEventListener('click', () => { state.suite = node.dataset.suite; state.caseName = ''; state.trajectory = ''; render(); }));
  document.querySelectorAll('[data-case]').forEach(node => node.addEventListener('click', () => { state.caseName = node.dataset.case; state.trajectory = ''; render(); }));
  document.querySelectorAll('[data-filter]').forEach(node => node.addEventListener('click', () => { state.filter = node.dataset.filter; state.caseName = ''; state.trajectory = ''; render(); }));
  document.getElementById('scoreboard').addEventListener('toggle', event => { state.scoresOpen = event.target.open; persist(); });
  document.getElementById('copy-link').addEventListener('click', async () => copyText(location.href, 'Link copied'));
  document.getElementById('copy-runs').addEventListener('click', async () => copyText([state.current, state.baseline].filter(Boolean).join(' '), 'Run IDs copied'));
}
window.addEventListener('hashchange', () => {
  const next = new URLSearchParams(location.hash.slice(1));
  state.current = next.get('current') || state.current;
  state.baseline = next.get('baseline') || '';
  state.suite = next.get('suite') || '';
  state.caseName = next.get('case') || '';
  state.filter = next.get('filter') || 'all';
  state.scoresOpen = next.get('scores') === 'open';
  state.trajectory = next.get('trajectory') || '';
  render();
});
async function copyText(value, message) {
  try { await navigator.clipboard.writeText(value); document.getElementById('toast').textContent = message; }
  catch (_) { window.prompt('Copy to clipboard', value); }
}
render();
</script>
</body>
</html>
