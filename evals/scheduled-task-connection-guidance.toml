name = "scheduled-task-connection-guidance"
base = "HEAD"
suites = ["object_tools"]
cases = [
  "O04-create-weekday-digest",
  "O05-yaml-hostile-prompt",
  "O12-cron-syntax-two-weekdays",
]
repeats = 2
concurrency = 3
max_stacks = 2
budget_usd = 35.0
est_usd_per_case = 1.20

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
research = { search_provider = "perplexity" }

[[arm]]
name = "no-field-guidance"

[[arm.replacements]]
path = "extensions/scheduled_tasks/ufo_ext_scheduled_tasks/tools.py"
old = '''        description=(
            "Connection ids the task may use. Required on create; [] allows none; omitted on an "
            "update preserves the list. object_list connection returns the ids."
        ),'''
new = '''        description="",'''

[[arm]]
name = "kind-guidance"

[[arm.replacements]]
path = "extensions/scheduled_tasks/ufo_ext_scheduled_tasks/tools.py"
old = '''        "A fire has no speaker and carries only the task's exact stored capabilities, and recalls "'''
new = '''        "A fire has no speaker and recalls "'''

