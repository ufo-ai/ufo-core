name = "chart-delivery-register"
base = "HEAD"
suites = ["chart_delivery"]
repeats = 2
concurrency = 3
max_stacks = 1
budget_usd = 40.0
est_usd_per_case = 0.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
models = { auto_model = "z-ai/glm-5.3-flash" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

[[arm]]
name = "no-workspace-path"

[[arm.replacements]]
path = "core/src/ufo/runtime/turns/delivery_register.md"
old = '''An answer to a member that rests on five or more numbers in one measure carries one chart of them,
written as a PNG under /workspace. Fewer numbers stay in words.'''
new = '''An answer to a member that rests on five or more numbers in one measure carries one chart of them.
Fewer numbers stay in words.'''

[[arm]]
name = "numbers-already-said"

[[arm.replacements]]
path = "core/src/ufo/runtime/turns/delivery_register.md"
old = '''An answer to a member that rests on five or more numbers in one measure carries one chart of them,
written as a PNG under /workspace. Fewer numbers stay in words.'''
new = '''An answer to a member that rests on five or more numbers in one measure carries one chart of them,
written as a PNG under /workspace, and a follow-up carries one whether or not the numbers were
already said. Fewer numbers stay in words.'''

[[arm]]
name = "no-chart-rule"

[[arm.replacements]]
path = "core/src/ufo/runtime/turns/delivery_register.md"
old = '''An answer to a member that rests on five or more numbers in one measure carries one chart of them,
written as a PNG under /workspace. Fewer numbers stay in words.
'''
new = ""
