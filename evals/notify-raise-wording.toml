name = "notify-raise-wording"
base = "HEAD"
suites = ["notify_raise"]
repeats = 3
concurrency = 2
max_stacks = 2
budget_usd = 60.0
est_usd_per_case = 0.20

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
browser = { cdp_provider = "browserbase" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "turbopuffer" }
models = { auto_model = "z-ai/glm-5.3-flash" }
pack = { name = "assistant_hosted" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }
flags = { backend = "open" }

[[arm]]
name = "no-razor"

[[arm.replacements]]
path = "extensions/app_notification/ufo_ext_app_notification/notify_tool.py"
old = '''    "can do: a revoked token, an expired grant, a slot they never filled. That is the line "
    "against `report_problem` — what a member fixes by connecting or reconnecting an account is "
    "a notification, and what only an engineer can fix is a report. Nothing answers back "'''
new = '''    "can do: a revoked token, an expired grant, a slot they never filled. Nothing answers back "'''

[[arm]]
name = "old-wording"

[[arm.replacements]]
path = "extensions/app_notification/ufo_ext_app_notification/notify_tool.py"
old = '''    "an email that needs a decision or is going unanswered, a customer or investor turning. It "
    "is also where a broken account of theirs goes, because connecting one is a thing only they "
    "can do: a revoked token, an expired grant, a slot they never filled. That is the line "
    "against `report_problem` — what a member fixes by connecting or reconnecting an account is "
    "a notification, and what only an engineer can fix is a report. Nothing answers back "'''
new = '''    "an email that needs a decision or is going unanswered, a customer or investor turning. It "
    "is not for ufo's own condition: a connection that stopped authenticating or a task that "
    "faults is `report_problem` and a line in your reply, never a notification. Nothing answers "
    "back "'''

[[arm]]
name = "razor-on-notify-only"

[[arm.replacements]]
path = "extensions/debugger/ufo_ext_debugger/report.py"
old = '''    "a member asks for a problem to be reported, whatever the problem is. What they would fix by "
    "connecting or reconnecting an account of their own — a revoked token, an unfilled slot of "
    "theirs — belongs in `notify` where you hold it, since that reaches the person who can clear "
    "it; where you do not hold it, report it here, because nothing else would carry it. Say what "
    "you attempted, "'''
new = '''    "a member asks for a problem to be reported, whatever the problem is. Say what "
    "you attempted, "'''

[[arm]]
name = "no-already-told"

[[arm.replacements]]
path = "extensions/app_notification/ufo_ext_app_notification/notify_tool.py"
old = '''    "call per subject, whatever the batch size; two different things are two calls. Do not raise "
    "what this turn already told them or a fault you can repair."'''
new = '''    "call per subject, whatever the batch size; two different things are two calls."'''
