name = "glm-member-link-delivery"
base = "017fc2a84cafb31a8a29fa1eaff9f4d54bb570c9"
suites = ["response_register"]
cases = [
  "report-workspace-path-is-not-a-link",
  "report-summary-request-shares-nothing",
  "report-file-asked-for-up-front",
  "report-then-file-requested",
]
repeats = 4
concurrency = 4
max_stacks = 2
budget_usd = 12.0
est_usd_per_case = 0.15
model = "z-ai/glm-5.3-flash"
reasoning = "medium"

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
models = { auto_model = "gpt-5.4-mini" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "delivery-rule"

[[arm.replacements]]
path = "core/src/ufo/runtime/turns/delivery_register.md"
old = '''Write that artifact to
/workspace and say in the inline delivery that the fuller write-up is there and can be sent. Share
'''
new = '''Write that artifact to
/workspace and say in the inline delivery that the fuller write-up is there and can be sent. A
workspace path is not a link that a member can open. In a member reply, name an unshared artifact
by its file name in plain text. Only a successful share_file result supplies a link. Share
'''

