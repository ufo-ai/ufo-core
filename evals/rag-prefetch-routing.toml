name = "rag-prefetch-routing"
base = "HEAD"
suites = ["rag_prefetch"]
repeats = 3
concurrency = 2
max_stacks = 1
budget_usd = 125.0
est_usd_per_case = 0.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "default" }
pack = { name = "assistant_eval" }
research = { search_provider = "eval_search" }
sandbox = { backend = "local" }

[[arm]]
name = "no-prefetch"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/route.py"
old = '''    queries = questions or (inbound,)'''
new = '''    queries = ()'''

[[arm]]
name = "question-shaped-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/route.py"
old = '''    queries = questions or (inbound,)'''
new = '''    queries = questions'''

[[arm]]
name = "bare-preface"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''PREFACE = (
    "Answer from these passages when they answer the question. Name, in the sentence that states "
    "it, where every figure, date and name came from: a web passage by its address, a workspace "
    "passage by the record it names.\n"
)
'''
new = '''PREFACE = "Search results for this message:\n"'''

[[arm]]
name = "no-answer-clause"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''PREFACE = (
    "Answer from these passages when they answer the question. Name, in the sentence that states "
    "it, where every figure, date and name came from: a web passage by its address, a workspace "
    "passage by the record it names.\n"
)
'''
new = '''PREFACE = (
    "Name, in the sentence that states it, where every figure, date and name came from: a web "
    "passage by its address, a workspace passage by the record it names.\n"
)
'''

[[arm]]
name = "unnamed-source-clause"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''    "Answer from these passages when they answer the question. Name, in the sentence that states "
    "it, where every figure, date and name came from: a web passage by its address, a workspace "
    "passage by the record it names.\n"'''
new = '''    "Answer from these passages when they answer the question, and name the source you took "
    "each fact from.\n"'''

[[arm]]
name = "external-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/prefetch.py"
old = '''        if self.pages is None:
            return ()'''
new = '''        if self.pages is None or True:
            return ()'''

[[arm]]
name = "internal-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/prefetch.py"
old = '''        if self.search is None:
            return ()'''
new = '''        if self.search is None or True:
            return ()'''
