name = "rag-prefetch-routing"
base = "HEAD"
suites = ["rag_prefetch"]
repeats = 3
concurrency = 2
max_stacks = 1
budget_usd = 125.0
est_usd_per_case = 0.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "default" }
pack = { name = "assistant_eval" }
research = { search_provider = "eval_search" }
sandbox = { backend = "local" }

[[arm]]
name = "no-prefetch"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/route.py"
old = '''    queries = questions or (inbound,)'''
new = '''    queries = ()'''

[[arm]]
name = "question-shaped-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/route.py"
old = '''    queries = questions or (inbound,)'''
new = '''    queries = questions'''

[[arm]]
name = "bare-preface"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''PREFACE = (
    "A web search and a workspace search ran on this message before you read it; nobody asked for "
    "them and nothing below is the member's words. They run on every message, whatever it asks "
    "for, so the block is no sign that this message wanted a search. Answer from these passages "
    "when they answer the question. Name, in the sentence that states it, where every figure, date "
    "and name came from: a web passage by its address, a workspace passage by the record it names. "
    "Each passage is one numbered entry — its number and title, then the address or record it "
    "came from, then its text — so give that entry's number beside the name, never in place of "
    "it. These "
    "passages replace no tool: when the message asks you to act, act with your tools; when the "
    "answer turns on live state, read that state with your tools; when the passages do not hold "
    "the answer, go and get it or say you do not have it. When two passages disagree, say so, "
    "name each source with its date, and do not merge them.\n"
)
'''
new = '''PREFACE = "Search results for this message:\n"'''

[[arm]]
name = "no-tool-clause"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''    "it. These "
    "passages replace no tool: when the message asks you to act, act with your tools; when the "
    "answer turns on live state, read that state with your tools; when the passages do not hold "
    "the answer, go and get it or say you do not have it. When two passages disagree, say so, "
    "name each source with its date, and do not merge them.\n"'''
new = '''    "it. When two passages disagree, say so, name each source with its date, and do not merge them.\n"'''

[[arm]]
name = "no-conflict-clause"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''    "the answer, go and get it or say you do not have it. When two passages disagree, say so, "
    "name each source with its date, and do not merge them.\n"'''
new = '''    "the answer, go and get it or say you do not have it.\n"'''

[[arm]]
name = "unnamed-source-clause"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/manifest.py"
old = '''    "when they answer the question. Name, in the sentence that states it, where every figure, date "
    "and name came from: a web passage by its address, a workspace passage by the record it names. "'''
new = '''    "when they answer the question, and name the source you took each fact from. "'''

[[arm]]
name = "external-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/prefetch.py"
old = '''        if self.pages is None:
            return ()'''
new = '''        if self.pages is None or True:
            return ()'''

[[arm]]
name = "internal-only"

[[arm.replacements]]
path = "extensions/rag/ufo_ext_rag/prefetch.py"
old = '''        if self.search is None:
            return ()'''
new = '''        if self.search is None or True:
            return ()'''
