name = "app-home-vite-clauses"
base = "HEAD"
suites = ["app_home_change"]
cases = ["chat-home-add-control", "chat-home-second-change"]
agent = "chat"
repeats = 3
concurrency = 1
max_stacks = 1
budget_usd = 80.0
est_usd_per_case = 1.20

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

[[arm]]
name = "no-kit-fence"
[arm.files]
"extensions/app_chat/ufo_ext_app_chat/skills/app-chat-home/SKILL.md" = "arms/no-kit-fence-app-chat-home.md"

