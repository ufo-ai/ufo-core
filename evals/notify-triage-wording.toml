name = "notify-triage-wording"
base = "HEAD"
suites = ["notify_triage"]
agent = "notification"
repeats = 2
concurrency = 1
max_stacks = 1
budget_usd = 12.0
est_usd_per_case = 0.60

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
browser = { cdp_provider = "browserbase" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "turbopuffer" }
models = { auto_model = "z-ai/glm-5.3-flash" }
pack = { name = "assistant_hosted" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }
flags = { backend = "open" }

[[arm]]
name = "no-triage-rule"

[[arm.replacements]]
path = "extensions/app_notification/ufo_ext_app_notification/manifest.py"
old = '''    "`notification` object kind. A turn that opens with a `<notifications>` block is a batch "
    "raised for one member since you last read their inbox: pass on what changes what they do "
    "today — revenue moving, production down, a customer or investor waiting on them — with the "
    "`deliver` action, as one message in your own words saying what happened and what it means "
    "for them. Drop the rest without comment: routine syncs, green runs, receipts, newsletters; a "
    "batch with nothing worth interrupting for delivers nothing. A member who hears from you "
    "about everything stops reading you. "'''
new = '''    "`notification` object kind. "'''
