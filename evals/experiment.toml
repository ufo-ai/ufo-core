name = "workspace-capability-facts"
base = "HEAD"
suites = ["surface_setup"]
cases = [
  "slack-installed-status-question",
  "slack-status-question",
]
repeats = 5
concurrency = 4
max_stacks = 2
budget_usd = 60.0
est_usd_per_case = 0.50

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
browser = { cdp_provider = "browserbase" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "turbopuffer" }
pack = { name = "assistant_hosted" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

# The Slack install writes its own leg and no connector grant, so the connector listing — the one
# connection read the agent has — reports Slack unconnected and the answer offers the install the
# workspace already made. The capability states one line, and the arm silences that line's own read
# rather than its wording, so it removes exactly what the extension contributes. The installed case
# is what the line claims to move; the uninstalled one is the control that it changes nothing where
# no install exists.

[[arm]]
name = "no-slack-block"
[[arm.replacements]]
path = "extensions/slack/ufo_ext_slack/manifest.py"
old = """
    if await ext.installations.installation(SURFACE_SLACK) is None:
        return False
    return await install_is_live(ext)
"""
new = """
    return False and await install_is_live(ext)
"""

# The closer is one sentence and the arm above leaves it standing, so this arm empties it. Its two
# sentences were ablated apart: neither carried the answer alone, an empty closer regressed, and the
# connector caveat came out because it holds only where a capability shares a name with a broker
# provider.

[[arm]]
name = "no-closer"
[[arm.replacements]]
path = "core/src/ufo/runtime/prompts/render.py"
old = """
WORKSPACE_FACTS_CLOSER = "Already set up — do not offer again."
"""
new = """
WORKSPACE_FACTS_CLOSER = ""
"""
