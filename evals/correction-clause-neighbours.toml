name = "correction-clause-neighbours"
base = "HEAD"
suites = ["object_tools", "object_tools_flows"]
repeats = 1
concurrency = 3
max_stacks = 2
budget_usd = 30.0
est_usd_per_case = 0.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }
flags = { backend = "open" }

[[arm]]
name = "no-correction-clause"

[[arm.replacements]]
path = "extensions/memory/ufo_ext_memory/manifest.py"
old = '''                    "last-updated time, a count, an identifier, a status flag. When an item you "
                    "recalled contradicts what a live source just told you, record the corrected "
                    "statement, so later recall carries the current one. Set `memory_kind` "'''
new = '''                    "last-updated time, a count, an identifier, a status flag. Set `memory_kind` "'''
