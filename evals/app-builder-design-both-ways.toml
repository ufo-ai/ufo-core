# Which edit opens the design pass to a member who named the job?
#
# Two facts decide it, and both are facts about the trajectory: the skill loaded, and a design stood
# in front of the create with an ask after it. A11 and A12 grade exactly those two, one per way in,
# and carry no rubric — so no judge and no criterion about some other part of the reply can take a
# sample down. A case that grades the whole creation product cannot answer a question about one
# sentence: it fails for the paraphrased contract or a closing-line rule, and an arm failing it
# says nothing about the text under test.
#
# `base = "HEAD"` holds the graders still, so every arm is scored by one ruler. Each arm reverts one
# edit to what main says; the control is the shipped text.
name = "app-builder-design-both-ways"
base = "HEAD"
suites = ["new_application"]
cases = ["A11-named-shows-the-design", "A12-guided-shows-the-design"]
repeats = 4
concurrency = 2
# One arm at a time. `evals.stack` runs every repeat of an arm in parallel — `asyncio.gather` with a
# lock over database creation only — so the serves alive at once are `max_stacks * repeats`, and each
# serve holds a pool. Three arms at four repeats put twelve serves against the 100-connection eval
# Postgres and every turn died on TooManyConnectionsError. One arm keeps it at four serves, which
# also leaves the server usable for anything else running on it.
max_stacks = 1
budget_usd = 60.0
est_usd_per_case = 0.70

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
# The pack installs `research`, whose seam serve refuses to start without a provider.
research = { search_provider = "perplexity" }

# The whole change to the routing prose, reverted: the two ways in, the count of asks before the
# create, and what `Build it` settles all go back to main's guided-only wording. Nothing else moves,
# so the design section still stands and the renderer is still there to call. This arm answers the
# only question that matters first — is any of this text what opens the design pass to a member who
# named the job, or does the section heading alone do it?
[[arm]]
name = "guided-only-prose"

