# Does telling the conversation to copy the returned design block change what the application
# carries?
#
# The renderer composes the accepted design into one `homepage_design` block and the skill says to
# copy it. The arm reverts only that sentence, to main's instruction to write the five fields out
# under `Homepage design`. The renderer still returns the block in both arms, so the question is the
# sentence alone: does a model told to copy a returned string carry the design the member accepted
# more often than one told to compose it?
#
# A13 grades that one fact — the block the last preview composed is in the durable application
# prompt — and carries no rubric, so no judge and no criterion about some other part of the reply
# can take a sample down. A01 grades the same fact inside a whole creation product and fails for
# reasons unrelated to it.
#
# `base = "HEAD"` holds the grader still: this branch renders the block from the accepted contract
# and reads it back out of the row, so both arms are scored by one ruler.
name = "app-builder-design-block"
base = "HEAD"
suites = ["new_application"]
cases = ["A13-carries-the-design"]
repeats = 4
concurrency = 2
# `evals.stack` runs every repeat of an arm in parallel, so the serves alive at once are
# `max_stacks * repeats`. One arm at four repeats is four serves against the eval Postgres.
max_stacks = 1
budget_usd = 30.0
est_usd_per_case = 1.20

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
# The pack installs `research`, whose seam serve refuses to start without a provider.
research = { search_provider = "perplexity" }

# The conversation composes the section itself again, from the same five fields it just sent the
# renderer.
[[arm]]
name = "compose-the-fields"

[[arm.replacements]]
path = "core/src/ufo/skills/create-application/SKILL.md"
old = '''design pass. The renderer returns the accepted design as a `homepage_design` block: copy that block
into the application prompt exactly as returned, rather than writing the fields out yourself. The
application builds and binds its live homepage on its first homepage turn.'''
new = '''design pass. Put every field from the accepted contract in the application prompt under
`Homepage design`. The application builds and binds its live homepage on its first homepage turn.'''

# Nothing says the prompt carries the design at all. Both arms above tell the conversation to put it
# there and only differ on how, so neither can say whether the sentence or the returned field is
# what does the work. This one takes the sentence away and leaves the field.
[[arm]]
name = "no-placement-line"

[[arm.replacements]]
path = "core/src/ufo/skills/create-application/SKILL.md"
old = '''design pass. The renderer returns the accepted design as a `homepage_design` block: copy that block
into the application prompt exactly as returned, rather than writing the fields out yourself. The
application builds and binds its live homepage on its first homepage turn.'''
new = '''design pass. The application builds and binds its live homepage on its first homepage turn.'''
