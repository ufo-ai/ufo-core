name = "app-builder-visible-wireframe"
base = "f660a547c"
suites = ["new_application"]
cases = ["A11-named-shows-the-design", "A12-guided-shows-the-design"]
repeats = 1
concurrency = 2
max_stacks = 1
budget_usd = 24.0
est_usd_per_case = 4.0

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
sandbox = { backend = "docker" }
research = { search_provider = "perplexity" }

[[arm]]
name = "no-skill-call"

[[arm.replacements]]
path = "core/src/ufo/runtime/skills/create-application/SKILL.md"
old = '''Finish the name and complete application prompt,
then call the `site` collection's `design_ufo_application` action with that exact `application_name` and
`application_prompt`. Omit `revision` on the first call.'''
new = '''Finish the name and complete application prompt, then ask the member to approve the design.'''

[[arm]]
name = "no-wireframe-steps"

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/prompts/subagent_ufo_application_builder.md"
old = '''For `wireframe`, do not inspect connectors or write application source. Read the ufo style
reference, call `write_application_design`, and finish with `status: wireframe`, its exact
`design_path` and `design_digest`, zero browser batches, and no build output. The parent shares that
accepted SVG.'''
new = '''For `wireframe`, finish with `status: wireframe`.'''
