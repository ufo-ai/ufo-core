name = "glm-sandbox-routing-confirm"
base = "e7a7e719ab496d13bd9da85416b6fc1639f5cc43"
suites = ["skill_loading", "sandbox_cli"]
cases = [
  "sandbox-run-script",
  "sandbox-build-project",
  "sandbox-cli-model",
  "sandbox-cli-object-bridge",
  "sandbox-ufo-llm",
  "sandbox-ufo-tool",
  "sandbox-shell-snippet-only",
  "coding-fix-failing-test",
  "coding-trace-webhook",
]
repeats = 5
concurrency = 9
max_stacks = 2
remote = true
model = "z-ai/glm-5.3-flash"
budget_usd = 15.0
est_usd_per_case = 0.15

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
browser = { cdp_provider = "browserbase" }
connect = { public_base_url = "http://evals.invalid" }
memory = { index_backend = "turbopuffer" }
pack = { name = "assistant_hosted" }
research = { search_provider = "perplexity" }
sandbox = { backend = "local" }

[[arm]]
name = "sandbox-route"

[[arm.replacements]]
path = "core/src/ufo/runtime/skills/sandbox/SKILL.md"
old = "description: Load when a task first requires running, building, or inspecting anything in /workspace, including executing a supplied script, surveying unfamiliar files, or using an installed sandbox command."
new = "description: Load when a member asks to run or repair a supplied script, inspect or change files in /workspace, build or diagnose a project, execute a workspace command, or use `ufo llm` or `ufo tool`. Do not load for an unexecuted snippet."
