name = "app-builder-svg-geometry-wording"
base = "HEAD"
suites = ["ufo-app-bench"]
cases = ["pre-meeting-briefs", "meeting-tasks", "issue-owner"]
repeats = 1
concurrency = 3
max_stacks = 2
budget_usd = 40.0
est_usd_per_case = 3.30

[template]
database = { url = "postgresql+asyncpg://ufo:ufo@127.0.0.1:5541/ufo" }
blob = { backend = "filesystem", root = "./blobs" }
connect = { public_base_url = "http://evals.invalid" }
pack = { name = "assistant_eval" }
research = { search_provider = "perplexity" }
sandbox = { backend = "docker" }

[[arm]]
name = "redundant-wording"

[[arm.replacements]]
path = "extensions/sites/ufo_ext_sites/prompts/subagent_ufo_application_builder.md"
old = '''Before source work when no accepted design is present, call `write_application_design` with one
full-page SVG. Use the real facts, information order, component shapes, labels, and action placement
you will implement.'''
new = '''Before source work when no accepted design is present, call `write_application_design` with one
full-page SVG for a 305 px-wide app lane. Use `viewBox="0 0 305 H"`, `width="305"`, and a matching
finite content-driven height `H` from 844 through 4096. The initial fold is y=844: keep the primary
task and required facts above it. Keep every visible drawing and text bound inside the viewBox. Do
not design a laptop or desktop layout. Use the real facts, information order, component shapes,
labels, and action placement you will implement.'''
