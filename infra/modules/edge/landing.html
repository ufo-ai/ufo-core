/* --- tokens -------------------------------------------------------------
   The ramp steps the page lands on, and the shadcn slots that resolve through
   them. --primary is the one to read twice: stock UFO dark puts signal-400
   there, which turns "Join Waitlist" into a blue button. The design wants the
   near-white pill, so it resolves to sand-25 — do not move it back without
   re-reading the artboard. --background is the illustration's own ground,
   sampled from the asset, so the page meets the artwork with no seam. */

:root {
  --void-800: #2E373B;
  --void-900: #0D1418;
  --void-950: #050C0F;
  --signal-400: #4F97C7;
  --signal-500: #2E81B6;
  --sand-25: #FFFAEF;
  --sand-50: #F3ECDE;

  --background: var(--void-900);          /* node: the artwork's ground */
  --foreground: var(--sand-50);           /* node: #fafafa */
  --primary: var(--sand-25);              /* node: #fafafa */
  --primary-foreground: var(--void-950);  /* node: #18181b */
  --border: var(--void-800);              /* node: #27272a */
  --ring: var(--signal-400);
  --radius: 0.25rem;

  --state-hover: rgb(from var(--foreground) r g b / 0.05);

  --font-display: 'Canela', Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* --- page ---------------------------------------------------------------- */

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  background: var(--background);
}

/* The illustration. object-position pins the framing to the artboard: the node
   places a 1024-square image at top:-27 in a 1024x768 window, so 27px of the
   256px vertical overflow sits above the fold — 27/256 = 10.55%. Holding that
   ratio keeps the figures low and the sky open for the headline at any size. */
.hero-art {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 10.55%;
  pointer-events: none;
}

/* --- top bar ------------------------------------------------------------- */

.topbar {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 72px;
  padding: 16px 24px;
}

/* The node lays a 1024x72 PNG over the bar. It is a pure vertical gradient —
   solid rgb(12,19,23) at 80% alpha holding to 56% of its height, then ramping
   to zero — so it is a gradient here rather than a shipped bitmap. The colour
   is void-900 to within a rounding step, which is why it reads as a token. */
.topbar::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgb(from var(--void-900) r g b / 0.8) 0%,
    rgb(from var(--void-900) r g b / 0.8) 56%,
    rgb(from var(--void-900) r g b / 0) 100%
  );
}

.brand {
  display: inline-flex;
  align-items: center;
  color: var(--foreground);
  text-decoration: none;
  border-radius: var(--radius);
}
/* fill: currentColor is what lets the nav colour drive the mark. */
.logo { display: block; height: 16px; width: auto; fill: currentColor; }

.actions { display: flex; align-items: center; gap: 16px; }

/* --- buttons -------------------------------------------------------------
   The node draws a 6px corner; --radius is 0.25rem (4px), and the token wins.
   Closing the 2px is a decision about the token's scale, made once for every
   surface, never a nudge on one button. */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .12s ease, border-color .12s ease, filter .12s ease;
}

/* The node colours this text with --secondary-foreground, which in this palette
   is signal-100 — a pale blue that would tint "Sign In" against a near-white
   "Join Waitlist". The house pattern (ufo-components.html) uses --foreground for an
   outline button, which is both correct here and what the artboard shows. */
.btn-outline { background: transparent; color: var(--foreground); border-color: var(--border); }
.btn-outline:hover { background: var(--state-hover); }

.btn-primary { background: var(--primary); color: var(--primary-foreground); }
.btn-primary:hover { filter: brightness(.94); }

.btn-icon { display: block; width: 16px; height: 16px; flex: none; fill: currentColor; }

.brand:focus-visible, .btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

/* --- headline ------------------------------------------------------------
   The node puts the headline 142px down a 1024-wide artboard at 90px. Both
   scale on the same ratio (142/1024 = 13.867vw, 90/1024 = 8.789vw), so at
   exactly 1024px wide this renders on the artboard's numbers and stays in
   proportion either side of it. */

.hero {
  position: relative;
  z-index: 1;
  padding: clamp(88px, 13.867vw, 142px) 24px 0;
}

.display {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(40px, 8.789vw, 90px);
  line-height: normal;
  text-align: center;
  color: var(--foreground);
}

.go { color: var(--signal-500); }

/* --- narrow -------------------------------------------------------------- */

@media (max-width: 640px) {
  .topbar { height: 64px; padding: 12px 16px; gap: 12px; }
  .actions { gap: 8px; }
  .btn { height: 36px; padding: 8px 12px; font-size: 13px; }
  .hero { padding-left: 16px; padding-right: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
