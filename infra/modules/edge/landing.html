<!doctype html>
<!-- Terminal interface: curl https://__HOSTNAME__ -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="__HOSTNAME__ is a terminal-native site. Open it with curl https://__HOSTNAME__" />
<title>ufo</title>
<style>
  /* The craft's shimmer palette — the only colors used. */
  :root{
    --hull:#8b8fb8; --gold:#ffd35e; --gold-dim:#b8923e; --party:#ff9ee6;
    --gray:#595d80; --green:#9dffb0; --cyan:#8be9ff; --amber:#ffb86b;
    --violet:#c5a6ff; --ice:#b8ecff; --rust:#e0a06a; --spark:#fff4c2;
    --mono:"DejaVu Sans Mono","SFMono-Regular",ui-monospace,"Cascadia Code",
           "Source Code Pro",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#000;
    min-height:100vh;
    overflow:hidden;          /* no scrollbars as the craft roams */
  }
  .craft{
    position:fixed;
    left:0; top:0;
    will-change:transform, opacity;  /* moved + faded in JS */
    font-family:var(--mono);
    font-size:clamp(13px,3.75vw,22px);
    line-height:1.16;
    white-space:pre;
    text-align:left;
    color:var(--hull);
    text-shadow:0 0 12px currentColor;
    user-select:none;
    pointer-events:none;       /* the fleet is decoration; the join sits above it */
  }
  .craft .hull {color:var(--hull); text-shadow:0 0 6px #8b8fb855}
  .craft .lit  {color:var(--gold); text-shadow:0 0 10px var(--gold)}
  .craft .spark{color:var(--spark);text-shadow:0 0 12px var(--spark)}
  .craft .c    {color:var(--c); text-shadow:0 0 10px var(--c)}
  @media (prefers-reduced-motion: reduce){
    .craft{text-shadow:0 0 6px currentColor}
  }

  /* The panel: the curl card's join, rendered for a browser — always in the layout, at the foot
     of the sky. Smoked glass, so a craft drifting behind it is dimmed rather than swallowed; the
     black halo on every line keeps the copy readable while that light passes. */
  .panel{
    --gap:clamp(20px,5vh,48px);
    --keyboard:0px;           /* an open keyboard's bite out of the viewport, measured in JS */
    --visible:100dvh;         /* and the height left over, which is what the block is capped to */
    --line:1.6;               /* the block's own line; the ack strip below reserves three of them */
    position:fixed; left:50%; bottom:calc(var(--gap) + var(--keyboard));
    transform:translateX(-50%);
    width:min(92vw,30rem);
    max-height:calc(var(--visible) - 2*var(--gap));
    overflow:auto;
    padding:clamp(18px,4vw,28px);
    border:1px solid var(--hull);
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(3px) saturate(180%);
    -webkit-backdrop-filter:blur(3px) saturate(180%);
    box-shadow:0 0 32px #8b8fb844;
    font-family:var(--mono); font-size:14px; line-height:var(--line);
    color:var(--hull);
    text-shadow:0 0 3px #000, 0 0 6px #000, 0 0 12px #000;
  }
  .panel .head{margin:0 0 14px; letter-spacing:.08em}
  .panel .field{display:flex; align-items:center; gap:.6ch; margin:0}
  .panel input{
    flex:1; min-width:0;
    padding:6px 0;
    background:none; border:0; border-bottom:1px solid var(--gray);
    font:inherit; color:var(--ice);
    text-shadow:inherit;      /* a form control prints with no shadow of its own; the placeholder
                                 takes this one from the entry, so it needs no rule of its own */
  }
  .panel input::placeholder{color:var(--gray)}
  .panel input:focus{outline:none; border-bottom-color:var(--gold)}
  .panel input:disabled{color:var(--gray); border-bottom-style:dashed}
  .panel .go{
    margin-top:18px; padding:7px 16px;
    background:none; border:1px solid var(--gray);
    font:inherit; letter-spacing:.08em; color:var(--hull);
    text-shadow:inherit;
    cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  .panel .go:enabled:hover,.panel .go:focus-visible{border-color:var(--gold); color:var(--gold)}
  .panel .go:disabled{opacity:.45; cursor:default}
  .panel .ack{
    /* Three lines: what the worker's ack wraps to at 320px, the narrowest phone, so a landed join
       prints into room the block already has. Counted in the block's own line, so the closer lines
       a phone sets reserve those three and no empty fraction of a fourth. */
    margin:16px 0 0; min-height:calc(3 * var(--line) * 1em);
    white-space:pre-wrap; color:var(--green);
    text-shadow:0 0 3px #000, 0 0 6px #000, 0 0 10px #9dffb055;
  }
  .panel .ack.bad{color:var(--rust); text-shadow:0 0 3px #000, 0 0 6px #000}

  /* iOS Safari zooms the page in whenever a focused control's text computes under 16px, which
     blows the block up and clips it the moment the entry is tapped. Keyed on the pointer rather
     than the width because a phone in landscape is a wide viewport that still zooms, and because
     the desktop panel keeps its 14px terminal size. Suppressing the zoom in the viewport tag
     instead would cost every visitor pinch zoom. */
  @media (pointer: coarse){
    .panel{font-size:16px}
    .panel input,.panel .go{min-height:44px}   /* a fingertip's worth of target */
  }

  /* A phone is where the block has the least sky to stand in, so it rests at 107.59px there: the
     entry and the button ride one row, the lines and the padding are a hair, and an empty strip
     reserves nothing — the three lines the rule above holds for the ack are two thirds of what a
     phone would otherwise stand in empty glass before a member has typed anything.

     The strip takes those three lines the moment anything prints in it, and the first print is
     `Joining…`, which the submit handler prints under the press itself. So the block's one growth
     to 172.39px lands with the press that caused it, and everything that prints after — the ack off
     the wire, either refusal, a resubmit from any of them — prints into room the block already has
     and moves no control under a thumb.

     Keyed on the pointer for the same reason the rule above is, and nothing here is bought from
     the fingertip: the type stays 16px and the targets 44px. */
  @media (pointer: coarse){
    .panel{
      --line:1.35;
      display:flex; flex-wrap:wrap; align-items:center;
      column-gap:.8ch; row-gap:8px;
      padding:12px 14px;
    }
    .panel .head{flex:1 0 100%; margin:0}
    .panel .field{flex:1; min-width:0}   /* the entry takes the row, the button what it needs */
    .panel .go{margin-top:0}
    .panel .ack{flex:1 0 100%; margin:0}
    .panel .ack:empty{min-height:0}     /* nothing printed reserves nothing */
  }
</style>
</head>
<body>
  <div id="sky" aria-hidden="true"></div>
  <form id="join" class="panel" action="/waitlist" method="post" aria-labelledby="join-head">
    <p class="head" id="join-head">Join Waitlist</p>
    <p class="field">
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="email" name="email" type="email" required maxlength="254"
             placeholder="email@work.com" autocomplete="email" spellcheck="false"
             aria-label="Email address" />
    </p>
    <button id="go" class="go" type="submit">submit</button>
    <p id="ack" class="ack" role="status"></p>
  </form>
  <span hidden aria-hidden="true">Terminal interface: curl https://__HOSTNAME__</span>

<script>
"use strict";
console.info("Terminal interface: curl https://__HOSTNAME__");
/* ═══════════════════════════════════════════════════════════════════════
   ufo morph — JavaScript port of the Python renderer, flown as a fleet:
   one craft aloft per workspace (the worker substitutes the count below).

   A craft is built from a grammar of parts (domes, struts, cores, rims,
   fins, antennae, beams). Thirteen SILHOUETTE FAMILIES cover the recognized
   UFO-sighting taxonomy — the disc family (saucer, ring, bell, mother, orb,
   saturn) plus triangle/delta, cigar/cylinder, tic-tac, egg/oval, diamond,
   and the exotic needle & manta. Each distributes the same fixed canvas
   (19×5) into a different shape. Morphing eases same-family craft slot by
   slot, and CROSS-DISSOLVES between families at the cell level with an even,
   percentile-paced wipe (no popping).

   Cells are [glyph, role] where role picks a color:
     'hull'  → linework        'a'/'b' → the two shimmer phases
     'spark' → dissolve edge    ''      → blank
   Lit cells also carry an explicit color string in role 'lit:<hex>'.
   ═══════════════════════════════════════════════════════════════════════ */

const CSS = getComputedStyle(document.documentElement);
const COL = n => CSS.getPropertyValue(n).trim();
const C = {
  hull: COL('--hull'), gold: COL('--gold'), goldDim: COL('--gold-dim'),
  party: COL('--party'), gray: COL('--gray'), green: COL('--green'),
  cyan: COL('--cyan'), amber: COL('--amber'), violet: COL('--violet'),
  ice: COL('--ice'), rust: COL('--rust'), spark: COL('--spark'),
};

// ── part pools (verbatim from the Python) ───────────────────────────────
const DOMES = ["╭─=─╮","╒═══╕","╭───╮","╭◠◠◠╮","▟███▙","╭╌◊╌╮",
               "⌒⌒⌒⌒⌒","╓─┰─╖","◜◠◠◠◝","╭─▣─╮","╱◠◠◠╲","▁▄█▄▁"];
const CAPS  = ["╭▾╮","◜●◝","╱◊╲","┌╨┐","▗▄▖","╭⊙╮"];
const STRUTS= [["╾══╡","╞══╼"],["╾─═[","]═─╼"],["╺═╡(",")╞═╸"],
               ["╞(",")╡"],["╺══╱","╲══╸"],["◄═╣","╠═►"],
               ["«┤","├»"],["╾╌┤","├╌╼"],["⟨═","═⟩"],["┣━","━┫"]];
const CORES = [["═",null],["┄",null],["▌",null],["─",null],["┆",null],
               ["•",null],["◇",null],["▪",null],["≡",null],
               [null,"<=>"],[null,"▐▌"],[null,"oOo"],[null,"·∆·"],
               [null,"[#]"],[null,"◉◉◉"]];
const RIM_GLYPHS = ["┄","─","═","~","•","◦","˅","╍","‗","∿"];
const FINS = [["",""],["╲","╱"],["◣","◢"],["╚","╝"],["⟍","⟋"],
              ["◞","◟"],["┕","┙"],["ʌ","ʌ"]];
const ANTENNAE = ["","╵","│","┊","╿","⌇","✢","☍"];
const BEAMS = ["","' . '",".  '  .","' '"," : : ","˙ ✦ ˙",
               "\\ | /"," v v ","  ¦  ","·˙·˙·"," ▽ ▽ ","˖ ⋆ ˖"];
// shimmer schemes as [colorA, colorB]
const LIGHT_SCHEMES = [
  [C.gold,C.goldDim],[C.gold,C.gold],[C.goldDim,C.gold],
  [C.green,C.goldDim],[C.cyan,C.gold],[C.amber,C.goldDim],
  [C.party,C.gold],[C.gray,C.gray],[C.violet,C.ice],
  [C.ice,C.cyan],[C.rust,C.amber],[C.party,C.violet],
];
const CROWNS = [["",null],["?",C.gold],["!",C.gold],["✦",C.gold],
                ["°",C.cyan],["*",C.party],["◌",C.amber]];

const FAMILIES = ["saucer","orb","ring","mother","needle","bell","manta",
                  "triangle","cigar","tictac","saturn","egg","diamond"];
const CANVAS_W = 19, CANVAS_H = 5;

// ── cell helpers ────────────────────────────────────────────────────────
// A "row" is an array of cells: {ch, color}. color is a hex string or 'hull'.
const hull = ch => ({ch, color:'hull'});
const lit  = (ch, col) => ({ch, color:col});
const blank = () => ({ch:' ', color:''});

function strToCells(str, color){ return [...str].map(ch => ({ch, color})); }

// chips: alternating two-color run of `glyph`, phase-shifted
function chips(n, glyph, scheme, phase){
  const out=[];
  for(let i=0;i<n;i++) out.push(lit(glyph, scheme[(i+phase)&1]));
  return out;
}
// a fixed label, single phase color
function litText(text, scheme, phase){ return strToCells(text, scheme[phase&1]); }
// underglow pattern: spaces stay blank, glyphs are phase-lit
function glow(pattern, scheme, phase){
  const trimmed = pattern.replace(/^ +| +$/g,'');
  const out=[]; let idx=0;
  for(const ch of trimmed){
    if(ch===' ') out.push(blank());
    else { out.push(lit(ch, scheme[(idx+phase)&1])); idx++; }
  }
  return out;
}
const odd = n => (n%2===1)? n : n+1;
const width = row => row.length;

// ── genome ──────────────────────────────────────────────────────────────
function randint(rng,a,b){ return a + Math.floor(rng()*(b-a+1)); }
function choice(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }

function randomCraft(rng){
  return {
    family: randint(rng,0,FAMILIES.length-1),
    dome:   randint(rng,0,DOMES.length-1),
    cap:    randint(rng,0,CAPS.length-1),
    strut:  randint(rng,0,STRUTS.length-1),
    core:   randint(rng,0,CORES.length-1),
    rim:    randint(rng,0,RIM_GLYPHS.length-1),
    fin:    randint(rng,0,FINS.length-1),
    ant:    randint(rng,0,ANTENNAE.length-1),
    beam:   randint(rng,0,BEAMS.length-1),
    crown:  randint(rng,0,CROWNS.length-1),
    lights: randint(rng,0,LIGHT_SCHEMES.length-1),
    width:  choice(rng,[3,5,7]),
    phase:  randint(rng,0,1),
  };
}

// ── shared sub-parts ────────────────────────────────────────────────────
function mastRow(c){
  const ant = ANTENNAE[c.ant], [crownCh,crownCol] = CROWNS[c.crown];
  if(!ant && !crownCh) return null;
  if(crownCh) return [ lit(crownCh, crownCol || C.gold) ];
  return [ hull(ant) ];
}
function hullRow(c, scheme, coreN){
  const [ls,rs] = STRUTS[c.strut];
  const [glyph,text] = CORES[c.core];
  let body;
  if(text!==null){
    const label = (text.length%2)? text : text+" ";
    body = litText(label, scheme, c.phase);
  } else {
    body = chips(coreN, glyph, scheme, c.phase);
  }
  const [lf,rf] = FINS[c.fin];
  const row = [];
  if(lf) row.push(hull(lf));
  row.push(...strToCells(ls,'hull'));
  row.push(blank());
  row.push(...body);
  row.push(blank());
  row.push(...strToCells(rs,'hull'));
  if(rf) row.push(hull(rf));
  return row;
}
function rimRow(c, scheme, rimN){
  return [ hull('╰'), ...chips(rimN, RIM_GLYPHS[c.rim], scheme, c.phase), hull('╯') ];
}

// ── silhouette builders ─────────────────────────────────────────────────
function buildSaucer(c, scheme){
  const coreN = odd(c.width);
  const rows = [];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(DOMES[c.dome],'hull'));
  rows.push(hullRow(c, scheme, coreN));
  rows.push(rimRow(c, scheme, odd(Math.max(3, coreN-2))));
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildOrb(c, scheme){
  const [glyph,text] = CORES[c.core];
  let body, bodyW;
  if(text!==null){ const label=(text.length%2)?text:text+" "; body=litText(label,scheme,c.phase); bodyW=label.length; }
  else { body=chips(3, glyph, scheme, c.phase); bodyW=3; }
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(CAPS[c.cap],'hull'));
  rows.push([ hull('('), hull('('), ...body, hull(')'), hull(')') ]);
  rows.push([ hull('╰'), ...chips(bodyW, RIM_GLYPHS[c.rim], scheme, c.phase), hull('╯') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildRing(c, scheme){
  const coreN = odd(c.width);
  const [ls,rs] = STRUTS[c.strut];
  const half = Math.max(1, (coreN-1)>>1);
  const arcN = half*2+1;
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push([ hull('◜'), ...chips(arcN,'═',scheme,c.phase), hull('◝') ]);
  rows.push([ ...strToCells(ls,'hull'),
              ...chips(half, RIM_GLYPHS[c.rim], scheme, c.phase),
              blank(),
              ...chips(half, RIM_GLYPHS[c.rim], scheme, c.phase+1),
              ...strToCells(rs,'hull') ]);
  rows.push([ hull('◟'), ...chips(arcN,'═',scheme,c.phase+1), hull('◞') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildMother(c, scheme){
  const coreN = odd(c.width);
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells("▟▆▆▆▙",'hull'));
  rows.push(hullRow(c, scheme, coreN));
  const bandN = odd(coreN+2);
  rows.push([ hull('╘'), ...chips(bandN, RIM_GLYPHS[c.rim], scheme, c.phase+1), hull('╛') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildNeedle(c, scheme){
  const [glyph,text] = CORES[c.core];
  const g = text!==null ? "▐" : glyph;
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(CAPS[c.cap],'hull'));
  rows.push([ hull('┤'), lit(g, scheme[c.phase&1]), hull('├') ]);
  rows.push([ hull('┤'), lit(g, scheme[(c.phase+1)&1]), hull('├') ]);
  rows.push([ lit('▼', scheme[c.phase&1]) ]);
  return rows;
}
function buildBell(c, scheme){
  const coreN = odd(c.width);
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(DOMES[c.dome],'hull'));
  const g0 = CORES[c.core][0] || '═';
  rows.push([ hull('╲'), ...chips(coreN, g0, scheme, c.phase), hull('╱') ]);
  const inner = Math.max(1, coreN-2);
  rows.push([ hull('╲'), ...chips(inner, RIM_GLYPHS[c.rim], scheme, c.phase+1), hull('╱') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildManta(c, scheme){
  const coreN = odd(c.width);
  const [glyph,text] = CORES[c.core];
  let body;
  if(text!==null && text.length%2) body = litText(text, scheme, c.phase);
  else body = chips(coreN, glyph || '▬', scheme, c.phase);
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(DOMES[c.dome],'hull'));
  // symmetric swept wing band (◜══╣ ... ╠══◝) so it shares the body axis;
  // the "banked" character comes from the fin glyphs, not a lopsided wing.
  rows.push([ ...strToCells('◜══╣','hull'), blank(), ...body, blank(), ...strToCells('╠══◝','hull') ]);
  rows.push([ hull('╰'), ...chips(coreN, RIM_GLYPHS[c.rim], scheme, c.phase), hull('╯') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildTriangle(c, scheme){
  // Delta / chevron — #2 most-reported shape. Wide lit base tapering to an
  // apex, with corner lights. Three rows of increasing width + a beam.
  const w = odd(c.width);                 // base width 3/5/7
  const g = CORES[c.core][0] || '═';
  const rows=[];
  const [crownCh,crownCol] = CROWNS[c.crown];
  // apex: a single bright corner light (or hull tip)
  rows.push([ crownCh ? lit(crownCh, crownCol||C.gold) : hull('▲') ]);
  // middle band: a short lit run flanked by the sloping edges
  const midN = Math.max(1, w-4>0? w-4 : 1);
  rows.push([ hull('╱'), ...chips(midN, g, scheme, c.phase), hull('╲') ]);
  // base: full lit underside between two corner lights
  rows.push([ lit('◆', scheme[c.phase&1]),
              ...chips(w, RIM_GLYPHS[c.rim], scheme, c.phase),
              lit('◆', scheme[(c.phase+1)&1]) ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildCigar(c, scheme){
  // Horizontal cylinder / cigar / classic mothership. A long lit hull with a
  // row of windows, capped by rounded ends. Tapers slightly top & bottom.
  const n = (c.width===3)?7:(c.width===5)?9:11;   // long body, odd
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  // upper hull edge
  rows.push([ hull('╭'), ...chips(n,'─',scheme,c.phase), hull('╮') ]);
  // window band: alternating lit "portholes" inside the tube
  const winGlyph = CORES[c.core][0] || 'o';
  rows.push([ hull('('), blank(), ...chips(n-2, winGlyph, scheme, c.phase), blank(), hull(')') ]);
  // lower hull edge
  rows.push([ hull('╰'), ...chips(n, RIM_GLYPHS[c.rim], scheme, c.phase+1), hull('╯') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildTictac(c, scheme){
  // Nimitz "Tic-Tac": small, smooth, featureless oblong capsule. Deliberately
  // plain — its whole character is the absence of detail.
  const n = (c.width===7)?7:5;            // body length, odd
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  // caps span the same width as the body row (n + 2 brackets) so every row
  // shares one axis. rounded top/bottom via ▁ / ▔.
  rows.push([ hull(' '), ...strToCells('▁'.repeat(n),'hull'), hull(' ') ]);
  rows.push([ hull('('), ...chips(n, CORES[c.core][0]||' ', scheme, c.phase), hull(')') ]);
  rows.push([ hull(' '), ...strToCells('▔'.repeat(n),'hull'), hull(' ') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildSaturn(c, scheme){
  // Saturn / hat: a domed disc bisected by a distinct equatorial brim that
  // juts out past the body on both sides — the Adamski-adjacent classic.
  const coreN = odd(c.width);
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  rows.push(strToCells(DOMES[c.dome],'hull'));
  // the brim: extends 2 cells beyond the body each side, lit
  const brim = chips(coreN+4, RIM_GLYPHS[c.rim], scheme, c.phase);
  rows.push([ hull('◄'), ...brim, hull('►') ]);
  // body underside, narrower
  rows.push([ hull('╰'), ...chips(coreN, CORES[c.core][0]||'═', scheme, c.phase+1), hull('╯') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildEgg(c, scheme){
  // Egg / oval / teardrop / lightbulb: a rounded body, wider at the base,
  // tapering to a soft top.
  const coreN = odd(c.width);
  const g = CORES[c.core][0] || '•';
  const rows=[];
  const m = mastRow(c); if(m) rows.push(m);
  const topN = Math.max(1, coreN-2);
  rows.push([ hull('╭'), ...chips(topN, g, scheme, c.phase), hull('╮') ]);
  rows.push([ hull('('), ...chips(coreN, g, scheme, c.phase), hull(')') ]);
  rows.push([ hull('╰'), ...chips(coreN, RIM_GLYPHS[c.rim], scheme, c.phase+1), hull('╯') ]);
  if(BEAMS[c.beam]) rows.push(glow(BEAMS[c.beam], scheme, c.phase));
  return rows;
}
function buildDiamond(c, scheme){
  // Diamond / rhombus: a four-sided lozenge that widens to the middle then
  // narrows again — a rarer but chart-standard geometric form.
  const w = odd(c.width);
  const g = CORES[c.core][0] || '◇';
  const mid = w;                 // widest row
  const narrow = Math.max(1, w-2);
  const rows=[];
  const [crownCh,crownCol] = CROWNS[c.crown];
  rows.push([ crownCh ? lit(crownCh, crownCol||C.gold) : lit('◆', scheme[c.phase&1]) ]);
  rows.push([ hull('╱'), ...chips(narrow, g, scheme, c.phase), hull('╲') ]);
  rows.push([ hull('╲'), ...chips(narrow, RIM_GLYPHS[c.rim], scheme, c.phase+1), hull('╱') ]);
  rows.push([ lit('▾', scheme[c.phase&1]) ]);
  return rows;
}

const BUILDERS = {saucer:buildSaucer,orb:buildOrb,ring:buildRing,
                  mother:buildMother,needle:buildNeedle,bell:buildBell,manta:buildManta,
                  triangle:buildTriangle,cigar:buildCigar,tictac:buildTictac,
                  saturn:buildSaturn,egg:buildEgg,diamond:buildDiamond};

// ── compose into the fixed canvas (centered H & V) ──────────────────────
function buildRows(c){ return BUILDERS[FAMILIES[c.family]](c, LIGHT_SCHEMES[c.lights]); }

function compose(rows){
  const placed = rows.map(row=>{
    const w = width(row);
    const lead = Math.max(0, Math.round((CANVAS_W - w)/2));
    const out = [];
    for(let i=0;i<lead;i++) out.push(blank());
    for(const cell of row) out.push(cell);
    while(out.length < CANVAS_W) out.push(blank());
    return out.slice(0, CANVAS_W);
  });
  const pad = CANVAS_H - placed.length;
  const top = Math.max(0, pad>>1), bottom = Math.max(0, pad-top);
  const blankRow = () => Array.from({length:CANVAS_W}, blank);
  const grid = [];
  for(let i=0;i<top;i++) grid.push(blankRow());
  for(const r of placed.slice(0,CANVAS_H)) grid.push(r);
  for(let i=0;i<bottom;i++) grid.push(blankRow());
  return grid.slice(0,CANVAS_H);
}
// render → a CANVAS_H × CANVAS_W grid of cells
function renderGrid(c){ return compose(buildRows(c)); }

// ── morph ───────────────────────────────────────────────────────────────
function smoothstep(t){ return t*t*(3-2*t); }
function easeInt(a,b,t){ return Math.round(a + (b-a)*smoothstep(t)); }

const SLOTS = ["core","cap","rim","beam","fin","strut","ant","dome","crown","lights"];
function easeGenome(a,b,t,k){
  const out = {...a};
  let w = easeInt(a.width,b.width,t); if((w&1)===0) w++; out.width=w;
  out.phase = (a.phase + k) & 1;
  out.family = a.family;
  const n = SLOTS.length;
  for(let i=0;i<n;i++){
    const thresh = (i+1)/(n+1);
    out[SLOTS[i]] = (t>=thresh? b:a)[SLOTS[i]];
  }
  return out;
}

// per-cell dissolve rank → even reveal via precomputed percentile mapping
function dissolveRank(r,col){
  const h = ((r*7 + col*13) % 17) / 17;
  const diag = (r+col)/(CANVAS_H+CANVAS_W);
  return 0.55*diag + 0.45*h;
}
const RANK_GRID = Array.from({length:CANVAS_H},(_,r)=>
  Array.from({length:CANVAS_W},(_,col)=>dissolveRank(r,col)));
const RANKS_SORTED = RANK_GRID.flat().slice().sort((x,y)=>x-y);
function thresholdFor(progress){
  progress = Math.min(1,Math.max(0,progress));
  const n = RANKS_SORTED.length, idx = progress*n, lo = Math.floor(idx);
  if(lo>=n) return RANKS_SORTED[n-1]+1e-6;
  if(lo===0) return RANKS_SORTED[0]-1e-6;
  const frac = idx-lo;
  return RANKS_SORTED[lo-1] + (RANKS_SORTED[lo]-RANKS_SORTED[lo-1])*frac;
}
const SPARK = "·˙·⋆˙";
const BAND = (RANKS_SORTED[RANKS_SORTED.length-1]-RANKS_SORTED[0]) /
             Math.max(14, RANKS_SORTED.length*0.18);

function dissolveGrid(srcGrid, dstGrid, progress){
  const thresh = thresholdFor(progress);
  const out = [];
  for(let r=0;r<CANVAS_H;r++){
    const line=[];
    for(let col=0;col<CANVAS_W;col++){
      const rank = RANK_GRID[r][col];
      const s = srcGrid[r][col], d = dstGrid[r][col];
      if(Math.abs(rank-thresh) < BAND && (s.ch!==' '||d.ch!==' ')){
        const g = SPARK[(r+col+Math.floor(progress*11))%SPARK.length];
        line.push({ch:g, color:'spark'});
      } else if(rank < thresh){
        line.push(d);
      } else {
        line.push(s);
      }
    }
    out.push(line);
  }
  return out;
}

// produce a sequence of grids morphing a→b
function morphFrames(a,b,steps,transition=0.6){
  if(steps<=1) return [renderGrid(b)];
  if(a.family===b.family){
    const out=[];
    for(let k=0;k<steps;k++) out.push(renderGrid(easeGenome(a,b,k/(steps-1),k)));
    return out;
  }
  const diss = Math.max(4, Math.round(steps*transition));
  const pre = Math.max(1, (steps-diss)>>1);
  const post = Math.max(1, steps-diss-pre);
  const frames=[];
  for(let k=0;k<pre;k++) frames.push(renderGrid({...a, phase:(a.phase+k)&1}));
  const src = renderGrid({...a, phase:(a.phase+pre)&1});
  const dst = renderGrid(b);
  for(let j=0;j<diss;j++) frames.push(dissolveGrid(src,dst,(j+1)/diss));
  for(let k=0;k<post;k++) frames.push(renderGrid({...b, phase:(b.phase+k)&1}));
  return frames;
}

// ── DOM rendering: grid → spans ─────────────────────────────────────────
function colorFor(cell){
  if(cell.color==='hull') return null;        // use .hull class
  if(cell.color==='spark') return 'spark';
  return cell.color;                          // explicit hex
}
function gridToHTML(grid){
  let html='';
  for(let r=0;r<grid.length;r++){
    for(const cell of grid[r]){
      const ch = cell.ch===' ' ? ' ' : escapeHTML(cell.ch);
      if(cell.ch===' ' || cell.color===''){ html += ch; continue; }
      if(cell.color==='hull'){ html += `<span class="hull">${ch}</span>`; }
      else if(cell.color==='spark'){ html += `<span class="spark">${ch}</span>`; }
      else { html += `<span class="c" style="--c:${cell.color}">${ch}</span>`; }
    }
    if(r<grid.length-1) html += '\n';
  }
  return html;
}
function escapeHTML(s){ return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// ── mulberry32 PRNG (deterministic, seedable) ───────────────────────────
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

// ═══════════════════════════════════════════════════════════════════════
// the fleet: one craft aloft per workspace, each on its own staggered
// tour — a craft holds its form between morphs, and a collision re-forms
// both craft on the spot
// ═══════════════════════════════════════════════════════════════════════
const FLEET_N = __FLEET_N__;
const MAX_FLEET = 100;

const sky = document.getElementById('sky');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── the panel: the same join the curl card offers, always on the page ───
const join = document.getElementById('join');
const email = document.getElementById('email');
const go = document.getElementById('go');
const ack = document.getElementById('ack');

// The panel's own scroll the copy that printed needs to stand inside the port: where the copy ends
// inside the panel's content, less the port's height. Whole pixels, because the assignment is rounded
// to one and a need rounded down leaves the last line its own fraction short: a raw 48.31 is kept as
// 48 and reads 18.69 of 19px, where 49 reads all 19. Read from the content's top and not from the
// port's, so a scroll the member made themselves leaves it where it was — what a resize has to be
// judged on is the room the copy has, not where the copy was last left standing. Nothing printed
// needs nothing.
function scrollPrintedNeeds(){
  const printed = document.createRange();
  printed.selectNodeContents(ack);
  const lastLine = [...printed.getClientRects()].pop();
  if(!lastLine) return 0;
  const clipTop = join.getBoundingClientRect().top + join.clientTop;
  return Math.ceil(lastLine.bottom + join.scrollTop - clipTop - join.clientHeight);
}

let needsAnswered = 0;

// The block stands at the foot of the sky and caps its height there, so on a window shorter than its
// copy the line that lands last is the line the cap holds back: without this the ack renders below
// the scroll port and a member reads half a sentence. What stands in the port is the copy that
// printed and not the strip holding it — standing the whole box in would spend up to two empty lines
// of the entry's and the button's room, which every path but a landed join leaves a member to act in.
// The copy's own need is the least scroll that reads it whole, so it is also the most room left to the
// controls above it, and wherever the port can hold the copy and those controls together this stands
// both whole. Under 136px of window on a coarse pointer it cannot hold both: at 568x130 the port
// measures 88px against the 93.6px from the entry's top to the copy's foot, and there the room goes to
// the answer the member has just asked for.
//
// The panel stands where the print needs it, and not merely no further back than that: two of the four
// paths hand the button back, so a member is free to wheel to the panel's foot and press again, and an
// ack printing above them there is one they never see.
function report(message, bad){
  ack.textContent = message;
  ack.classList.toggle('bad', Boolean(bad));
  needsAnswered = scrollPrintedNeeds();
  join.scrollTop = needsAnswered;
}

// The cap is derived from the window's own height and the copy's wrapping from its width, so the room
// a printed line has is not settled when it prints. A URL bar coming back, a turned phone or a window
// edge dragged up walks the port's bottom edge up past copy that already landed; a window edge
// dragged in rewraps that copy onto another line under an edge that never moved. Either way the
// member who just joined loses their number to empty strip, and either way the room is what changed
// and not the copy, so the same roll answers it — but only where the copy lost room. A resize that
// hands port height back, or one that rewraps nothing, has taken nothing away, and rolling then would
// throw away a scroll the member made themselves: the head they scrolled up to read snaps back out of
// the port under their hand.
//
// A keyboard takes the same room the same way and the window fires no resize for it, so the roll is
// named for the other place that moves the port's height — the cap the block writes below, which is
// where both a keyboard and a window resize are answered — and nowhere else.
const rollPrintedIntoPort = () => {
  const needs = scrollPrintedNeeds();
  const lost = needs > needsAnswered;
  needsAnswered = needs;
  if(lost && needs > join.scrollTop) join.scrollTop = needs;
};

join.addEventListener('submit', async e => {
  e.preventDefault();
  go.disabled = true;
  report('Joining…');
  // One try encloses the whole turn — reading the body can fail after the headers land, and
  // every path out of here either ends on an ack or hands the button back.
  try {
    const reply = await fetch(join.action, {    // the form declares the route; this posts it
      method: 'POST',
      headers: {'content-type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({email: email.value}),
    });
    if(!reply.ok){
      report('That email address was not accepted.', true);
      go.disabled = false;
      return;
    }
    report((await reply.text()).trim());
    email.disabled = true;    // the entry is recorded; there is nothing left to send
  } catch {
    report('Request failed. Try again.', true);
    go.disabled = false;
  }
});

// A software keyboard shrinks the VISUAL viewport and leaves the LAYOUT viewport alone, and both
// position:fixed and dvh resolve against the layout viewport, so the visual viewport is the only
// reading of what a member can see. It reports both halves of the answer: the strip the keyboard
// covers, which the panel's inset lifts it clear of, and the height still visible, which is what the
// panel caps itself to. Browsers without the API keep the declared 0px and 100dvh and the plain
// bottom anchoring.
//
// The covered strip and a pinch zoom are separate facts, and every reading that crosses between the
// two viewports crosses through the same scale in the same direction. A zoom divides the visual
// viewport's height by its scale, so multiplying it back gives the strip the screen shows in the
// layout viewport's own pixels — the frame a fixed block is laid out in and max-height resolves in.
// The zoom cancels out of the subtraction, leaving the keyboard's own bite at any scale and in
// either order, and the cap is taken from that same strip. The subtraction's own arithmetic leaves
// hundred-thousandths of a pixel where a keyboard leaves hundreds of whole ones, so the bite is
// rounded where it is read as well as where it is written: a hundred-thousandth is nothing covered.
//
// offsetTop stays in the bite. Safari pans the visual viewport to bring a focused entry into view,
// and a fixed block is painted with the pan, so the inset is measured to the visible strip's bottom
// edge and the block comes up with the pan.
//
// The cap answers what is covered, whatever the scale: the block's head stands on the strip a member
// sees, and the panel's own scroll reaches the copy below it. With nothing covered the scale alone
// decides — above the deadband the member is zoomed in and reading, so the declared 100dvh stands
// and their own pan is what moves the page; inside it a hair above 1 is the browser's own slack and
// the page keeps measuring.
const viewport = window.visualViewport;   // named off window: a browser without it has no binding
const PINCHED = 1.01;                     // above this the page is zoomed, not merely covered
if(viewport){
  const liftClearOfKeyboard = () => {
    const shown = viewport.height * viewport.scale;
    const covered = Math.max(0, Math.round((innerHeight - (shown + viewport.offsetTop)) * 100) / 100);
    join.style.setProperty('--keyboard', covered.toFixed(2) + 'px');
    if(covered > 0 || viewport.scale <= PINCHED){
      join.style.setProperty('--visible', shown.toFixed(2) + 'px');
    } else {
      join.style.removeProperty('--visible');   // the declared 100dvh stands: nothing is covered
    }
    // The cap has just moved, and the window fired no resize for it: a keyboard walks the port's
    // bottom edge up past copy that has already printed exactly as a window edge dragged up does,
    // and the strip left over is the same scarce room the printed copy is measured against. So the
    // roll runs here too, under the same gate — a keyboard closing, or a zoom handing the cap back,
    // takes no room away and leaves a member's own scroll where it is.
    rollPrintedIntoPort();
  };
  viewport.addEventListener('resize', liftClearOfKeyboard, {passive:true});
  viewport.addEventListener('scroll', liftClearOfKeyboard, {passive:true});
  // The window's own resize arrives first and the visual viewport's second, so the cap is written
  // here as well: the roll at the end of it measures the printed copy against the window the page is
  // in now — 160px of port at 568x200 — and not the one it just left, whose cap stood 50px taller.
  addEventListener('resize', liftClearOfKeyboard);
  liftClearOfKeyboard();
} else {
  // Nothing measures a keyboard here and the declared 100dvh follows the window itself, so a resize
  // leaves the roll alone to answer the room the window took.
  addEventListener('resize', rollPrintedIntoPort);
}

const STEPS_EACH = 12;
const FPS = reduceMotion ? 2.2 : 7;
const BASE_SPEED = reduceMotion ? 22 : 70;   // px/sec drift
const DRAW_RADIUS = 220;                      // how near the cursor must be to be noticed
const DRAW_FORCE  = 240;                       // curiosity: enough to gather, never to swarm
const MAX_SPEED   = 300;                      // cap so a fast mouse can't fling it
const SEP_FORCE   = 900;                      // craft keep polite formation distance
const FADE_OUT_T  = 0.7;                       // seconds to fade away
const FADE_IN_T   = 0.9;                       // seconds to materialize back
const VISIBLE_MIN = reduceMotion ? 14 : 6;     // min seconds visible between cloaks
const VISIBLE_MAX = reduceMotion ? 26 : 15;    // max seconds visible between cloaks
const SEED_STRIDE = 2654435761;                // craft #i flies the same hull every visit
const SHRINK_EXPONENT = -0.22;
const SHRINK_FLOOR = 0.32;
const MIN_FONT_PX = 7;
const FORMATION_RADIUS_SHARE = 0.6;
const FORMATION_PAD_PX = 8;
const CLOAKED_BELOW = 0.3;
const HOLD_MIN_S = reduceMotion ? 8 : 2.5;
const HOLD_MAX_S = reduceMotion ? 24 : 11;
const COLLIDE_SHARE = 0.8;
const COLLIDE_COOLDOWN_S = 3;

const requested = Number(new URLSearchParams(location.search).get('n'));
const COUNT = Math.min(MAX_FLEET, Math.max(1, requested || FLEET_N || 1));

const mouse = { x: -9999, y: -9999, active: false };
addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
}, {passive:true});
addEventListener('pointerleave', () => { mouse.active = false; });
addEventListener('blur', () => { mouse.active = false; });

function fontPx(){
  const base = Math.min(22, Math.max(13, innerWidth*0.0375));
  return Math.max(MIN_FONT_PX, base * Math.max(SHRINK_FLOOR, Math.pow(COUNT, SHRINK_EXPONENT)));
}
function nextCloakDelay(){ return VISIBLE_MIN + Math.random()*(VISIBLE_MAX - VISIBLE_MIN); }

function makeCraft(index){
  const el = document.createElement('div');
  el.className = 'craft';
  el.style.fontSize = fontPx().toFixed(2) + 'px';
  el.style.opacity = '0';            // invisible until initMotion places it
  sky.appendChild(el);
  const rng = mulberry32(((index+1) * SEED_STRIDE) >>> 0);
  const craft = {
    el, rng,
    current: randomCraft(rng),
    queue: [],
    holdTimer: Math.random()*HOLD_MAX_S,
    shimmer: 0,
    cooldown: 0,
    x:0, y:0, vx:0, vy:0, w:0, h:0, ready:false,
    phase:'visible', opacity:1, timer:nextCloakDelay(),
  };
  el.innerHTML = gridToHTML(renderGrid(craft.current));
  return craft;
}

// Build the next leg: morph the craft into a fresh one (never the same
// family back-to-back, so each tour stays varied).
function nextLeg(craft){
  let c = randomCraft(craft.rng);
  if(c.family === craft.current.family){
    c = {...c, family:(craft.current.family + 1 +
          Math.floor(craft.rng()*(FAMILIES.length-1))) % FAMILIES.length};
  }
  const grids = morphFrames(craft.current, c, STEPS_EACH);
  craft.current = c;
  return grids;
}
function startLeg(craft){
  craft.queue.push(...nextLeg(craft));
  craft.holdTimer = HOLD_MIN_S + Math.random()*(HOLD_MAX_S - HOLD_MIN_S);
}

function bump(craft){
  if(craft.cooldown > 0 || craft.queue.length) return;
  craft.cooldown = COLLIDE_COOLDOWN_S;
  startLeg(craft);
}

function initMotion(craft){
  const r = craft.el.getBoundingClientRect();
  craft.w = r.width; craft.h = r.height;
  const maxX = Math.max(0, innerWidth  - craft.w);
  const maxY = Math.max(0, innerHeight - craft.h);
  craft.x = maxX * Math.random();
  craft.y = maxY * Math.random();
  const ang = Math.random()*Math.PI*2;
  craft.vx = Math.cos(ang)*BASE_SPEED;
  craft.vy = Math.sin(ang)*BASE_SPEED;
  craft.ready = true;
  craft.el.style.transform = `translate(${craft.x}px,${craft.y}px)`;
  craft.el.style.opacity = '1';
}

function teleport(craft){
  // jump to a fresh random spot with a new heading
  const maxX = Math.max(0, innerWidth  - craft.w);
  const maxY = Math.max(0, innerHeight - craft.h);
  craft.x = maxX * Math.random();
  craft.y = maxY * Math.random();
  const ang = Math.random()*Math.PI*2;
  craft.vx = Math.cos(ang)*BASE_SPEED;
  craft.vy = Math.sin(ang)*BASE_SPEED;
}

function interact(dtSec){
  for(let i=0;i<fleet.length;i++){
    const a = fleet[i];
    if(!a.ready || a.opacity < CLOAKED_BELOW) continue;
    for(let j=i+1;j<fleet.length;j++){
      const b = fleet[j];
      if(!b.ready || b.opacity < CLOAKED_BELOW) continue;
      const ax = a.x + a.w/2, ay = a.y + a.h/2;
      const bx = b.x + b.w/2, by = b.y + b.h/2;
      const rad = FORMATION_RADIUS_SHARE*(a.w + b.w)/2 + FORMATION_PAD_PX;
      const dx = ax-bx, dy = ay-by;
      const dist = Math.hypot(dx,dy) || 0.0001;
      if(dist >= rad) continue;
      const push = SEP_FORCE * (1 - dist/rad) / dist * dtSec;
      a.vx += dx*push; a.vy += dy*push;
      b.vx -= dx*push; b.vy -= dy*push;
      if(dist < rad*COLLIDE_SHARE){ bump(a); bump(b); }
    }
  }
}

function stepMotion(craft, dtSec){
  if(!craft.ready) return;
  const maxX = Math.max(0, innerWidth  - craft.w);
  const maxY = Math.max(0, innerHeight - craft.h);

  craft.cooldown = Math.max(0, craft.cooldown - dtSec);
  if(!craft.queue.length){
    craft.holdTimer -= dtSec;
    if(craft.holdTimer <= 0) startLeg(craft);
  }

  // ── cloak cycle: visible → fading out → (teleport) → fading in ──
  if(craft.phase === 'visible'){
    craft.opacity = 1;
    craft.timer -= dtSec;
    if(craft.timer <= 0){ craft.phase = 'out'; }
  } else if(craft.phase === 'out'){
    craft.opacity -= dtSec / FADE_OUT_T;
    if(craft.opacity <= 0){
      craft.opacity = 0;
      teleport(craft);            // relocate while fully invisible
      craft.phase = 'in';
    }
  } else if(craft.phase === 'in'){
    craft.opacity += dtSec / FADE_IN_T;
    if(craft.opacity >= 1){
      craft.opacity = 1;
      craft.phase = 'visible';
      craft.timer = nextCloakDelay();
    }
  }

  // curiosity: lean toward the cursor, easing off at the centre so a craft
  // drifts through and orbits rather than snapping onto the pointer
  if(mouse.active){
    const cx = craft.x + craft.w/2, cy = craft.y + craft.h/2;
    const dx = mouse.x - cx, dy = mouse.y - cy;
    const dist = Math.hypot(dx, dy) || 0.0001;
    if(dist < DRAW_RADIUS){
      const pull = DRAW_FORCE * (1 - dist/DRAW_RADIUS) * dtSec / dist;
      craft.vx += dx * pull;
      craft.vy += dy * pull;
    }
  }

  // gently relax speed back toward the base drift so the pull never accumulates
  const sp = Math.hypot(craft.vx, craft.vy) || 0.0001;
  const relaxed = sp + (BASE_SPEED - sp) * Math.min(1, dtSec*0.8);
  craft.vx = craft.vx/sp * Math.min(relaxed, MAX_SPEED);
  craft.vy = craft.vy/sp * Math.min(relaxed, MAX_SPEED);

  // integrate, then bounce off the walls
  craft.x += craft.vx * dtSec;
  craft.y += craft.vy * dtSec;
  if(craft.x <= 0){ craft.x = 0; craft.vx = Math.abs(craft.vx); }
  else if(craft.x >= maxX){ craft.x = maxX; craft.vx = -Math.abs(craft.vx); }
  if(craft.y <= 0){ craft.y = 0; craft.vy = Math.abs(craft.vy); }
  else if(craft.y >= maxY){ craft.y = maxY; craft.vy = -Math.abs(craft.vy); }

  craft.el.style.transform = `translate(${craft.x}px,${craft.y}px)`;
  craft.el.style.opacity = craft.opacity.toFixed(3);
}

const fleet = Array.from({length:COUNT}, (_,i) => makeCraft(i));

addEventListener('resize', () => {
  const px = fontPx().toFixed(2)+'px';
  for(const craft of fleet){
    craft.el.style.fontSize = px;
    const r = craft.el.getBoundingClientRect();
    craft.w = r.width; craft.h = r.height;
  }
});

let acc = 0, last = performance.now();

function loop(now){
  const rawDt = now - last; last = now;
  // advance every craft's position each frame for smooth drift
  const dtSec = Math.min(rawDt/1000, 0.05);
  interact(dtSec);
  for(const craft of fleet) stepMotion(craft, dtSec);
  // advance the morph animations at the fixed frame rate
  acc += rawDt;
  const interval = 1000/FPS;
  while(acc >= interval){
    acc -= interval;
    for(const craft of fleet){
      const grid = craft.queue.shift();
      if(grid){ craft.el.innerHTML = gridToHTML(grid); continue; }
      craft.shimmer++;
      craft.el.innerHTML = gridToHTML(renderGrid(
        {...craft.current, phase:(craft.current.phase + craft.shimmer) & 1}));
    }
  }
  requestAnimationFrame(loop);
}

// measure after layout settles, then place the fleet and start moving
requestAnimationFrame(() => {
  for(const craft of fleet) initMotion(craft);
  requestAnimationFrame(loop);
});
</script>
</body>
