# Default-deny ingress across the tenant namespace, then narrowly re-open ingress to the serve pods
# on the serve port (the ingress controller reaches them through the Service). Egress is left open:
# the whole-`serve` runtime must reach the model API, OAuth, S3, Postgres and Redis directly. Forcing
# sandbox egress through core's in-process proxy (metalcraft's egress-proxy tiering) is the pod
# carrier's concern (P2.b) and lands with it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "selfhost-tenant.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-serve-ingress
  labels:
    {{- include "selfhost-tenant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: selfhost-serve
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.serve_port }}
