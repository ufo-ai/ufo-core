[package]
name = "ufo"
version = "0.1.93"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "ufo"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
fancy-regex = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
iana-time-zone = "0.1"
mio = { version = "1", features = ["net", "os-poll"] }
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = { version = "2", default-features = false, features = ["unicode"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
unicode-width = "0.2"
ureq = { version = "2.12", features = ["native-certs"] }
zip = { version = "2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ring = "0.17"
signal-hook = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5" }
rcgen = "0.13"
vt100 = "0.15"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "stream"
harness = false
